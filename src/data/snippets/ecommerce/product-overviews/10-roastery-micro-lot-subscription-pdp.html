<section data-po10 class="mx-auto w-full max-w-5xl rounded-3xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 sm:p-8 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="grid grid-cols-1 gap-8 md:grid-cols-12 md:items-center">
    <div class="space-y-3 md:col-span-5">
      <div class="relative overflow-hidden rounded-2xl border border-stone-200 dark:border-zinc-800">
        <img src="/images/heroes/pour-over.jpg" alt="Single-Origin Micro-Lot Dispatch" class="h-72 sm:h-80 w-full object-cover" />
        <span class="absolute left-3 top-3 rounded-full bg-amber-950/85 px-3 py-1 font-mono text-[10px] font-semibold text-amber-100">ROASTED MONDAYS</span>
      </div>
      <div class="grid grid-cols-3 gap-2 rounded-xl bg-stone-50 dark:bg-zinc-950 p-3 text-[11px]">
        <div><span class="block text-[10px] text-stone-400">ORIGIN</span><span class="font-semibold">Huila, CO</span></div>
        <div><span class="block text-[10px] text-stone-400">ELEVATION</span><span class="font-semibold">1,950m</span></div>
        <div><span class="block text-[10px] text-stone-400">NOTES</span><span class="font-semibold">Bergamot, Fig</span></div>
      </div>
    </div>
    <div class="space-y-4 md:col-span-7 text-xs">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="font-mono text-[10px] uppercase tracking-widest text-amber-700 dark:text-amber-400">Kyoto &amp; Zurich Roastery</p>
          <h2 class="mt-1 text-2xl font-bold text-stone-900 dark:text-stone-100">Single-Origin Micro-Lot Dispatch</h2>
        </div>
        <span data-po10-pr class="font-mono text-2xl font-bold text-stone-900 dark:text-white">$22</span>
      </div>
      <p class="leading-relaxed text-stone-600 dark:text-stone-300">Small-batch washed Pink Bourbon roasted every Monday morning and nitrogen-flushed within four hours of cooling for peak aromatics.</p>
      <div>
        <p class="mb-2 font-semibold text-stone-900 dark:text-stone-100">Grind Profile: <span data-po10-gr class="font-normal text-stone-500 dark:text-zinc-400">Whole Bean</span></p>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-po10-g="Whole Bean" class="rounded-xl border-2 border-stone-900 dark:border-white bg-stone-900 dark:bg-white py-2 font-semibold text-white dark:text-stone-950">Whole Bean</button>
          <button type="button" data-po10-g="Pour-Over V60" class="rounded-xl border border-stone-200 dark:border-zinc-700 py-2 font-medium text-stone-700 dark:text-zinc-300 hover:border-stone-500">Pour-Over V60</button>
          <button type="button" data-po10-g="Fine Espresso" class="rounded-xl border border-stone-200 dark:border-zinc-700 py-2 font-medium text-stone-700 dark:text-zinc-300 hover:border-stone-500">Fine Espresso</button>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <button type="button" data-po10-frq="22" data-po10-mode="Subscribe Every 2 Wks" class="rounded-2xl border-2 border-amber-700 bg-amber-50 dark:bg-amber-500/15 p-3.5 text-left">
          <div class="flex items-center justify-between font-bold text-amber-950 dark:text-amber-200"><span>Subscribe &amp; Save</span><span>$22 / bag</span></div>
          <p class="mt-0.5 text-[11px] text-amber-800 dark:text-amber-300">Every 2 weeks · Skip or pause anytime</p>
        </button>
        <button type="button" data-po10-frq="26" data-po10-mode="One-Time Purchase" class="rounded-2xl border border-stone-200 dark:border-zinc-700 p-3.5 text-left">
          <div class="flex items-center justify-between font-bold text-stone-800 dark:text-zinc-200"><span>One-Time Bag</span><span>$26 / bag</span></div>
          <p class="mt-0.5 text-[11px] text-stone-500 dark:text-zinc-400">Single 250g nitrogen-sealed pouch</p>
        </button>
      </div>
      <div class="flex items-center gap-3 pt-2">
        <div class="flex items-center rounded-xl border border-stone-200 dark:border-zinc-700">
          <button type="button" data-po10-dec class="px-3 py-2.5 font-bold hover:bg-stone-100 dark:hover:bg-zinc-800">&minus;</button>
          <span data-po10-qty class="w-7 text-center font-mono font-bold">1</span>
          <button type="button" data-po10-inc class="px-3 py-2.5 font-bold hover:bg-stone-100 dark:hover:bg-zinc-800">+</button>
        </div>
        <button type="button" data-po10-btn class="flex-1 rounded-xl bg-stone-900 dark:bg-white py-3 font-bold text-white dark:text-slate-950 hover:bg-stone-800 dark:hover:bg-zinc-200 transition">Start Roaster Dispatch &mdash; $22</button>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  const r = document.querySelector('[data-po10]'); if (!r) return;
  const pr = r.querySelector('[data-po10-pr]'), gr = r.querySelector('[data-po10-gr]'), qtyEl = r.querySelector('[data-po10-qty]'), btn = r.querySelector('[data-po10-btn]');
  const gs = [...r.querySelectorAll('[data-po10-g]')], fs = [...r.querySelectorAll('[data-po10-frq]')];
  let unit = 22, qty = 1, grind = 'Whole Bean', mode = 'Subscribe Every 2 Wks';
  const upd = () => {
    const t = unit * qty; pr.textContent = '$' + t; qtyEl.textContent = String(qty);
    btn.textContent = (unit === 22 ? 'Start Roaster Dispatch' : 'Add Micro-Lot Bag') + ' — $' + t;
  };
  gs.forEach(b => b.addEventListener('click', () => {
    grind = b.dataset.po1G; gr.textContent = grind;
    gs.forEach(x => x.className = x === b ? 'rounded-xl border-2 border-stone-900 dark:border-white bg-stone-900 dark:bg-white py-2 font-semibold text-white dark:text-stone-950' : 'rounded-xl border border-stone-200 dark:border-zinc-700 py-2 font-medium text-stone-700 dark:text-zinc-300 hover:border-stone-500');
  }));
  fs.forEach(b => b.addEventListener('click', () => {
    unit = Number(b.dataset.po10Frq); mode = b.dataset.po10Mode; upd();
    fs.forEach(x => x.className = x === b ? 'rounded-2xl border-2 border-amber-700 bg-amber-50 dark:bg-amber-500/15 p-3.5 text-left' : 'rounded-2xl border border-stone-200 dark:border-zinc-700 p-3.5 text-left');
  }));
  r.querySelector('[data-po10-dec]')?.addEventListener('click', () => { if (qty > 1) { qty--; upd(); } });
  r.querySelector('[data-po10-inc]')?.addEventListener('click', () => { qty++; upd(); });
  btn?.addEventListener('click', () => { btn.textContent = 'Confirmed: ' + qty + 'x ' + grind + ' (' + mode + ')'; });
})();
</script>
