<section data-sc8 class="mx-auto w-full max-w-lg rounded-3xl border border-slate-200 dark:border-white/20 bg-gradient-to-br from-sky-50 dark:from-slate-900 via-white dark:via-sky-950 to-indigo-100/80 dark:to-slate-950 p-6 text-slate-900 dark:text-white shadow-xl">
  <div class="rounded-2xl border border-slate-900/10 dark:border-white/20 bg-white/75 dark:bg-white/10 p-5 backdrop-blur-2xl shadow-inner">
    <div class="flex items-center justify-between border-b border-slate-900/10 dark:border-white/15 pb-3.5">
      <h2 class="text-sm font-semibold">Express Checkout Bag</h2>
      <span class="rounded-full bg-emerald-500/15 px-2.5 py-0.5 text-[10px] font-semibold text-emerald-700 dark:text-emerald-300">1-Tap Wallet Ready</span>
    </div>
    <div class="mt-4 flex items-center justify-between gap-4 rounded-xl border border-slate-900/10 dark:border-white/15 bg-white/70 dark:bg-black/25 p-3.5">
      <div class="flex items-center gap-3">
        <img src="/images/ecommerce/clock.jpg" alt="Desk Clock" class="size-14 rounded-lg object-cover ring-1 ring-black/10" />
        <div>
          <p class="text-xs font-semibold">Dieter Sweep Desk Clock</p>
          <p class="text-[11px] text-slate-500 dark:text-sky-200/80">Brushed Steel &middot; Silent Quartz</p>
        </div>
      </div>
      <div class="flex items-center gap-2 font-mono text-xs">
        <button type="button" data-sc8-d class="cursor-pointer size-6 rounded bg-slate-200/80 dark:bg-white/15 font-bold">&minus;</button>
        <span data-sc8-q class="font-bold w-4 text-center">1</span>
        <button type="button" data-sc8-i class="cursor-pointer size-6 rounded bg-slate-200/80 dark:bg-white/15 font-bold">+</button>
      </div>
    </div>
    <div class="mt-5 flex items-center justify-between">
      <div><p class="text-[11px] text-slate-500 dark:text-white/60">Total (Free Courier)</p><p data-sc8-tot class="font-mono text-lg font-bold">$120.00</p></div>
      <div class="flex gap-2">
        <button type="button" class="cursor-pointer rounded-xl bg-black dark:bg-white px-4 py-2.5 text-xs font-semibold text-white dark:text-black">&#63743; Pay</button>
        <button type="button" class="cursor-pointer rounded-xl border border-slate-300 dark:border-white/25 px-3.5 py-2.5 text-xs font-semibold">Card</button>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  const root = document.querySelector('[data-sc8]'); if (!root) return;
  let q = 1;
  const qEl = root.querySelector('[data-sc8-q]'), tot = root.querySelector('[data-sc8-tot]');
  const sync = () => { if (qEl) qEl.textContent = String(q); if (tot) tot.textContent = '$' + (q * 120).toFixed(2); };
  root.querySelector('[data-sc8-i]')?.addEventListener('click', () => { q++; sync(); });
  root.querySelector('[data-sc8-d]')?.addEventListener('click', () => { if (q > 1) q--; sync(); });
})();
</script>
