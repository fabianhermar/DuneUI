<section data-sc2 class="mx-auto w-full max-w-md rounded-3xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 shadow-xl text-stone-900 dark:text-zinc-100">
  <div class="flex items-center justify-between">
    <h2 class="text-sm font-bold tracking-tight">Your Bag <span data-sc2-cnt class="font-normal text-stone-500">(2)</span></h2>
    <span data-sc2-ratio class="font-mono text-xs text-stone-500 dark:text-zinc-400">$114 / $150</span>
  </div>
  <div data-sc2-banner class="mt-3 rounded-xl bg-amber-50 dark:bg-amber-500/15 p-3 border border-amber-200/70 dark:border-amber-500/20">
    <p data-sc2-hint class="text-xs font-medium text-amber-950 dark:text-amber-200">Add <strong>$36.00</strong> more for complimentary Express Courier.</p>
    <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-amber-200/80 dark:bg-amber-950/60"><div data-sc2-bar class="h-full w-[76%] rounded-full bg-amber-600 transition-all duration-300"></div></div>
  </div>
  <div class="mt-4 divide-y divide-stone-100 dark:divide-zinc-800 border-b border-stone-100 dark:border-zinc-800 text-xs">
    <div class="flex items-center justify-between gap-3 py-3.5">
      <div class="flex items-center gap-3 min-w-0">
        <img src="/images/ecommerce/tote.jpg" alt="Canvas Tote" class="size-13 shrink-0 rounded-xl object-cover ring-1 ring-stone-200 dark:ring-zinc-700" />
        <div class="min-w-0"><p class="truncate font-semibold">Heavy Canvas Tote</p><p class="text-[11px] text-stone-500 dark:text-zinc-400">Natural &middot; 18L</p></div>
      </div>
      <span class="font-mono font-bold">$64</span>
    </div>
    <div class="flex items-center justify-between gap-3 py-3.5">
      <div class="flex items-center gap-3 min-w-0">
        <img src="/images/ecommerce/knitwear.jpg" alt="Merino Knit" class="size-13 shrink-0 rounded-xl object-cover ring-1 ring-stone-200 dark:ring-zinc-700" />
        <div class="min-w-0"><p class="truncate font-semibold">Ribbed Merino Knit</p><p class="text-[11px] text-stone-500 dark:text-zinc-400">Oatmeal &middot; M</p></div>
      </div>
      <span class="font-mono font-bold">$50</span>
    </div>
  </div>
  <div class="mt-4 flex items-center justify-between gap-3 rounded-xl border border-dashed border-stone-300 dark:border-zinc-700 bg-stone-50/70 dark:bg-zinc-800/40 p-3 text-xs">
    <div><p class="font-semibold">Pair with Merino Crew Socks</p><p class="text-[11px] text-stone-500 dark:text-zinc-400">Unlocks free express &middot; $38</p></div>
    <button type="button" data-sc2-upsell class="cursor-pointer shrink-0 rounded-lg bg-stone-900 dark:bg-white px-3 py-1.5 font-semibold text-white dark:text-stone-950 hover:opacity-90">+ Add</button>
  </div>
  <button type="button" class="cursor-pointer mt-4 w-full rounded-xl bg-stone-900 dark:bg-white py-3 text-xs font-semibold text-white dark:text-stone-950 hover:opacity-90 transition-opacity">Checkout &mdash; <span data-sc2-tot class="font-mono">$114.00</span></button>
</section>
<script>
(function(){
  const root = document.querySelector('[data-sc2]'); if (!root) return;
  let added = false;
  const btn = root.querySelector('[data-sc2-upsell]'), bar = root.querySelector('[data-sc2-bar]'), hint = root.querySelector('[data-sc2-hint]'), tot = root.querySelector('[data-sc2-tot]'), ratio = root.querySelector('[data-sc2-ratio]'), cnt = root.querySelector('[data-sc2-cnt]');
  btn?.addEventListener('click', () => {
    added = !added;
    if (bar) {
      bar.style.width = added ? '100%' : '76%';
      bar.className = added ? 'h-full rounded-full bg-emerald-600 transition-all duration-300' : 'h-full rounded-full bg-amber-600 transition-all duration-300';
    }
    if (hint) hint.innerHTML = added ? '<strong>Complimentary Express Courier unlocked!</strong>' : 'Add <strong>$36.00</strong> more for complimentary Express Courier.';
    if (tot) tot.textContent = added ? '$152.00' : '$114.00';
    if (ratio) ratio.textContent = added ? '$152 / $150 ✓' : '$114 / $150';
    if (cnt) cnt.textContent = added ? '(3)' : '(2)';
    btn.textContent = added ? 'Added ✓' : '+ Add';
  });
})();
</script>
