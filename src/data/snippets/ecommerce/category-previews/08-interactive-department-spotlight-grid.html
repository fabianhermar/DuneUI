<script>
(function(){
  const r = document.querySelector('[data-cp8]'); if (!r) return;
  const img = r.querySelector('[data-cp8-imgbox]'), ttl = r.querySelector('[data-cp8-title]'), sub = r.querySelector('[data-cp8-subtxt]'), cta = r.querySelector('[data-cp8-cta]');
  const ds = [...r.querySelectorAll('[data-cp8-dept]')];
  ds.forEach(b => b.addEventListener('click', () => {
    img.src = b.dataset.cp8Img; ttl.textContent = b.dataset.cp8Dept; sub.textContent = b.dataset.cp8Sub; cta.textContent = 'Shop ' + b.dataset.cp8Dept + ' →';
    ds.forEach(x => {
      const badge = x.querySelector('span');
      if (x === b) {
        x.className = 'rounded-2xl border-2 border-indigo-600 bg-indigo-50/60 dark:bg-indigo-500/10 p-4 text-left transition';
        badge.className = 'rounded-lg bg-indigo-600 px-2 py-1 font-mono text-[10px] font-bold text-white';
      } else {
        x.className = 'rounded-2xl border border-slate-200 dark:border-zinc-800 p-4 text-left hover:border-slate-400 dark:hover:border-zinc-600 transition';
        badge.className = 'rounded-lg bg-slate-100 dark:bg-zinc-900 px-2 py-1 font-mono text-[10px] font-bold text-slate-700 dark:text-zinc-300';
      }
    });
  }));
})();
</script>
