<script>
(function(){
  const r = document.querySelector('[data-cp9]'); if (!r) return;
  const img = r.querySelector('[data-cp9-imgbox]'), cnt = r.querySelector('[data-cp9-cnt]'), ttl = r.querySelector('[data-cp9-ttl]'), nt = r.querySelector('[data-cp9-nt]');
  const rows = [...r.querySelectorAll('[data-cp9-row]')];
  rows.forEach(b => b.addEventListener('click', () => {
    img.src = b.dataset.cp9Img; cnt.textContent = b.dataset.cp9Count; ttl.textContent = b.dataset.cp9Row; nt.textContent = b.dataset.cp9Note;
    rows.forEach(x => {
      const spanTitle = x.querySelector('span.font-serif');
      x.className = x === b ? 'flex w-full items-center justify-between py-4 text-left transition' : 'flex w-full items-center justify-between py-4 text-left opacity-70 hover:opacity-100 transition';
      spanTitle.className = x === b ? 'font-serif text-xl text-stone-900 dark:text-white underline underline-offset-4' : 'font-serif text-xl text-stone-900 dark:text-white';
    });
  }));
})();
</script>
