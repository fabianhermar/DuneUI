<script>
(function(){
  const r = document.querySelector('[data-cp10]'); if (!r) return;
  const bs = [...r.querySelectorAll('[data-cp10-tab]')], cards = [...r.querySelectorAll('[data-cp10-cat]')];
  bs.forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.cp10Tab;
    bs.forEach(x => x.className = x === b ? 'rounded-lg bg-white dark:bg-zinc-800 px-3.5 py-1.5 font-semibold text-slate-900 dark:text-white shadow-xs' : 'rounded-lg px-3.5 py-1.5 font-semibold text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white');
    cards.forEach(c => c.classList.toggle('hidden', t !== 'all' && c.dataset.cp10Cat !== t));
  }));
})();
</script>
