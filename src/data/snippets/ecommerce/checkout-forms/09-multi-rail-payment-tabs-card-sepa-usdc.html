<section data-ck9 class="mx-auto w-full max-w-3xl overflow-hidden rounded-3xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#0D101B] p-6 sm:p-8 shadow-xl text-xs text-slate-900 dark:text-zinc-100">
  <div class="grid grid-cols-1 gap-6 md:grid-cols-12 md:items-center">
    <div class="md:col-span-5 space-y-4">
      <img src="/images/auth/studio-desk.jpg" alt="Pro UI Archive" class="h-32 w-full rounded-2xl object-cover ring-1 ring-slate-200 dark:ring-white/15" />
      <div>
        <h3 class="text-base font-bold">DuneUI Pro Complete Archive</h3>
        <p class="mt-1 text-slate-500 dark:text-zinc-400">610+ Tailwind v4 components &amp; lifetime Figma updates.</p>
        <p class="mt-3 font-mono text-2xl font-bold">$299.00</p>
      </div>
    </div>
    <div class="md:col-span-7 space-y-4">
      <div class="grid grid-cols-3 gap-2">
        <button type="button" data-ck9-rail="card" class="cursor-pointer rounded-xl border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/70 dark:bg-indigo-500/15 py-2.5 font-semibold text-indigo-700 dark:text-indigo-300">Card</button>
        <button type="button" data-ck9-rail="sepa" class="cursor-pointer rounded-xl border border-slate-200 dark:border-zinc-700 py-2.5 font-semibold text-slate-600 dark:text-zinc-300">SEPA</button>
        <button type="button" data-ck9-rail="usdc" class="cursor-pointer rounded-xl border border-slate-200 dark:border-zinc-700 py-2.5 font-semibold text-slate-600 dark:text-zinc-300">USDC Base</button>
      </div>
      <div class="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900/70 p-4 space-y-3">
        <div data-ck9-pane="card" class="space-y-2.5">
          <input type="text" value="4242 •••• •••• 4242" class="w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3 py-2 font-mono focus:outline-none" />
          <div class="grid grid-cols-2 gap-2"><input type="text" value="09 / 28" class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3 py-2 font-mono" /><input type="text" value="519" class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3 py-2 font-mono" /></div>
        </div>
        <div data-ck9-pane="sepa" class="hidden space-y-2">
          <p class="font-semibold">Instant Euro IBAN Mandate</p>
          <input type="text" placeholder="DE89 3704 0044 0532 0130 00" class="w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3 py-2 font-mono" />
        </div>
        <div data-ck9-pane="usdc" class="hidden space-y-1.5">
          <p class="font-semibold text-emerald-600 dark:text-emerald-400">Zero-Fee Base L2 Settlement (299.00 USDC)</p>
          <p class="font-mono text-[11px] text-slate-500 dark:text-zinc-400 break-all">0x8a42F019bC7d3E2...49fB &middot; Est. Gas $0.01</p>
        </div>
      </div>
      <button type="button" data-ck9-pay class="cursor-pointer w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white hover:bg-indigo-500">Pay $299.00 via Card</button>
    </div>
  </div>
</section>
<script>
(function(){
  const root = document.querySelector('[data-ck9]'); if (!root) return;
  const bs = [...root.querySelectorAll('[data-ck9-rail]')], panes = [...root.querySelectorAll('[data-ck9-pane]')], pay = root.querySelector('[data-ck9-pay]');
  const onCls = 'cursor-pointer rounded-xl border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/70 dark:bg-indigo-500/15 py-2.5 font-semibold text-indigo-700 dark:text-indigo-300';
  const offCls = 'cursor-pointer rounded-xl border border-slate-200 dark:border-zinc-700 py-2.5 font-semibold text-slate-600 dark:text-zinc-300';
  const labels = { card: 'Pay $299.00 via Card', sepa: 'Authorize SEPA ($299.00)', usdc: 'Send 299.00 USDC on Base' };
  bs.forEach(b => b.addEventListener('click', () => {
    const r = b.dataset.ck9Rail;
    bs.forEach(x => { x.className = x === b ? onCls : offCls; });
    panes.forEach(p => p.classList.toggle('hidden', p.dataset.ck9Pane !== r));
    if (pay && r) pay.textContent = labels[r];
  }));
  pay?.addEventListener('click', () => { pay.textContent = 'License Key Dispatched ✓'; });
})();
</script>
