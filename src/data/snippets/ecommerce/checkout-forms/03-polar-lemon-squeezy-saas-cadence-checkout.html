<section data-ck3 class="mx-auto w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-lg text-slate-900 dark:text-zinc-100">
  <div class="grid grid-cols-1 lg:grid-cols-12">
    <div class="p-6 sm:p-8 lg:col-span-5 bg-slate-50/80 dark:bg-zinc-950 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-zinc-800 space-y-6">
      <div>
        <span class="rounded-full bg-indigo-50 dark:bg-indigo-500/15 px-2.5 py-1 font-mono text-[10px] font-bold text-indigo-700 dark:text-indigo-300">MERCHANT OF RECORD</span>
        <h2 class="mt-3 text-xl font-bold tracking-tight">DuneUI Pro Workspace</h2>
        <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400">Unlimited commercial projects, Figma tokens sync &amp; CI kit.</p>
      </div>
      <div class="grid grid-cols-2 gap-2.5 text-xs">
        <button type="button" data-ck3-cad="ann" class="cursor-pointer rounded-xl border-2 border-indigo-600 dark:border-indigo-400 bg-white dark:bg-zinc-900 p-3 text-left">
          <div class="flex items-center justify-between"><strong class="font-bold">Annual</strong><span class="rounded bg-emerald-500/15 px-1.5 py-0.5 font-mono text-[9px] font-bold text-emerald-700 dark:text-emerald-300">-20%</span></div>
          <p class="mt-1 font-mono font-bold">$278/yr</p>
        </button>
        <button type="button" data-ck3-cad="mon" class="cursor-pointer rounded-xl border border-slate-200 dark:border-zinc-800 bg-white/60 dark:bg-zinc-900/50 p-3 text-left">
          <strong class="block font-bold">Monthly</strong>
          <p class="mt-1 font-mono font-bold text-slate-500 dark:text-zinc-400">$29/mo</p>
        </button>
      </div>
      <dl class="space-y-2 border-t border-slate-200 dark:border-zinc-800 pt-4 text-xs">
        <div class="flex justify-between text-slate-500 dark:text-zinc-400"><dt>Subscription</dt><dd data-ck3-sub class="font-mono">$278.00</dd></div>
        <div class="flex justify-between text-slate-500 dark:text-zinc-400"><dt>Tax (<span data-ck3-rate>0% US</span>)</dt><dd data-ck3-tax class="font-mono">$0.00</dd></div>
        <div class="flex justify-between font-bold text-sm pt-2 border-t border-slate-200 dark:border-zinc-800"><dt>Due today</dt><dd data-ck3-tot class="font-mono">$278.00</dd></div>
      </dl>
    </div>

    <div class="p-6 sm:p-8 lg:col-span-7 space-y-4 text-xs">
      <h3 class="text-sm font-bold">Billing &amp; Payment</h3>
      <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">
        <div><label class="block font-semibold text-slate-600 dark:text-zinc-300">Work Email</label><input type="email" value="founders@acme.dev" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3.5 py-2.5 focus:outline-none" /></div>
        <div>
          <label class="block font-semibold text-slate-600 dark:text-zinc-300">Billing Country (Tax)</label>
          <select data-ck3-ctry class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3 py-2.5 focus:outline-none">
            <option value="0|0% US">United States (0%)</option>
            <option value="0.19|19% DE VAT">Germany (19% VAT)</option>
            <option value="0.20|20% UK VAT">United Kingdom (20% VAT)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block font-semibold text-slate-600 dark:text-zinc-300">Card Number</label>
        <input type="text" value="5500 4190 8821 1024" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3.5 py-2.5 font-mono focus:outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block font-semibold text-slate-600 dark:text-zinc-300">Expiry</label><input type="text" value="11 / 28" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3.5 py-2.5 font-mono focus:outline-none" /></div>
        <div><label class="block font-semibold text-slate-600 dark:text-zinc-300">CVC</label><input type="text" value="314" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 px-3.5 py-2.5 font-mono focus:outline-none" /></div>
      </div>
      <button type="button" data-ck3-cta class="cursor-pointer w-full rounded-xl bg-indigo-600 py-3.5 font-semibold text-white hover:bg-indigo-500 transition-colors">Subscribe &amp; Pay $278.00</button>
    </div>
  </div>
</section>
<script>
(function(){
  const root = document.querySelector('[data-ck3]'); if (!root) return;
  let base = 278, taxPct = 0, taxLbl = '0% US';
  const cads = [...root.querySelectorAll('[data-ck3-cad]')], ctry = root.querySelector('[data-ck3-ctry]');
  const onCls = 'cursor-pointer rounded-xl border-2 border-indigo-600 dark:border-indigo-400 bg-white dark:bg-zinc-900 p-3 text-left';
  const offCls = 'cursor-pointer rounded-xl border border-slate-200 dark:border-zinc-800 bg-white/60 dark:bg-zinc-900/50 p-3 text-left';
  const sync = () => {
    const t = base * taxPct, tot = base + t;
    root.querySelector('[data-ck3-sub]').textContent = '$' + base.toFixed(2);
    root.querySelector('[data-ck3-rate]').textContent = taxLbl;
    root.querySelector('[data-ck3-tax]').textContent = '$' + t.toFixed(2);
    root.querySelector('[data-ck3-tot]').textContent = '$' + tot.toFixed(2);
    root.querySelector('[data-ck3-cta]').textContent = 'Subscribe & Pay $' + tot.toFixed(2);
  };
  cads.forEach(c => c.addEventListener('click', () => {
    cads.forEach(x => { x.className = x === c ? onCls : offCls; });
    base = c.dataset.ck3Cad === 'ann' ? 278 : 29; sync();
  }));
  ctry?.addEventListener('change', () => {
    const [r, l] = ctry.value.split('|'); taxPct = Number(r); taxLbl = l; sync();
  });
})();
</script>
