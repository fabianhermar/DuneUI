<script>
(function(){
  const root = document.querySelector('[data-ck4]'); if (!root) return;
  const openStep = (n) => [1, 2, 3].forEach(i => {
    root.querySelector('[data-ck4-body="' + i + '"]')?.classList.toggle('hidden', i !== n);
    root.querySelector('[data-ck4-sum="' + i + '"]')?.classList.toggle('hidden', i === n);
  });
  root.querySelectorAll('[data-ck4-go]').forEach(b => b.addEventListener('click', () => openStep(Number(b.dataset.ck4Go))));
  const pay = root.querySelector('[data-ck4-pay]');
  pay?.addEventListener('click', () => { pay.textContent = 'Authorized ✓ Receipt Emailed'; });
})();
</script>
