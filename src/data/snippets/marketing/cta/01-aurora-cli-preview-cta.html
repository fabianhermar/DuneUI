<section class="relative w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-200 dark:border-white/15 bg-white dark:bg-zinc-900 p-6 text-slate-900 dark:text-white shadow-lg dark:shadow-2xl sm:p-10">
  <div class="pointer-events-none absolute -top-24 left-1/2 h-64 w-96 -translate-x-1/2 rounded-full bg-indigo-50 dark:bg-indigo-500/25 blur-3xl"></div>
  <div class="pointer-events-none absolute inset-0 bg-[linear-gradient(to_right,#ffffff08_1px,transparent_1px),linear-gradient(to_bottom,#ffffff08_1px,transparent_1px)] bg-[size:28px_28px] [mask-image:radial-gradient(ellipse_at_center,black_40%,transparent_80%)]"></div>
  <div class="relative z-10 grid grid-cols-1 items-center gap-8 lg:grid-cols-12">
    <div class="min-w-0 lg:col-span-7">
      <div class="inline-flex items-center gap-2 rounded-full border border-indigo-400/30 bg-indigo-50 dark:bg-indigo-500/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">
        <span class="h-1.5 w-1.5 rounded-full bg-indigo-400 shadow-[0_0_8px_#818cf8]"></span>
        Production Engine v2.8
      </div>
      <h3 class="mt-4 text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Ship interfaces that feel unfair to compete against.</h3>
      <p class="mt-3 max-w-xl text-sm leading-relaxed text-slate-600 dark:text-zinc-400">Zero runtime lock-in, semantic Tailwind v4 tokens, and dark surfaces engineered for instant visual authority.</p>
      <div class="mt-7 flex flex-wrap items-center gap-3">
        <button type="button" class="group inline-flex items-center gap-2 rounded-xl bg-slate-900 dark:bg-white px-5 py-3 text-sm font-bold text-white dark:text-zinc-950 shadow-sm dark:shadow-[0_0_30px_rgba(255,255,255,0.2)] transition hover:bg-slate-800 dark:hover:bg-indigo-100">
          Start Building Free
          <span class="transition-transform group-hover:translate-x-0.5">→</span>
        </button>
        <button type="button" class="inline-flex items-center gap-2.5 rounded-xl border border-slate-900/15 dark:border-white/15 bg-slate-900/[0.07] dark:bg-white/5 px-5 py-3 text-sm font-semibold text-slate-800 dark:text-zinc-200 transition hover:bg-slate-900/[0.12] dark:hover:bg-white/10">
          Live Sandbox
          <kbd class="rounded border border-slate-900/15 dark:border-white/20 bg-white dark:bg-black/50 px-1.5 py-0.5 font-mono text-[10px] text-slate-600 dark:text-zinc-400">⌘K</kbd>
        </button>
      </div>
    </div>
    <div class="min-w-0 lg:col-span-5">
      <div class="rounded-2xl border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-[#0F1219]/90 p-4 shadow-inner backdrop-blur">
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-white/15 pb-3">
          <div class="flex items-center gap-1.5">
            <span class="h-2.5 w-2.5 rounded-full bg-rose-500/80"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-amber-400/80"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-400/80"></span>
          </div>
          <span class="font-mono text-[10px] uppercase tracking-wider text-slate-500 dark:text-zinc-500">terminal</span>
        </div>
        <div class="mt-3 flex items-center justify-between gap-2 rounded-xl border border-slate-900/15 dark:border-white/10 bg-slate-900/[0.06] dark:bg-black/60 px-3 py-2.5 font-mono text-xs text-emerald-700 dark:text-emerald-300">
          <span class="truncate"><span class="text-slate-500 dark:text-zinc-500">$</span> npx dune-ui@latest init</span>
          <button type="button" data-copy-cmd class="shrink-0 rounded-md border border-slate-900/15 dark:border-white/15 bg-white dark:bg-white/10 px-2 py-1 text-[10px] font-semibold text-slate-900 dark:text-white transition hover:bg-slate-100 dark:hover:bg-white/20">Copy</button>
        </div>
        <div class="mt-3 grid grid-cols-3 gap-2 text-center">
          <div class="rounded-lg border border-slate-900/15 dark:border-white/5 bg-slate-900/[0.07] dark:bg-white/[0.03] py-2">
            <p class="font-mono text-sm font-bold text-slate-900 dark:text-white">0 kB</p>
            <p class="text-[10px] text-slate-500 dark:text-zinc-500">Runtime JS</p>
          </div>
          <div class="rounded-lg border border-slate-900/15 dark:border-white/5 bg-slate-900/[0.07] dark:bg-white/[0.03] py-2">
            <p class="font-mono text-sm font-bold text-indigo-600 dark:text-indigo-300">400+</p>
            <p class="text-[10px] text-slate-500 dark:text-zinc-500">Components</p>
          </div>
          <div class="rounded-lg border border-slate-900/15 dark:border-white/5 bg-slate-900/[0.07] dark:bg-white/[0.03] py-2">
            <p class="font-mono text-sm font-bold text-emerald-700 dark:text-emerald-300">100</p>
            <p class="text-[10px] text-slate-500 dark:text-zinc-500">Lighthouse</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const btn = document.currentScript.parentElement.querySelector('[data-copy-cmd]');
      if (!btn) return;
      btn.addEventListener('click', () => {
        navigator.clipboard?.writeText('npx dune-ui@latest init').catch(() => {});
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('bg-emerald-500/30', 'text-emerald-200');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('bg-emerald-500/30', 'text-emerald-200');
        }, 1600);
      });
    })();
  </script>
</section>
