<section class="w-full max-w-4xl overflow-hidden rounded-3xl border border-orange-200 dark:border-orange-500/30 bg-gradient-to-r from-[#FFF7ED] via-white to-[#FFF1F2] dark:from-zinc-900 dark:via-zinc-900 dark:to-orange-950/30 p-5 shadow-lg sm:p-7 text-slate-900 dark:text-zinc-100">
  <div class="flex flex-col justify-between gap-5 lg:flex-row lg:items-center">
    <div class="min-w-0">
      <div class="flex flex-wrap items-center gap-2">
        <span class="rounded-full bg-orange-600 px-2.5 py-0.5 text-[10px] font-black uppercase tracking-wider text-white">48H LAUNCH OFFER</span>
        <span class="font-mono text-xs font-bold text-orange-800 dark:text-orange-300">CODE: DUNE30</span>
      </div>
      <h3 class="mt-2.5 text-xl font-bold tracking-tight text-stone-950 dark:text-white sm:text-2xl">Save 30% on annual Studio team seats before Friday.</h3>
      <div class="mt-3 flex flex-wrap items-center gap-2" data-seat-picker>
        <span class="text-xs font-semibold text-stone-600 dark:text-stone-300">Team size:</span>
        <button type="button" data-save="Save $216/yr" class="rounded-full border border-stone-900 dark:border-zinc-200 bg-stone-900 dark:bg-white px-3 py-1 text-xs font-bold text-white dark:text-slate-950">5 seats</button>
        <button type="button" data-save="Save $648/yr" class="rounded-full border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-1 text-xs font-semibold text-stone-700 dark:text-stone-300 hover:border-stone-500 dark:hover:border-zinc-500">15 seats</button>
        <button type="button" data-save="Save $2,160/yr" class="rounded-full border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-1 text-xs font-semibold text-stone-700 dark:text-stone-300 hover:border-stone-500 dark:hover:border-zinc-500">50 seats</button>
      </div>
    </div>
    <div class="flex shrink-0 flex-col items-start gap-2 rounded-2xl border border-orange-200 dark:border-orange-500/30 bg-white dark:bg-zinc-900 p-4 shadow-sm sm:flex-row sm:items-center lg:flex-col lg:items-end text-black dark:text-zinc-100">
      <p data-save-label class="font-mono text-sm font-black text-orange-600 dark:text-orange-400">Save $216/yr</p>
      <button type="button" class="rounded-full bg-stone-950 dark:bg-white px-6 py-2.5 text-xs font-bold text-white dark:text-slate-950 transition hover:bg-orange-600 dark:hover:bg-orange-500 dark:hover:text-white">Claim Team Discount →</button>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.parentElement;
      const btns = root.querySelectorAll('[data-save]');
      const out = root.querySelector('[data-save-label]');
      btns.forEach((b) => {
        b.addEventListener('click', () => {
          btns.forEach((x) => {
            x.className = 'rounded-full border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-1 text-xs font-semibold text-stone-700 dark:text-stone-300 hover:border-stone-500 dark:hover:border-zinc-500';
          });
          b.className = 'rounded-full border border-stone-900 dark:border-zinc-200 bg-stone-900 dark:bg-white px-3 py-1 text-xs font-bold text-white dark:text-slate-950';
          if (out) out.textContent = b.dataset.save;
        });
      });
    })();
  </script>
</section>
