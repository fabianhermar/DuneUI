    <img src="/images/auth/architectural-shadow.jpg" alt="Architectural design studio" class="h-full w-full object-cover" />

    <div class="absolute inset-x-4 bottom-4 rounded-2xl border border-slate-900/15 dark:border-white/15 bg-stone-950/75 p-3.5 text-slate-900 dark:text-white backdrop-blur-md">

            Next slot: Today, 14:30 CET
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="flex flex-col justify-between p-6 md:col-span-7 sm:p-9">
    <div>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-100 dark:bg-amber-500/15 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-amber-900 dark:text-amber-200">Enterprise Advisory</span>
      <h3 class="mt-3 text-2xl font-bold tracking-tight text-stone-950 dark:text-white sm:text-3xl">Book a live design system architecture review.</h3>

        <button type="button" data-topic="Multi-Brand Theme" class="rounded-full border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3.5 py-1.5 text-xs font-semibold text-stone-700 dark:text-stone-300 hover:border-stone-500 dark:hover:border-zinc-500">Multi-Brand Theme</button>
      </div>
    </div>
    <div class="mt-6 space-y-3 border-t border-stone-200 dark:border-zinc-800 pt-5">

        <span class="font-semibold text-stone-700 dark:text-stone-300">Avg. response: 18 mins</span>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.parentElement;
      const btns = root.querySelectorAll('[data-topic]');
      const bookBtn = root.querySelector('[data-book-btn]');
      btns.forEach((b) => {
        b.addEventListener('click', () => {
          btns.forEach((x) => {
            x.className = 'rounded-full border border-stone-300 bg-white px-3.5 py-1.5 text-xs font-semibold text-stone-700 hover:border-stone-500';
          });
          b.className = 'rounded-full border border-stone-900 bg-stone-900 px-3.5 py-1.5 text-xs font-semibold text-white';
          if (bookBtn) bookBtn.textContent = 'Book ' + b.dataset.topic + ' →';
        });
      });
    })();
  </script>
</section>
