<section data-ct-6 class="mx-auto w-full max-w-5xl rounded-3xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#0D0F14] p-7 sm:p-10 text-slate-900 dark:text-white shadow-sm">
  <div class="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:items-center">
    <form data-ct-form class="space-y-4 lg:col-span-6">
      <p class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">Migration Advisory</p>
      <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-3xl">Let&rsquo;s talk about your project</h2>
      <p class="text-sm text-slate-600 dark:text-zinc-300">We partner with product engineering teams to unify multi-brand design systems without shipping rewrites.</p>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <input type="text" required placeholder="Your name" class="rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
        <input type="email" required placeholder="Work email" class="rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
      </div>
      <textarea rows="3" required placeholder="Project scope, target stack, and expected launch quarter..." class="w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none"></textarea>
      <div class="flex flex-wrap items-center gap-3">
        <button type="submit" class="rounded-xl bg-slate-900 dark:bg-white px-5 py-2.5 text-sm font-semibold text-white dark:text-slate-950 hover:bg-indigo-600 dark:hover:bg-zinc-200 transition cursor-pointer">Send inquiry &rarr;</button>
        <span data-ct-ok class="hidden text-xs font-semibold text-emerald-600 dark:text-emerald-400">Inquiry received!</span>
      </div>
    </form>

    <figure class="overflow-hidden rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.04] lg:col-span-6">
      <div class="relative h-40 overflow-hidden">
        <img src="/images/auth/team-session.jpg" alt="Design systems engineering team workshop" class="h-full w-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
        <span class="absolute bottom-3 left-4 rounded-full bg-white/15 px-2.5 py-1 font-mono text-[10px] font-bold uppercase tracking-wider text-white backdrop-blur-md">Case Study · NordBank</span>
      </div>
      <div class="p-6">
        <blockquote class="font-serif text-lg italic leading-relaxed text-slate-800 dark:text-zinc-200">&ldquo;Onboarding with their architecture team shaved six weeks off our global storefront migration while cutting bundle CSS by 48%.&rdquo;</blockquote>
        <figcaption class="mt-5 flex items-center justify-between gap-3 border-t border-slate-200/80 dark:border-white/10 pt-4">
          <div class="flex items-center gap-3">
            <img src="/images/testimonials/henrik.jpg" alt="Henrik Lindqvist" class="size-10 rounded-full object-cover ring-2 ring-white dark:ring-zinc-800" />
            <div class="text-xs">
              <p class="font-bold text-slate-900 dark:text-white">Henrik Lindqvist</p>
              <p class="text-slate-500 dark:text-zinc-400">VP Engineering, NordBank</p>
            </div>
          </div>
          <span class="rounded-lg bg-emerald-500/10 px-2.5 py-1 font-mono text-[11px] font-bold text-emerald-700 dark:text-emerald-300">-48% CSS</span>
        </figcaption>
      </div>
    </figure>
  </div>
</section>
<script>
  document.querySelectorAll('[data-ct-6]').forEach((root) => {
    const f = root.querySelector('[data-ct-form]');
    const ok = root.querySelector('[data-ct-ok]');
    f?.addEventListener('submit', (e) => {
      e.preventDefault();
      ok?.classList.remove('hidden');
    });
  });
</script>
