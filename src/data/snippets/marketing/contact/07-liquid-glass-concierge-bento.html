<section data-ct-7 class="mx-auto w-full max-w-4xl rounded-3xl border border-slate-200/80 dark:border-white/15 bg-gradient-to-br from-sky-50 via-white to-indigo-100/80 dark:from-[#0F172A] dark:via-[#1E1B4B] dark:to-[#4A044E] p-5 shadow-xl dark:shadow-2xl sm:p-8 text-slate-900 dark:text-white">
  <div class="grid grid-cols-1 gap-7 rounded-2xl border border-white/80 dark:border-white/20 bg-white/75 dark:bg-white/10 p-6 backdrop-blur-2xl sm:p-8 lg:grid-cols-12">
    <div class="flex flex-col justify-between lg:col-span-5">
      <div>
        <span class="inline-flex items-center gap-1.5 rounded-full border border-cyan-500/30 bg-cyan-500/15 px-2.5 py-1 font-mono text-[10px] font-bold uppercase tracking-[0.18em] text-cyan-800 dark:text-cyan-200">
          <span class="size-1.5 rounded-full bg-cyan-500"></span> Studio Concierge
        </span>
        <h2 class="mt-3 text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Start a live conversation</h2>
        <p class="mt-2 text-xs leading-relaxed text-slate-700 dark:text-white/80">Book a 30-minute architecture pairing session directly with our staff interface engineers.</p>
      </div>

      <div class="mt-6 flex items-center gap-3 rounded-xl border border-slate-900/10 dark:border-white/15 bg-white/70 dark:bg-black/25 p-3">
        <img src="/images/auth/studio-desk.jpg" alt="Studio workspace" class="size-11 rounded-lg object-cover" />
        <div class="text-xs">
          <p class="font-semibold text-slate-900 dark:text-white">Next open window</p>
          <p class="font-mono text-[11px] text-indigo-700 dark:text-cyan-300">Tomorrow · 14:30 UTC</p>
        </div>
      </div>
    </div>

    <form data-ct-form class="space-y-3 lg:col-span-7">
      <input type="email" required placeholder="you@studio.com" class="w-full rounded-xl border border-slate-900/15 dark:border-white/25 bg-white/80 dark:bg-black/30 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-500 dark:placeholder:text-white/55 focus:border-cyan-500 focus:outline-none" />
      <div class="grid grid-cols-3 gap-2 font-mono text-[11px]">
        <label class="flex cursor-pointer items-center justify-center rounded-xl border border-slate-900/15 dark:border-white/20 bg-white/60 dark:bg-white/5 py-2 font-semibold text-slate-800 dark:text-white has-[:checked]:border-cyan-500 has-[:checked]:bg-cyan-500/15"><input type="radio" name="ct7-tier" checked class="sr-only" />UI Audit</label>
        <label class="flex cursor-pointer items-center justify-center rounded-xl border border-slate-900/15 dark:border-white/20 bg-white/60 dark:bg-white/5 py-2 font-semibold text-slate-800 dark:text-white has-[:checked]:border-cyan-500 has-[:checked]:bg-cyan-500/15"><input type="radio" name="ct7-tier" class="sr-only" />Migration</label>
        <label class="flex cursor-pointer items-center justify-center rounded-xl border border-slate-900/15 dark:border-white/20 bg-white/60 dark:bg-white/5 py-2 font-semibold text-slate-800 dark:text-white has-[:checked]:border-cyan-500 has-[:checked]:bg-cyan-500/15"><input type="radio" name="ct7-tier" class="sr-only" />Custom Kit</label>
      </div>
      <textarea rows="3" required placeholder="What are you shipping next?" class="w-full rounded-xl border border-slate-900/15 dark:border-white/25 bg-white/80 dark:bg-black/30 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-500 dark:placeholder:text-white/55 focus:border-cyan-500 focus:outline-none"></textarea>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <button type="submit" class="rounded-xl bg-slate-900 dark:bg-white px-5 py-2.5 text-xs font-bold text-white dark:text-slate-950 hover:bg-indigo-600 dark:hover:bg-cyan-200 transition cursor-pointer">Book Live Session &rarr;</button>
        <span data-ct-ok class="hidden text-xs font-semibold text-emerald-700 dark:text-emerald-300">Session link sent!</span>
      </div>
    </form>
  </div>
</section>
<script>
  document.querySelectorAll('[data-ct-7]').forEach((root) => {
    const f = root.querySelector('[data-ct-form]');
    const ok = root.querySelector('[data-ct-ok]');
    f?.addEventListener('submit', (e) => {
      e.preventDefault();
      ok?.classList.remove('hidden');
    });
  });
</script>
