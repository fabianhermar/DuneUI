<section data-ct-5 class="relative mx-auto w-full max-w-2xl overflow-hidden rounded-3xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#0D0F14] p-7 shadow-xl dark:shadow-2xl sm:p-10 text-slate-900 dark:text-white">
  <div class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-indigo-500/60 to-transparent"></div>
  <div class="text-center">
    <div class="inline-flex items-center gap-2.5 rounded-full border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 px-3 py-1">
      <div class="flex -space-x-1.5">
        <img src="/images/testimonials/daniel.jpg" alt="Daniel" class="size-5 rounded-full object-cover ring-2 ring-white dark:ring-[#0D0F14]" />
        <img src="/images/testimonials/maya.jpg" alt="Maya" class="size-5 rounded-full object-cover ring-2 ring-white dark:ring-[#0D0F14]" />
      </div>
      <span class="font-mono text-[10px] font-bold uppercase tracking-wider text-indigo-700 dark:text-indigo-300">Live 20-min Walkthrough</span>
    </div>
    <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-3xl">Contact sales</h2>
    <p class="mt-2 text-sm text-slate-600 dark:text-zinc-300">Tell us about your team requirements and get a tailored design system workspace demo.</p>
  </div>

  <form data-ct-form class="mt-7 space-y-4">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">First name</label>
        <input type="text" required placeholder="Elena" class="mt-1.5 w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">Last name</label>
        <input type="text" required placeholder="Morales" class="mt-1.5 w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
      </div>
    </div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">Company</label>
        <input type="text" required placeholder="NordBank AB" class="mt-1.5 w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">Team seats</label>
        <select class="mt-1.5 w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-[#161922] px-3.5 py-2.5 text-sm text-slate-900 dark:text-white focus:border-indigo-500 focus:outline-none">
          <option>10–25 seats</option>
          <option>25–100 seats</option>
          <option>100+ seats</option>
        </select>
      </div>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">Work email</label>
      <input type="email" required placeholder="elena@nordbank.com" class="mt-1.5 w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">How can we help?</label>
      <textarea rows="3" placeholder="Multi-brand theming, Figma token sync, private registry..." class="mt-1.5 w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none"></textarea>
    </div>
    <button type="submit" class="w-full rounded-xl bg-indigo-600 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition cursor-pointer">Book tailored demo &rarr;</button>
    <p data-ct-ok class="hidden rounded-xl border border-emerald-200 dark:border-emerald-500/30 bg-emerald-50 dark:bg-emerald-500/15 px-3.5 py-2 text-center text-xs font-semibold text-emerald-700 dark:text-emerald-300">Request confirmed &mdash; check your inbox for available times.</p>
  </form>

  <div class="mt-6 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 border-t border-slate-100 dark:border-white/10 pt-5 font-mono text-[10px] font-bold uppercase tracking-widest text-slate-400 dark:text-zinc-500">
    <span>NordBank</span>
    <span>Kestrel Cloud</span>
    <span>Vellum Studio</span>
    <span>LinearOps</span>
  </div>
</section>
<script>
  document.querySelectorAll('[data-ct-5]').forEach((root) => {
    const f = root.querySelector('[data-ct-form]');
    const ok = root.querySelector('[data-ct-ok]');
    f?.addEventListener('submit', (e) => {
      e.preventDefault();
      ok?.classList.remove('hidden');
    });
  });
</script>
