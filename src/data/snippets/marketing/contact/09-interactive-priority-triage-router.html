<section data-ct-9 class="mx-auto w-full max-w-3xl rounded-3xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#0D0F14] p-7 shadow-sm sm:p-9 text-slate-900 dark:text-white">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div>
      <p class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">Smart Dispatch</p>
      <h2 class="mt-1 text-xl font-bold text-slate-900 dark:text-white sm:text-2xl">Select inquiry route</h2>
    </div>
    <span data-ct-sla-lbl class="rounded-full border border-emerald-200 dark:border-emerald-500/30 bg-emerald-50 dark:bg-emerald-500/15 px-3 py-1 font-mono text-[11px] font-bold text-emerald-700 dark:text-emerald-300">Reply in 1 hour</span>
  </div>

  <div role="group" aria-label="Contact route" class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-3">
    <button type="button" data-ct-route="Enterprise Demo" data-ct-sla="Reply in 1 hour" data-ct-hint="Share your team size and preferred date..." class="rounded-2xl border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/80 dark:bg-indigo-500/15 p-3.5 text-left transition cursor-pointer">
      <p class="text-xs font-bold text-indigo-950 dark:text-indigo-200">Enterprise Demo</p>
      <p class="mt-1 font-mono text-[10px] text-indigo-700 dark:text-indigo-300">Solutions Architects</p>
    </button>
    <button type="button" data-ct-route="Billing &amp; Licensing" data-ct-sla="Reply in 3 hours" data-ct-hint="Include your invoice ID or workspace slug..." class="rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50/60 dark:bg-white/[0.03] p-3.5 text-left transition hover:border-slate-400 dark:hover:border-white/25 cursor-pointer">
      <p class="text-xs font-semibold text-slate-800 dark:text-zinc-200">Billing &amp; Licensing</p>
      <p class="mt-1 font-mono text-[10px] text-slate-500 dark:text-zinc-400">Account Operations</p>
    </button>
    <button type="button" data-ct-route="Security Report" data-ct-sla="24/7 Pager triage" data-ct-hint="Describe the vulnerability or attach PGP fingerprint..." class="rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50/60 dark:bg-white/[0.03] p-3.5 text-left transition hover:border-slate-400 dark:hover:border-white/25 cursor-pointer">
      <p class="text-xs font-semibold text-slate-800 dark:text-zinc-200">Security Report</p>
      <p class="mt-1 font-mono text-[10px] text-slate-500 dark:text-zinc-400">PSIRT On-Call</p>
    </button>
  </div>

  <form data-ct-form class="mt-6 space-y-3.5 border-t border-slate-200/80 dark:border-white/10 pt-5">
    <div class="flex flex-wrap items-center justify-between text-xs">
      <span class="text-slate-600 dark:text-zinc-400">Routing to: <strong data-ct-target class="font-bold text-slate-900 dark:text-white">Enterprise Demo</strong></span>
    </div>
    <input type="email" required placeholder="you@company.com" class="w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none" />
    <textarea data-ct-textarea rows="2" required placeholder="Share your team size and preferred date..." class="w-full rounded-xl border border-slate-300 dark:border-white/15 bg-slate-50/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none"></textarea>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <button type="submit" class="rounded-xl bg-slate-900 dark:bg-white px-5 py-2.5 text-xs font-bold text-white dark:text-slate-950 hover:bg-indigo-600 dark:hover:bg-zinc-200 transition cursor-pointer">Send Request &rarr;</button>
      <span data-ct-ok class="hidden text-xs font-semibold text-emerald-600 dark:text-emerald-400">Dispatched to queue!</span>
    </div>
  </form>
</section>
<script>
  document.querySelectorAll('[data-ct-9]').forEach((root) => {
    const btns = root.querySelectorAll('[data-ct-route]');
    const target = root.querySelector('[data-ct-target]');
    const sla = root.querySelector('[data-ct-sla-lbl]');
    const ta = root.querySelector('[data-ct-textarea]');
    const form = root.querySelector('[data-ct-form]');
    const ok = root.querySelector('[data-ct-ok]');
    const activeCls = 'rounded-2xl border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/80 dark:bg-indigo-500/15 p-3.5 text-left transition cursor-pointer';
    const idleCls = 'rounded-2xl border border-slate-200 dark:border-white/10 bg-slate-50/60 dark:bg-white/[0.03] p-3.5 text-left transition hover:border-slate-400 dark:hover:border-white/25 cursor-pointer';
    btns.forEach((b) => b.addEventListener('click', () => {
      btns.forEach((x) => { x.className = x === b ? activeCls : idleCls; });
      if (target) target.textContent = b.getAttribute('data-ct-route') || '';
      if (sla) sla.textContent = b.getAttribute('data-ct-sla') || '';
      if (ta) ta.setAttribute('placeholder', b.getAttribute('data-ct-hint') || '');
    }));
    form?.addEventListener('submit', (e) => {
      e.preventDefault();
      ok?.classList.remove('hidden');
    });
  });
</script>
