<div data-bn-9 class="mx-auto flex w-full max-w-3xl flex-wrap items-center justify-between gap-3 rounded-2xl border border-indigo-200 dark:border-indigo-500/30 bg-indigo-50/90 dark:bg-indigo-500/12 px-5 py-3 text-xs text-indigo-950 dark:text-indigo-100 shadow-xs">
  <div class="flex flex-wrap items-center gap-2.5">
    <span class="rounded-md bg-indigo-600 px-2 py-0.5 font-mono text-[10px] font-bold uppercase text-white">SAVE 25%</span>
    <span>Get <strong>25% off</strong> annual Studio Team seats through November 30.</span>
  </div>
  <button type="button" data-bn-copy="DUNE25" class="inline-flex items-center gap-2 rounded-xl border border-indigo-300 dark:border-indigo-400/40 bg-white dark:bg-[#0D0F14] px-3.5 py-1.5 font-mono text-[11px] font-bold text-indigo-700 dark:text-indigo-300 shadow-2xs hover:bg-indigo-600 hover:border-indigo-600 hover:text-white dark:hover:bg-indigo-500 dark:hover:text-white transition cursor-pointer">
    <span data-bn-copy-txt>DUNE25</span>
    <span class="opacity-60">&bull;</span>
    <span data-bn-copy-status>Copy</span>
  </button>
</div>
<script>
  document.querySelectorAll('[data-bn-9]').forEach((root) => {
    const btn = root.querySelector('[data-bn-copy]');
    const status = root.querySelector('[data-bn-copy-status]');
    btn?.addEventListener('click', () => {
      const code = btn.getAttribute('data-bn-copy') || 'DUNE25';
      navigator.clipboard?.writeText(code).catch(() => {});
      if (status) {
        status.textContent = 'Copied!';
        setTimeout(() => { status.textContent = 'Copy'; }, 1800);
      }
    });
  });
</script>
