<div data-bn-1 class="relative mx-auto flex w-full max-w-5xl items-center justify-between gap-4 overflow-hidden rounded-2xl bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 px-4 py-3 text-xs text-white shadow-lg ring-1 ring-inset ring-white/20 sm:px-5">
  <div class="flex flex-wrap items-center gap-3">
    <div class="flex -space-x-1.5 shrink-0">
      <img src="/images/avatars/sofia.jpg" alt="Sofia" class="size-5 rounded-full object-cover ring-2 ring-indigo-600" />
      <img src="/images/avatars/mateo.jpg" alt="Mateo" class="size-5 rounded-full object-cover ring-2 ring-violet-600" />
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="rounded-full bg-white/15 px-2 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider backdrop-blur-xs">DuneConf 2026</span>
      <span class="font-medium text-white/95">Join us live in San Francisco &amp; Tokyo &mdash; Nov 19&ndash;21.</span>
    </div>
    <a href="#" class="inline-flex items-center gap-1 rounded-full bg-white px-3 py-1 text-[11px] font-bold text-indigo-700 shadow-xs hover:bg-indigo-50 transition">Register now &rarr;</a>
  </div>
  <button type="button" data-bn-close aria-label="Dismiss banner" class="shrink-0 rounded-lg p-1.5 text-white/80 hover:bg-white/15 hover:text-white transition cursor-pointer">
    <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>
<script>
  document.querySelectorAll('[data-bn-1]').forEach((root) => {
    const closeBtn = root.querySelector('[data-bn-close]');
    closeBtn?.addEventListener('click', () => {
      root.classList.add('hidden');
    });
  });
</script>
