<section data-lp-auto data-entered="true" class="group/car relative mx-auto w-full max-w-5xl overflow-hidden rounded-3xl border border-stone-200/90 dark:border-white/12 bg-gradient-to-b from-[#F4F4F6] via-[#F7F7F8] to-[#ECEEF2] dark:from-[#0A0C12] dark:via-[#080A0F] dark:to-[#05060A] text-slate-950 dark:text-white shadow-[0_28px_80px_-24px_rgba(15,23,42,0.14)] dark:shadow-[0_32px_90px_-24px_rgba(0,0,0,0.95)] [&[data-reset='true']_*]:!transition-none [&[data-reset='true']_*]:!delay-0">
  <!-- Soft Studio Overhead Softbox Lighting (Light & Dark Modes) -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-24 left-1/2 h-72 w-[42rem] -translate-x-1/2 rounded-full bg-white/80 dark:bg-sky-500/12 blur-3xl"></div>
    <div data-car-rim class="absolute right-8 top-1/3 h-64 w-[32rem] rounded-full bg-sky-200/35 dark:bg-sky-400/12 blur-3xl transition-colors duration-700"></div>
  </div>

  <!-- Minimalist Dealership Header -->
  <header class="relative z-30 flex items-center justify-between px-5 pt-5 pb-3 text-xs sm:px-9">
    <a href="#" class="group flex items-center gap-2.5">
      <svg class="size-5 text-slate-950 dark:text-white transition-transform group-hover:scale-105" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 18 11 4h6L8 18H2Z"/>
        <path d="M13 20 20 8h6l-7 12h-6Z"/>
      </svg>
      <span class="font-mono text-xs font-bold tracking-[0.28em] text-slate-950 dark:text-white">KASTEL</span>
    </a>

    <nav class="hidden md:flex items-center gap-7 text-[11px] font-medium text-slate-600 dark:text-zinc-400">
      <a href="#" class="font-semibold text-slate-950 dark:text-white">Showroom</a>
      <a href="#" class="hover:text-slate-950 dark:hover:text-white transition">800V Architecture</a>
      <a href="#" class="hover:text-slate-950 dark:hover:text-white transition">Fleet</a>
      <a href="#" class="hover:text-slate-950 dark:hover:text-white transition">Dealers</a>
    </nav>

    <div class="flex items-center gap-2">
      <button type="button" data-car-replay class="cursor-pointer inline-flex items-center gap-1.5 rounded-full border border-slate-300/80 dark:border-white/15 bg-white/75 dark:bg-white/[0.05] px-3 py-1.5 font-mono text-[10px] font-semibold uppercase tracking-wider text-slate-700 dark:text-zinc-200 backdrop-blur-md transition hover:border-blue-500 hover:text-blue-600 dark:hover:text-sky-300">
        <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Replay Arrival</span>
      </button>
    </div>
  </header>

  <!-- Main Depth-Layered Showroom Stage -->
  <div class="relative px-5 pt-4 pb-6 sm:px-9 sm:pt-7 sm:pb-8">
    <!-- Trim / Spec Switcher Row -->
    <div class="relative z-30 flex flex-wrap items-center justify-between gap-3">
      <p data-car-intro class="text-lg font-medium tracking-tight text-slate-800 dark:text-zinc-200 transition-all duration-[850ms] delay-[380ms] ease-out opacity-0 translate-y-3 group-data-[entered=true]/car:opacity-100 group-data-[entered=true]/car:translate-y-0 motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:delay-0 sm:text-2xl sm:pl-4">
        Introducing
      </p>

      <div role="group" aria-label="Select vehicle trim" class="inline-flex items-center gap-1 rounded-full border border-slate-200/90 dark:border-white/15 bg-white/80 dark:bg-white/[0.05] p-1 text-[10px] font-semibold backdrop-blur-md">
        <button type="button" data-trim-btn="tour" class="cursor-pointer rounded-full px-3 py-1 text-slate-600 dark:text-zinc-300 transition hover:text-slate-950 dark:hover:text-white">Touring</button>
        <button type="button" data-trim-btn="gt" class="cursor-pointer rounded-full bg-slate-950 dark:bg-white px-3 py-1 text-white dark:text-slate-950 shadow-2xs transition">Boreal GT</button>
        <button type="button" data-trim-btn="rs" class="cursor-pointer rounded-full px-3 py-1 text-slate-600 dark:text-zinc-300 transition hover:text-slate-950 dark:hover:text-white">Track RS</button>
      </div>
    </div>

    <!-- Layered Depth Canvas: Giant Model Text at z-10 BEHIND Transparent Car PNG at z-20 -->
    <div class="relative mt-1 min-h-[245px] sm:min-h-[330px]">
      <!-- Monumental Model Wordmark Positioned Directly Behind Car -->
      <div class="pointer-events-none relative z-10 flex select-none justify-center pt-1 sm:pt-0">
        <h1 data-car-model class="whitespace-nowrap text-center font-sans text-[clamp(3.35rem,14.8vw,10.25rem)] font-semibold leading-[0.88] tracking-[-0.04em] text-slate-950 dark:text-zinc-100 transition-all duration-[950ms] delay-[560ms] ease-[cubic-bezier(0.16,1,0.3,1)] opacity-0 translate-y-8 group-data-[entered=true]/car:opacity-100 group-data-[entered=true]/car:translate-y-0 motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:delay-0">
          Boreal GT
        </h1>
      </div>

      <!-- Foreground Car Silhouette Driving Smoothly Into Frame Over Background Text -->
      <div data-car-stage class="relative z-20 -mt-5 sm:-mt-16 md:-mt-20 flex justify-center sm:justify-end sm:pr-6 transition-all duration-[1250ms] ease-[cubic-bezier(0.16,1,0.3,1)] opacity-0 translate-x-28 sm:translate-x-48 scale-[0.9] group-data-[entered=true]/car:opacity-100 group-data-[entered=true]/car:translate-x-0 group-data-[entered=true]/car:scale-100 motion-reduce:opacity-100 motion-reduce:translate-x-0 motion-reduce:scale-100">
        <div class="relative w-full max-w-[320px] sm:max-w-[500px]">
          <!-- Soft Ground Contact Shadow -->
          <div aria-hidden="true" class="pointer-events-none absolute inset-x-10 -bottom-1 h-8 rounded-full bg-slate-950/35 dark:bg-black/95 blur-lg"></div>

          <!-- Interactive Headlight Beam Glow Flash When Parked -->
          <div data-car-beam aria-hidden="true" class="pointer-events-none absolute left-[4%] top-[44%] h-20 w-40 -rotate-6 rounded-full bg-sky-300/35 dark:bg-sky-300/45 blur-2xl transition-opacity duration-700 delay-[750ms] opacity-0 group-data-[entered=true]/car:opacity-100 motion-reduce:opacity-60"></div>

          <img data-car-img src="/images/heroes/kastel-gt.png" alt="Kastel Boreal GT electric performance fastback" class="relative w-full h-auto select-none object-contain drop-shadow-[0_14px_20px_rgba(15,23,42,0.22)] dark:drop-shadow-[0_22px_30px_rgba(0,0,0,0.85)] transition-[filter] duration-500" />
        </div>
      </div>

      <!-- Left Editorial Pitch Anchored Cleanly Beside Car Stance -->
      <div data-car-copy class="relative z-30 mt-5 sm:absolute sm:bottom-2 sm:left-4 sm:mt-0 sm:max-w-[290px] transition-all duration-[850ms] delay-[820ms] ease-out opacity-0 translate-y-4 group-data-[entered=true]/car:opacity-100 group-data-[entered=true]/car:translate-y-0 motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:delay-0">
        <p class="text-xl font-semibold tracking-[-0.025em] leading-[1.12] text-slate-950 dark:text-white sm:text-2xl">
          Electric precision,
          <span class="block text-slate-700 dark:text-zinc-300">without compromise.</span>
        </p>

        <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] font-medium text-slate-600 dark:text-zinc-400">
          <span class="inline-flex items-center gap-1"><span class="text-blue-600 dark:text-sky-400">&#10003;</span> <span data-car-badge-range>780 km range</span></span>
          <span class="inline-flex items-center gap-1"><span class="text-blue-600 dark:text-sky-400">&#10003;</span> 14 min charge</span>
          <span class="inline-flex items-center gap-1"><span class="text-blue-600 dark:text-sky-400">&#10003;</span> Dual motor AWD</span>
        </div>

        <div class="mt-4 flex flex-wrap items-center gap-2.5">
          <button type="button" data-car-toast-btn="Build allocation #408 reserved — dealer specialist notified" class="cursor-pointer rounded-full bg-[#2F6BFF] px-5 py-2 text-[11px] font-semibold text-white shadow-[0_8px_22px_-6px_rgba(47,107,255,0.65)] transition hover:-translate-y-0.5 hover:bg-blue-600">
            Configure &amp; Order
          </button>
          <button type="button" data-car-toast-btn="14 ready-to-deliver vehicles found within 35 km" class="cursor-pointer rounded-full bg-slate-950 dark:bg-white px-5 py-2 text-[11px] font-semibold text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-zinc-200">
            View inventory
          </button>
        </div>

        <p data-car-toast aria-live="polite" class="mt-2 h-4 opacity-0 transition-opacity duration-200 font-mono text-[10px] font-semibold text-blue-600 dark:text-sky-300"></p>
      </div>
    </div>

    <!-- Bottom Spec Telemetry Footer Strip -->
    <div data-car-stats class="relative z-30 mt-6 flex flex-col gap-4 border-t border-slate-200/80 dark:border-white/10 pt-5 sm:flex-row sm:items-end sm:justify-between transition-all duration-[850ms] delay-[950ms] ease-out opacity-0 translate-y-4 group-data-[entered=true]/car:opacity-100 group-data-[entered=true]/car:translate-y-0 motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:delay-0">
      <div class="grid grid-cols-2 gap-4 sm:grid-cols-4 sm:gap-9 sm:ml-auto">
        <div>
          <p class="text-[10px] font-medium text-slate-500 dark:text-zinc-400">0&ndash;100 km/h</p>
          <p data-stat-accel class="mt-0.5 font-sans text-xl font-semibold tracking-tight text-slate-950 dark:text-white">3.2 s</p>
        </div>
        <div>
          <p class="text-[10px] font-medium text-slate-500 dark:text-zinc-400">Dual motor AWD</p>
          <p data-stat-power class="mt-0.5 font-sans text-xl font-semibold tracking-tight text-slate-950 dark:text-white">580 hp</p>
        </div>
        <div>
          <p class="text-[10px] font-medium text-slate-500 dark:text-zinc-400">Estimated range</p>
          <p data-stat-range class="mt-0.5 font-sans text-xl font-semibold tracking-tight text-slate-950 dark:text-white">780 km</p>
        </div>
        <div>
          <p class="text-[10px] font-medium text-slate-500 dark:text-zinc-400">Top speed</p>
          <p data-stat-top class="mt-0.5 font-sans text-xl font-semibold tracking-tight text-slate-950 dark:text-white">265 km/h</p>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.querySelectorAll('[data-lp-auto]').forEach((root) => {
    const replayBtn = root.querySelector('[data-car-replay]');
    const modelEl = root.querySelector('[data-car-model]');
    const badgeRange = root.querySelector('[data-car-badge-range]');
    const statAccel = root.querySelector('[data-stat-accel]');
    const statPower = root.querySelector('[data-stat-power]');
    const statRange = root.querySelector('[data-stat-range]');
    const statTop = root.querySelector('[data-stat-top]');
    const carImg = root.querySelector('[data-car-img]');
    const trimBtns = root.querySelectorAll('[data-trim-btn]');
    const toast = root.querySelector('[data-car-toast]');

    const trims = {
      tour: { name: 'Boreal Tour', accel: '4.4 s', power: '420 hp', range: '840 km', top: '235 km/h', filter: 'brightness(1.06) contrast(0.98)' },
      gt: { name: 'Boreal GT', accel: '3.2 s', power: '580 hp', range: '780 km', top: '265 km/h', filter: '' },
      rs: { name: 'Boreal RS', accel: '2.7 s', power: '740 hp', range: '690 km', top: '295 km/h', filter: 'contrast(1.08) saturate(1.18) brightness(0.95)' }
    };

    const playArrival = () => {
      root.setAttribute('data-reset', 'true');
      root.setAttribute('data-entered', 'false');
      void root.offsetWidth;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          root.removeAttribute('data-reset');
          root.setAttribute('data-entered', 'true');
        });
      });
    };

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      playArrival();
    }
    replayBtn?.addEventListener('click', playArrival);

    const onCls = 'cursor-pointer rounded-full bg-slate-950 dark:bg-white px-3 py-1 text-white dark:text-slate-950 shadow-2xs transition';
    const offCls = 'cursor-pointer rounded-full px-3 py-1 text-slate-600 dark:text-zinc-300 transition hover:text-slate-950 dark:hover:text-white';

    trimBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-trim-btn') || 'gt';
        const spec = trims[key] || trims.gt;
        trimBtns.forEach((b) => { b.className = b === btn ? onCls : offCls; });
        if (modelEl) modelEl.textContent = spec.name;
        if (statAccel) statAccel.textContent = spec.accel;
        if (statPower) statPower.textContent = spec.power;
        if (statRange) statRange.textContent = spec.range;
        if (badgeRange) badgeRange.textContent = spec.range + ' range';
        if (statTop) statTop.textContent = spec.top;
        if (carImg) carImg.style.filter = spec.filter;
      });
    });

    let toastTimer;
    root.querySelectorAll('[data-car-toast-btn]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (!toast) return;
        toast.textContent = btn.getAttribute('data-car-toast-btn') || '';
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2400);
      });
    });
  });
</script>
