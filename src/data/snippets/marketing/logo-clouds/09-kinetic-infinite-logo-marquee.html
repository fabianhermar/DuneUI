<script>
  document.querySelectorAll('[data-lc-marquee]').forEach((wrap) => {
    const track = wrap.querySelector('[data-lc-track]');
    if (!track || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const anim = track.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }],
      { duration: 24000, iterations: Infinity, easing: 'linear' }
    );
    wrap.addEventListener('mouseenter', () => anim.pause());
    wrap.addEventListener('mouseleave', () => anim.play());
  });
</script>
