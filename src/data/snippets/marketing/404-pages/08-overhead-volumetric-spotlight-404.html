<section data-nf-spotlight data-lit="true" class="group/nf8 relative mx-auto w-full max-w-4xl overflow-hidden rounded-3xl border border-violet-200/80 dark:border-white/10 bg-gradient-to-b from-[#FAF8FF] via-white to-[#F3EFFC] dark:from-[#07080F] dark:via-[#07080F] dark:to-[#07080F] px-6 pt-16 pb-14 text-center text-slate-900 dark:text-white shadow-[0_28px_75px_-20px_rgba(109,40,217,0.18)] dark:shadow-[0_32px_90px_-20px_rgba(0,0,0,0.95)] sm:px-12 sm:pt-20 sm:pb-16 [&[data-reset='true']_*]:!transition-none [&[data-reset='true']_*]:!delay-0">
  <!-- Ambient Chamber Vignette & Subtle Floor Glow -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(124,58,237,0.12),transparent_64%)] dark:bg-[radial-gradient(ellipse_at_top,rgba(124,58,237,0.16),transparent_62%)]"></div>
  <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-violet-100/55 dark:from-black/65 to-transparent"></div>

  <!-- Top Overhead Light Emitter Filament -->
  <div data-nf8-emitter aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 flex flex-col items-center transition-all duration-[1100ms] ease-out origin-center opacity-0 scale-x-[0.08] group-data-[lit=true]/nf8:opacity-100 group-data-[lit=true]/nf8:scale-x-100 motion-reduce:opacity-100 motion-reduce:scale-x-100">
    <div class="h-[2px] w-56 sm:w-80 bg-gradient-to-r from-transparent via-violet-500 dark:via-violet-400 to-transparent shadow-[0_0_24px_4px_rgba(124,58,237,0.55)] dark:shadow-[0_0_28px_5px_rgba(139,92,246,0.95)]"></div>
    <div class="-mt-[2px] h-[2px] w-24 sm:w-36 bg-gradient-to-r from-transparent via-violet-200 dark:via-white to-transparent"></div>
    <div class="-mt-4 h-16 w-64 sm:w-96 rounded-full bg-violet-400/35 dark:bg-violet-500/55 blur-2xl"></div>
  </div>

  <!-- Downward Volumetric Spotlight Beam Layers (Smooth Conic + Radial Diffusion, Synchronized) -->
  <div data-nf8-beam aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 mx-auto h-[440px] w-full max-w-3xl transition-all duration-[1500ms] ease-out opacity-0 [clip-path:inset(0_0_100%_0)] group-data-[lit=true]/nf8:opacity-100 group-data-[lit=true]/nf8:[clip-path:inset(0_0_0%_0)] motion-reduce:opacity-100 motion-reduce:[clip-path:none]">
    <div class="absolute inset-0 bg-[conic-gradient(from_180deg_at_50%_0%,transparent_136deg,rgba(139,92,246,0.1)_158deg,rgba(124,58,237,0.22)_180deg,rgba(139,92,246,0.1)_202deg,transparent_224deg)] dark:bg-[conic-gradient(from_180deg_at_50%_0%,transparent_136deg,rgba(109,40,217,0.16)_158deg,rgba(167,139,250,0.34)_180deg,rgba(109,40,217,0.16)_202deg,transparent_224deg)] [mask-image:linear-gradient(to_bottom,black_10%,rgba(0,0,0,0.65)_48%,transparent_94%)] blur-2xl"></div>
    <div class="absolute inset-0 bg-[conic-gradient(from_180deg_at_50%_0%,transparent_154deg,rgba(139,92,246,0.12)_170deg,rgba(167,139,250,0.28)_180deg,rgba(139,92,246,0.12)_190deg,transparent_206deg)] dark:bg-[conic-gradient(from_180deg_at_50%_0%,transparent_154deg,rgba(167,139,250,0.18)_170deg,rgba(237,233,254,0.42)_180deg,rgba(167,139,250,0.18)_190deg,transparent_206deg)] [mask-image:linear-gradient(to_bottom,black_5%,rgba(0,0,0,0.45)_44%,transparent_86%)] blur-xl"></div>
    <div class="absolute inset-0 bg-[radial-gradient(rgba(109,40,217,0.24)_1px,transparent_1px)] dark:bg-[radial-gradient(rgba(221,214,254,0.34)_1px,transparent_1px)] [background-size:18px_18px] [mask-image:radial-gradient(ellipse_56%_78%_at_50%_4%,black_8%,rgba(0,0,0,0.42)_44%,transparent_78%)]"></div>
  </div>

  <!-- Optional Subtle Replay Trigger -->
  <div class="relative z-20 mb-2 flex justify-end sm:absolute sm:top-5 sm:right-6 sm:mb-0">
    <button type="button" data-nf8-replay class="cursor-pointer inline-flex items-center gap-1.5 rounded-full border border-slate-200/90 dark:border-white/10 bg-white/80 dark:bg-white/[0.03] px-3 py-1 font-mono text-[10px] uppercase tracking-widest text-slate-600 dark:text-zinc-400 backdrop-blur-md transition hover:border-violet-400/50 hover:text-violet-700 dark:hover:border-violet-400/40 dark:hover:bg-white/[0.07] dark:hover:text-violet-200">
      <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span>Replay Beam</span>
    </button>
  </div>

  <!-- Illuminated Monumental Sculpted 404 Centerpiece -->
  <div data-nf8-numeral class="relative z-10 mx-auto mt-1 flex max-w-xl justify-center select-none transition-all duration-[1050ms] delay-[550ms] ease-out opacity-0 -translate-y-1.5 brightness-75 group-data-[lit=true]/nf8:opacity-100 group-data-[lit=true]/nf8:translate-y-0 group-data-[lit=true]/nf8:brightness-100 motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:delay-0">
    <svg viewBox="0 0 560 185" class="h-auto w-full max-w-[360px] sm:max-w-[490px]" role="img" aria-label="404">
      <defs>
        <path id="nf8-404-shape" fill-rule="evenodd" d="M 142 24 H 174 V 100 H 192 V 126 H 174 V 152 H 144 V 126 H 74 V 102 Z M 144 56 L 104 100 H 144 Z M 262 24 H 298 A 44 44 0 0 1 342 68 V 108 A 44 44 0 0 1 298 152 H 262 A 44 44 0 0 1 218 108 V 68 A 44 44 0 0 1 262 24 Z M 270 52 H 290 A 22 22 0 0 1 312 74 V 102 A 22 22 0 0 1 290 124 H 270 A 22 22 0 0 1 248 102 V 74 A 22 22 0 0 1 270 52 Z M 436 24 H 468 V 100 H 486 V 126 H 468 V 152 H 438 V 126 H 368 V 102 Z M 438 56 L 398 100 H 438 Z"/>

        <clipPath id="nf8-404-clip">
          <use href="#nf8-404-shape"/>
        </clipPath>

        <linearGradient id="nf8-num-fill" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" class="[stop-color:rgba(124,58,237,0.22)] dark:[stop-color:rgba(221,214,254,0.34)]"/>
          <stop offset="28%" class="[stop-color:rgba(139,92,246,0.12)] dark:[stop-color:rgba(139,92,246,0.18)]"/>
          <stop offset="72%" class="[stop-color:rgba(167,139,250,0.09)] dark:[stop-color:rgba(30,27,75,0.22)]"/>
          <stop offset="100%" class="[stop-color:rgba(245,243,255,0.04)] dark:[stop-color:rgba(7,8,15,0.06)]"/>
        </linearGradient>

        <linearGradient id="nf8-num-rim" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" class="[stop-color:rgba(109,40,217,0.72)] dark:[stop-color:rgba(245,243,255,0.92)]"/>
          <stop offset="22%" class="[stop-color:rgba(139,92,246,0.42)] dark:[stop-color:rgba(196,181,253,0.62)]"/>
          <stop offset="58%" class="[stop-color:rgba(167,139,250,0.2)] dark:[stop-color:rgba(124,58,237,0.24)]"/>
          <stop offset="100%" class="[stop-color:rgba(196,181,253,0.05)] dark:[stop-color:rgba(49,46,129,0.04)]"/>
        </linearGradient>

        <linearGradient id="nf8-glass-sheen" x1="0.15" y1="0" x2="0.85" y2="1">
          <stop offset="0%" class="[stop-color:rgba(255,255,255,0.7)] dark:[stop-color:rgba(255,255,255,0.2)]"/>
          <stop offset="45%" class="[stop-color:rgba(167,139,250,0.09)] dark:[stop-color:rgba(30,27,75,0.22)]"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="nf8-floor-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" class="[stop-color:rgba(124,58,237,0.2)] dark:[stop-color:rgba(139,92,246,0.34)]"/>
          <stop offset="60%" class="[stop-color:rgba(167,139,250,0.09)] dark:[stop-color:rgba(30,27,75,0.22)]"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <pattern id="nf8-grid-tex" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M 16 0 L 0 0 0 16" fill="none" class="stroke-violet-700/15 dark:stroke-violet-300/10" stroke-width="0.75"/>
          <circle cx="8" cy="8" r="1" class="fill-violet-700/25 dark:fill-violet-200/25"/>
        </pattern>

        <filter id="nf8-num-glow" x="-12%" y="-12%" width="124%" height="130%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
      </defs>

      <!-- Subtle Floor Illumination Pool -->
      <ellipse cx="280" cy="166" rx="200" ry="14" fill="url(#nf8-floor-glow)"/>

      <!-- Precision Framing Registration Crosshairs -->
      <g class="stroke-violet-700/30 dark:stroke-violet-300/25" stroke-width="1">
        <path d="M38 88 H48 M43 83 V93"/>
        <path d="M512 88 H522 M517 83 V93"/>
      </g>

      <!-- Ambient Violet Backlight Halo Behind Numerals -->
      <use href="#nf8-404-shape" class="fill-violet-500/15 dark:fill-violet-600/25" filter="url(#nf8-num-glow)"/>

      <!-- 3D Extruded Depth Shadow Layer -->
      <use href="#nf8-404-shape" transform="translate(0 7)" class="fill-violet-900/12 stroke-violet-600/20 dark:fill-[#04050B]/90 dark:stroke-indigo-950/35" stroke-width="1"/>

      <!-- Main Translucent Glass Body -->
      <use href="#nf8-404-shape" fill="url(#nf8-num-fill)" stroke-linejoin="round"/>

      <!-- Internal Blueprint Grid + Dot Texture Clipped to 404 -->
      <rect x="60" y="16" width="440" height="148" fill="url(#nf8-grid-tex)" clip-path="url(#nf8-404-clip)"/>

      <!-- Diagonal Upper Glass Specular Sheen -->
      <polygon points="60,16 340,16 210,158 60,158" fill="url(#nf8-glass-sheen)" clip-path="url(#nf8-404-clip)"/>

      <!-- Razor-Sharp Top-Lit Rim Highlight -->
      <use href="#nf8-404-shape" fill="none" stroke="url(#nf8-num-rim)" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- Orbital Severed-Route Reticle Inside the Zero -->
      <g transform="translate(280 88)">
        <circle r="21" fill="none" class="stroke-violet-700/30 dark:stroke-violet-300/25" stroke-width="1" stroke-dasharray="3 4"/>
        <path d="M -13 -7 A 15 15 0 0 1 13 -7" fill="none" class="stroke-violet-700/80 dark:stroke-violet-200/70" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 13 7 A 15 15 0 0 1 -13 7" fill="none" class="stroke-violet-500/45 dark:stroke-violet-300/60" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-26" y1="0" x2="-17" y2="0" class="stroke-violet-700/30 dark:stroke-violet-300/25" stroke-width="1"/>
        <line x1="17" y1="0" x2="26" y2="0" class="stroke-violet-700/30 dark:stroke-violet-300/25" stroke-width="1"/>
        <circle r="3.2" class="fill-violet-700 dark:fill-violet-100"/>
        <circle r="7" class="fill-violet-500/20 dark:fill-violet-600/30"/>
      </g>
    </svg>
  </div>

  <!-- Illuminated Lower Content Stage -->
  <div data-nf8-content class="relative z-10 -mt-2 flex flex-col items-center transition-all duration-[950ms] delay-[850ms] ease-out opacity-0 translate-y-2.5 brightness-75 group-data-[lit=true]/nf8:opacity-100 group-data-[lit=true]/nf8:translate-y-0 group-data-[lit=true]/nf8:brightness-100 motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:delay-0">
    <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-violet-200 dark:border-violet-400/25 bg-violet-50/90 dark:bg-violet-500/10 px-3 py-1 font-mono text-[10px] font-semibold uppercase tracking-[0.22em] text-violet-700 dark:text-violet-200">
      <span class="size-1.5 rounded-full bg-violet-600 dark:bg-violet-400 shadow-[0_0_8px_rgba(124,58,237,0.65)] dark:shadow-[0_0_8px_rgba(167,139,250,0.95)]"></span>
      <span>Error 404 · Route Missing</span>
    </div>

    <h1 class="bg-gradient-to-b from-slate-950 via-slate-800 to-slate-500 dark:from-white dark:via-zinc-100 dark:to-zinc-400 bg-clip-text text-3xl font-bold tracking-tight text-transparent sm:text-5xl">
      Page Not Found
    </h1>

    <p class="mt-3.5 max-w-md text-sm leading-relaxed text-slate-600 dark:text-zinc-400 sm:text-[15px]">
      It seems the page you&rsquo;re looking for doesn&rsquo;t exist or moved out of sight. Let&rsquo;s get you back on track.
    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3.5">
      <a href="#" class="group inline-flex items-center gap-2 rounded-xl bg-gradient-to-b from-violet-600 to-indigo-600 dark:from-violet-500 dark:to-indigo-600 px-5 py-2.5 text-xs font-semibold text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.35),0_10px_28px_-6px_rgba(124,58,237,0.45)] dark:shadow-[inset_0_1px_0_rgba(255,255,255,0.35),0_10px_30px_-6px_rgba(124,58,237,0.65)] transition hover:-translate-y-0.5 hover:from-violet-500 hover:to-indigo-500 dark:hover:from-violet-400">
        <span>Return to Homepage</span>
        <span aria-hidden="true" class="transition-transform group-hover:translate-x-0.5">&rarr;</span>
      </a>
      <a href="#" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 dark:border-white/12 bg-white/85 dark:bg-white/[0.04] px-5 py-2.5 text-xs font-semibold text-slate-800 dark:text-zinc-200 backdrop-blur-md transition hover:border-violet-300 hover:bg-violet-50/60 dark:hover:border-violet-400/35 dark:hover:bg-white/[0.08] dark:hover:text-white">
        <span>Explore Features</span>
      </a>
    </div>
  </div>
</section>

<script>
  document.querySelectorAll('[data-nf-spotlight]').forEach((root) => {
    const replayBtn = root.querySelector('[data-nf8-replay]');
    const playBeam = () => {
      root.setAttribute('data-reset', 'true');
      root.setAttribute('data-lit', 'false');
      void root.offsetWidth;
      requestAnimationFrame(() => {
        root.removeAttribute('data-reset');
        root.setAttribute('data-lit', 'true');
      });
    };
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      playBeam();
    }
    replayBtn?.addEventListener('click', playBeam);
  });
</script>
