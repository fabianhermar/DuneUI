<section data-nl-4 class="relative mx-auto w-full max-w-3xl overflow-hidden rounded-3xl border border-slate-200 dark:border-white/20 bg-gradient-to-br from-sky-50 via-white to-fuchsia-50 dark:from-[#0F172A] dark:via-[#312E81] dark:to-[#701A75] p-5 shadow-xl dark:shadow-2xl sm:p-10 text-slate-900 dark:text-white">
  <div class="pointer-events-none absolute -left-10 -bottom-10 h-44 w-44 rounded-full bg-cyan-300/30 dark:bg-cyan-400/25 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-10 -top-10 h-44 w-44 rounded-full bg-fuchsia-300/30 dark:bg-fuchsia-400/20 blur-3xl"></div>
  <div class="relative rounded-2xl border border-slate-900/15 dark:border-white/30 bg-white/80 dark:bg-white/12 p-6 text-center shadow-[inset_0_1px_1px_rgba(255,255,255,0.45)] backdrop-blur-2xl sm:p-10">
    <span class="inline-flex items-center gap-2 rounded-full border border-cyan-500/30 bg-cyan-500/10 dark:bg-cyan-400/15 px-3 py-1 font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-cyan-800 dark:text-cyan-200">
      <span class="size-1.5 rounded-full bg-cyan-600 dark:bg-cyan-300"></span>
      Private Dispatch
    </span>
    <h2 class="mt-4 text-2xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Get early beta invites in your inbox.</h2>
    <p class="mx-auto mt-2.5 max-w-md text-sm text-slate-700 dark:text-white/85">Curated spatial interface patterns and WebGPU UI audits delivered every two weeks.</p>
    <form data-nl-form class="mx-auto mt-6 flex max-w-md flex-col gap-2 rounded-2xl border border-slate-900/15 dark:border-white/25 bg-white/95 dark:bg-black/30 p-1.5 sm:flex-row">
      <input type="email" required placeholder="alex@atelier.design" class="w-full flex-1 bg-transparent px-3.5 py-2 text-sm text-slate-900 dark:text-white placeholder:text-slate-500 dark:placeholder:text-white/60 focus:outline-none" />
      <button type="submit" class="shrink-0 rounded-xl bg-slate-900 dark:bg-white px-5 py-2.5 text-xs font-bold text-white dark:text-slate-950 hover:bg-slate-800 dark:hover:bg-cyan-100 transition">Request Access</button>
    </form>
    <p data-nl-msg class="hidden mt-3 font-mono text-xs font-semibold text-emerald-700 dark:text-emerald-300">✓ Invite queued — your spot is #1,429</p>
  </div>
</section>
<script>
  document.querySelectorAll('[data-nl-4]').forEach((root) => {
    const form = root.querySelector('[data-nl-form]');
    const msg = root.querySelector('[data-nl-msg]');
    form?.addEventListener('submit', (e) => {
      e.preventDefault();
      msg?.classList.remove('hidden');
    });
  });
</script>
