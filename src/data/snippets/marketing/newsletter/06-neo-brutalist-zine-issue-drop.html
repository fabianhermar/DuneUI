<section data-nl-6 class="mx-auto w-full max-w-3xl border-2 border-black dark:border-zinc-200 bg-[#FDE047] p-6 shadow-[8px_8px_0_0_#000] dark:shadow-[8px_8px_0_0_#e4e4e7] sm:p-9 text-black">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-black pb-3 font-mono text-[11px] font-black uppercase tracking-wider text-black">
    <span>ZINE // ISSUE #112</span>
    <span class="bg-black px-2 py-0.5 text-[#BEF264]">FREE WEEKLY DROP</span>
  </div>
  <h2 class="mt-5 text-3xl font-black uppercase leading-none text-black sm:text-4xl">STEAL OUR BEST COMPONENTS EVERY FRIDAY.</h2>
  <p class="mt-3 text-sm font-bold text-neutral-900">Raw Tailwind recipes, accessibility hacks, and interactive vanilla JS micro-widgets.</p>
  <div class="mt-4 flex flex-wrap gap-2 font-mono text-[10px] font-black uppercase text-black">
    <span class="border-2 border-black bg-white px-2.5 py-0.5">10+ UI RECIPES</span>
    <span class="border-2 border-black bg-[#93C5FD] px-2.5 py-0.5">ZERO DEPENDENCIES</span>
  </div>
  <form data-nl-form class="mt-6 flex flex-col gap-2.5 sm:flex-row">
    <input type="email" required placeholder="you@studio.wtf" class="w-full flex-1 border-2 border-black bg-white px-4 py-3 text-sm font-bold text-black placeholder:text-neutral-600 focus:outline-none" />
    <button type="submit" class="shrink-0 border-2 border-black bg-[#BEF264] px-6 py-3 font-mono text-xs font-black uppercase text-black shadow-[4px_4px_0_0_#000] hover:bg-[#A3E635] active:translate-x-0.5 active:translate-y-0.5 transition">Send It To Me &rarr;</button>
  </form>
  <p data-nl-msg class="hidden mt-4 border-2 border-black bg-black px-3 py-2 font-mono text-xs font-bold uppercase text-[#BEF264]">BOOM! Issue #112 is heading to your inbox.</p>
</section>
<script>
  document.querySelectorAll('[data-nl-6]').forEach((root) => {
    const form = root.querySelector('[data-nl-form]');
    const msg = root.querySelector('[data-nl-msg]');
    form?.addEventListener('submit', (e) => {
      e.preventDefault();
      msg?.classList.remove('hidden');
    });
  });
</script>
