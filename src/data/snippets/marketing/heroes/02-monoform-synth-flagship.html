<section class="relative w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-200 dark:border-white/15 bg-white dark:bg-zinc-900 text-slate-900 dark:text-white shadow-lg dark:shadow-2xl">
  <img src="/images/heroes/synth-keys.jpg" alt="Monoform Field Station illuminated synthesizer" class="absolute inset-0 h-full w-full object-cover opacity-35" />
  <div class="absolute inset-0 bg-gradient-to-r from-[#09070F] via-[#09070F]/85 to-transparent"></div>
  <div class="relative z-10 p-6 sm:p-10">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-white/15 pb-4">
      <div class="flex items-center gap-2.5 font-mono text-xs font-bold uppercase tracking-widest">
        <span class="h-2.5 w-2.5 rounded-full bg-orange-500 shadow-[0_0_10px_#f97316]"></span>
        <span>MONOFORM // LABS</span>
      </div>
      <div class="flex items-center gap-4 font-mono text-[11px] text-slate-600 dark:text-zinc-400">
        <span class="hidden sm:inline">ALU-6061 CHASSIS</span>
        <span class="rounded border border-slate-300 dark:border-white/20 px-2.5 py-0.5 text-slate-900 dark:text-white">BATCH 03 OPEN</span>
      </div>
    </header>
    <div class="mt-8 grid grid-cols-1 items-center gap-8 lg:grid-cols-12">
      <div class="min-w-0 lg:col-span-6">
        <p class="font-mono text-xs uppercase tracking-[0.22em] text-orange-600 dark:text-orange-400">OP-FIELD IV WORKSTATION</p>
        <h1 class="mt-3 text-4xl font-black uppercase leading-[0.95] tracking-tight text-slate-900 dark:text-white sm:text-5xl">Raw sound, machined in aluminum.</h1>
        <p class="mt-4 max-w-md text-sm leading-relaxed text-slate-700 dark:text-zinc-300">24-bit quadraphonic tape engine, analog zero-delay feedback filters, and velocity-sensitive optical keys built for live rooms.</p>
        <div class="mt-5 flex flex-wrap gap-2" data-synth-modes>
          <button type="button" data-patch="PATCH #04 // SUBTERRANEAN" data-hz="440 Hz · 98% Purity" class="rounded-lg border border-orange-500 bg-orange-50 dark:bg-orange-500/20 px-3 py-1.5 font-mono text-[11px] font-bold text-orange-700 dark:text-orange-300">Granular Tape</button>
          <button type="button" data-patch="PATCH #11 // FM TITANIUM" data-hz="96 kHz · 0.4ms DSP" class="rounded-lg border border-slate-900/15 dark:border-white/15 bg-slate-900/[0.07] dark:bg-white/5 px-3 py-1.5 font-mono text-[11px] text-slate-700 dark:text-zinc-300 hover:bg-slate-900/[0.07] dark:hover:bg-white/10">FM Matrix</button>
          <button type="button" data-patch="PATCH #19 // WARM CHORUS" data-hz="Analog Dual Filter" class="rounded-lg border border-slate-900/15 dark:border-white/15 bg-slate-900/[0.07] dark:bg-white/5 px-3 py-1.5 font-mono text-[11px] text-slate-700 dark:text-zinc-300 hover:bg-slate-900/[0.07] dark:hover:bg-white/10">Analog Bus</button>
        </div>
        <div class="mt-7 flex flex-wrap items-center gap-3">
          <button type="button" class="rounded-xl bg-[#FF5A1F] px-6 py-3 text-xs font-black uppercase tracking-wider text-white shadow-[0_10px_28px_rgba(255,90,31,0.35)] hover:bg-[#ff6d38]">Order Unit — $1,290</button>
          <button type="button" class="rounded-xl border border-slate-900/15 dark:border-white/20 bg-slate-900/[0.07] dark:bg-white/5 px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white hover:bg-slate-900/[0.07] dark:hover:bg-white/10">Listen to Stems ▶</button>
        </div>
      </div>
      <div class="min-w-0 lg:col-span-6">
        <div class="overflow-hidden rounded-2xl border border-slate-900/15 dark:border-white/15 bg-slate-900/[0.06] dark:bg-black/75 p-3 shadow-2xl backdrop-blur-xl">
          <img src="/images/heroes/synth-modular.jpg" alt="Analog modular knob close-up" class="aspect-[16/10] w-full rounded-xl object-cover" />
          <div class="mt-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-900/15 dark:border-white/10 bg-zinc-950/90 px-3.5 py-2.5 font-mono text-[11px]">
            <span data-patch-name class="font-bold text-orange-700 dark:text-orange-400">PATCH #04 // SUBTERRANEAN</span>
            <span data-patch-spec class="text-zinc-400">440 Hz · 98% Purity</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.parentElement;
      const btns = root.querySelectorAll('[data-synth-modes] button');
      const pName = root.querySelector('[data-patch-name]');
      const pSpec = root.querySelector('[data-patch-spec]');
      btns.forEach((b) => {
        b.addEventListener('click', () => {
          btns.forEach((x) => { x.className = 'rounded-lg border border-white/15 bg-white/5 px-3 py-1.5 font-mono text-[11px] text-zinc-300 hover:bg-white/10'; });
          b.className = 'rounded-lg border border-orange-500 bg-orange-500/20 px-3 py-1.5 font-mono text-[11px] font-bold text-orange-300';
          if (pName) pName.textContent = b.dataset.patch;
          if (pSpec) pSpec.textContent = b.dataset.hz;
        });
      });
    })();
  </script>
</section>
