<section class="relative min-h-[470px] w-full max-w-5xl overflow-hidden rounded-3xl bg-zinc-900 text-white shadow-lg dark:shadow-2xl border border-slate-200 dark:border-white/15">
  <img src="/images/heroes/alpine-coupe.jpg" alt="Véloce GT coupe on alpine pass" class="absolute inset-0 h-full w-full object-cover object-center" />
  <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/45 to-black/60"></div>
  <div class="relative z-10 flex min-h-[470px] flex-col justify-between p-6 sm:p-10">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-white/15 pb-4">
      <div class="flex items-center gap-3">
        <span class="font-mono text-xs font-black uppercase tracking-[0.26em] text-white">VÉLOCE®</span>
        <span class="hidden font-mono text-[10px] uppercase tracking-widest text-sky-300 sm:inline">FURKA PASS // ZÜRICH</span>
      </div>
      <nav class="hidden items-center gap-6 text-[11px] font-semibold uppercase tracking-widest text-white/80 md:flex">
        <a href="#" class="hover:text-white">Chassis</a>
        <a href="#" class="hover:text-white">Track Lap</a>
        <a href="#" class="hover:text-white">Dealer Locator</a>
      </nav>
      <button type="button" class="rounded-full bg-white px-4 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-950 hover:bg-sky-100">Configure →</button>
    </header>
    <div class="grid grid-cols-1 items-end gap-6 pt-16 lg:grid-cols-12">
      <div class="lg:col-span-7">
        <span class="inline-flex items-center gap-2 rounded-full border border-sky-400/40 bg-sky-500/15 px-3 py-1 font-mono text-[10px] font-bold uppercase tracking-widest text-sky-200 backdrop-blur">SERIE ALPINA · 0–100 IN 3.4S</span>
        <h1 class="mt-3 text-4xl font-black uppercase leading-[0.95] tracking-tight text-white sm:text-5xl">Built where roads curve skyward.</h1>
        <div class="mt-6 flex flex-wrap items-center gap-3">
          <button type="button" class="rounded-xl bg-sky-400 px-6 py-3 text-xs font-black uppercase tracking-wider text-slate-950 shadow-lg hover:bg-sky-300">Book Alpine Test Drive</button>
          <button type="button" class="rounded-xl border border-white/30 bg-black/40 px-5 py-3 text-xs font-bold uppercase tracking-wider text-white backdrop-blur hover:bg-white/15">Spec Sheet PDF</button>
        </div>
      </div>
      <div class="lg:col-span-5">
        <div class="rounded-2xl border border-white/20 bg-black/60 p-4 backdrop-blur-xl">
          <div class="flex items-center justify-between border-b border-white/15 pb-2.5 text-[10px] font-mono uppercase tracking-widest text-zinc-400">
            <span>Telemetry Package</span>
            <span data-trim-code class="font-bold text-sky-300">LONG BEACH BLUE</span>
          </div>
          <div class="mt-3 grid grid-cols-3 gap-2 text-center font-mono">
            <div><p data-hp class="text-lg font-bold text-white">460 HP</p><p class="text-[10px] text-zinc-400">Twin-Scroll</p></div>
            <div><p class="text-lg font-bold text-white">6-SPD</p><p class="text-[10px] text-zinc-400">Manual</p></div>
            <div><p class="text-lg font-bold text-sky-300">1,490kg</p><p class="text-[10px] text-zinc-400">Curb Wt</p></div>
          </div>
          <div class="mt-3 flex gap-1.5" data-trim-picker>
            <button type="button" data-code="LONG BEACH BLUE" data-power="460 HP" class="flex-1 rounded-lg border border-sky-400 bg-sky-400/20 py-1.5 font-mono text-[10px] font-bold text-sky-200">Alpina</button>
            <button type="button" data-code="CS CARBON EDITION" data-power="510 HP" class="flex-1 rounded-lg border border-white/15 bg-white/5 py-1.5 font-mono text-[10px] font-semibold text-zinc-300 hover:bg-white/10">Clubsport</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.parentElement;
      const btns = root.querySelectorAll('[data-trim-picker] button');
      const code = root.querySelector('[data-trim-code]');
      const hp = root.querySelector('[data-hp]');
      btns.forEach((b) => {
        b.addEventListener('click', () => {
          btns.forEach((x) => { x.className = 'flex-1 rounded-lg border border-white/15 bg-white/5 py-1.5 font-mono text-[10px] font-semibold text-zinc-300 hover:bg-white/10'; });
          b.className = 'flex-1 rounded-lg border border-sky-400 bg-sky-400/20 py-1.5 font-mono text-[10px] font-bold text-sky-200';
          if (code) code.textContent = b.dataset.code;
          if (hp) hp.textContent = b.dataset.power;
        });
      });
    })();
  </script>
</section>
