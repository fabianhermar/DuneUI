<section class="relative w-full max-w-5xl overflow-hidden rounded-3xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-zinc-950 dark:text-white shadow-2xl">
  <div class="grid grid-cols-1 md:grid-cols-12">
    <div class="flex flex-col justify-between p-6 md:col-span-5 sm:p-9">
      <div>
        <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-3 font-mono text-[10px] font-bold uppercase tracking-widest">
          <span class="flex items-center gap-2 text-zinc-950 dark:text-white"><span class="h-2 w-2 rounded-full bg-red-600"></span>MONZA STUDIOS</span>
          <span class="text-zinc-500 dark:text-zinc-400">GT CARBON</span>
        </div>
        <h1 class="mt-5 text-3xl font-black uppercase leading-[0.95] tracking-tight text-zinc-950 dark:text-white sm:text-5xl">Carbon aero honed under white light.</h1>
        <p class="mt-3 text-sm leading-relaxed text-zinc-600 dark:text-zinc-400">Custom dry-carbon front splitters, active radiator ducts, and forged magnesium wheels built in Milan.</p>
      </div>
      <div class="mt-7 space-y-4">
        <div class="flex gap-1.5 rounded-xl bg-zinc-100 dark:bg-zinc-800 p-1 font-mono text-[11px] text-black dark:text-zinc-100" data-aero-modes>
          <button type="button" data-downforce="340 kg Downforce @ 200 km/h" class="flex-1 rounded-lg bg-zinc-950 dark:bg-white py-1.5 font-bold text-white dark:text-slate-950">Track Aero</button>
          <button type="button" data-downforce="185 kg Balanced Street Setup" class="flex-1 rounded-lg py-1.5 font-semibold text-zinc-600 dark:text-zinc-400 hover:text-zinc-950 dark:hover:text-white">Street Spec</button>
        </div>
        <p data-aero-spec class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/60 px-3.5 py-2.5 font-mono text-xs font-bold text-zinc-900 dark:text-zinc-100">340 kg Downforce @ 200 km/h</p>
        <div class="flex flex-wrap gap-2.5">
          <button type="button" class="rounded-xl bg-red-600 px-5 py-3 text-xs font-black uppercase tracking-wider text-white hover:bg-red-700">Commission Build →</button>
          <button type="button" class="rounded-xl border border-zinc-300 dark:border-zinc-700 px-5 py-3 text-xs font-bold uppercase tracking-wider text-zinc-900 dark:text-zinc-100 hover:bg-zinc-50 dark:hover:bg-zinc-800/60">Wind Tunnel Data</button>
        </div>
      </div>
    </div>
    <div class="relative min-h-[300px] md:col-span-7">
      <img src="/images/heroes/studio-gt.jpg" alt="Matte black carbon sports coupe inside white studio bay" class="h-full w-full object-cover object-center" />
      <span class="absolute bottom-4 right-4 rounded-full bg-black/80 px-3.5 py-1.5 font-mono text-[10px] font-bold uppercase tracking-widest text-slate-900 dark:text-white backdrop-blur">DRY-CARBON SERIES · MILAN</span>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.parentElement;
      const btns = root.querySelectorAll('[data-aero-modes] button');
      const spec = root.querySelector('[data-aero-spec]');
      btns.forEach((b) => {
        b.addEventListener('click', () => {
          btns.forEach((x) => { x.className = 'flex-1 rounded-lg py-1.5 font-semibold text-zinc-600 hover:text-zinc-950'; });
          b.className = 'flex-1 rounded-lg bg-zinc-950 py-1.5 font-bold text-white';
          if (spec) spec.textContent = b.dataset.downforce;
        });
      });
    })();
  </script>
</section>
