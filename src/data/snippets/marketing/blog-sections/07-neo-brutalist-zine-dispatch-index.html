<script>
  document.querySelectorAll('[data-blog-7] [data-upvote]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const voted = btn.getAttribute('aria-pressed') === 'true';
      const base = Number(btn.getAttribute('data-upvote') || 0);
      btn.setAttribute('aria-pressed', String(!voted));
      btn.textContent = '▲ ' + (voted ? base : base + 1);
      btn.classList.toggle('bg-[#BEF264]', !voted);
    });
  });
</script>
