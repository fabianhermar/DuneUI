<div data-filter-chips class="mx-auto flex max-w-xl flex-wrap items-center justify-center gap-2 rounded-2xl bg-white dark:bg-zinc-900 p-4 shadow-sm ring-1 ring-slate-200 dark:ring-zinc-800 text-slate-900 dark:text-zinc-100">
  <span data-chip class="inline-flex items-center gap-1.5 rounded-lg bg-slate-50 dark:bg-zinc-800 px-2.5 py-1 text-xs font-medium text-slate-800 dark:text-zinc-200 ring-1 ring-slate-200 dark:ring-zinc-700">
    <span class="size-1.5 rounded-full bg-indigo-500"></span>Dashboards
    <button type="button" data-chip-del aria-label="Remove Dashboards filter" class="ml-0.5 rounded p-0.5 text-slate-500 dark:text-zinc-400 hover:bg-slate-200 dark:hover:bg-zinc-700 hover:text-slate-900 dark:hover:text-white">&times;</button>
  </span>
  <span data-chip class="inline-flex items-center gap-1.5 rounded-lg bg-slate-50 dark:bg-zinc-800 px-2.5 py-1 text-xs font-medium text-slate-800 dark:text-zinc-200 ring-1 ring-slate-200 dark:ring-zinc-700">
    <span class="size-1.5 rounded-full bg-cyan-500"></span>Tailwind v4
    <button type="button" data-chip-del aria-label="Remove Tailwind v4 filter" class="ml-0.5 rounded p-0.5 text-slate-500 dark:text-zinc-400 hover:bg-slate-200 dark:hover:bg-zinc-700 hover:text-slate-900 dark:hover:text-white">&times;</button>
  </span>
  <span data-chip class="inline-flex items-center gap-1.5 rounded-lg bg-slate-50 dark:bg-zinc-800 px-2.5 py-1 text-xs font-medium text-slate-800 dark:text-zinc-200 ring-1 ring-slate-200 dark:ring-zinc-700">
    <span class="size-1.5 rounded-full bg-emerald-500"></span>Dark Mode
    <button type="button" data-chip-del aria-label="Remove Dark Mode filter" class="ml-0.5 rounded p-0.5 text-slate-500 dark:text-zinc-400 hover:bg-slate-200 dark:hover:bg-zinc-700 hover:text-slate-900 dark:hover:text-white">&times;</button>
  </span>
  <button type="button" data-chips-clear class="px-2.5 py-1 text-xs font-semibold text-indigo-700 dark:text-indigo-400 hover:underline">Clear all</button>
  <button type="button" data-chips-reset class="hidden rounded-lg border border-slate-200 dark:border-zinc-700 px-2.5 py-1 text-xs font-semibold text-slate-700 dark:text-zinc-200 hover:bg-slate-50 dark:hover:bg-zinc-800">Restore filters</button>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-filter-chips]');
      const chips = root.querySelectorAll('[data-chip]');
      const clearBtn = root.querySelector('[data-chips-clear]');
      const resetBtn = root.querySelector('[data-chips-reset]');
      const setChipHidden = (chip, hidden) => {
        chip.classList.toggle('hidden', hidden);
        chip.classList.toggle('inline-flex', !hidden);
      };
      const sync = () => {
        const visible = [...chips].filter((c) => !c.classList.contains('hidden')).length;
        clearBtn.classList.toggle('hidden', visible === 0);
        resetBtn.classList.toggle('hidden', visible > 0);
      };
      chips.forEach((chip) => {
        chip.querySelector('[data-chip-del]')?.addEventListener('click', () => {
          setChipHidden(chip, true);
          sync();
        });
      });
      clearBtn?.addEventListener('click', () => {
        chips.forEach((c) => setChipHidden(c, true));
        sync();
      });
      resetBtn?.addEventListener('click', () => {
        chips.forEach((c) => setChipHidden(c, false));
        sync();
      });
    })();
  </script>
</div>
