<div data-priority-group class="mx-auto inline-flex flex-wrap items-center justify-center gap-2.5 rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-zinc-900 p-3 text-xs text-slate-900 dark:text-zinc-100 shadow-sm">
  <button type="button" data-prio="Urgent" aria-pressed="true" class="inline-flex items-center gap-1.5 rounded-lg bg-rose-50 dark:bg-rose-500/20 px-3 py-1.5 font-semibold text-rose-700 dark:text-rose-300 ring-2 ring-offset-1 ring-offset-white dark:ring-offset-zinc-900 ring-rose-500/60 transition">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><rect x="2" y="10" width="2.5" height="4" rx="0.5"/><rect x="6.5" y="6" width="2.5" height="8" rx="0.5"/><rect x="11" y="2" width="2.5" height="12" rx="0.5"/></svg>
    Urgent
  </button>
  <button type="button" data-prio="High" aria-pressed="false" class="inline-flex items-center gap-1.5 rounded-lg bg-amber-50 dark:bg-amber-500/15 px-3 py-1.5 font-semibold text-amber-800 dark:text-amber-300 ring-1 ring-amber-500/40 transition hover:bg-amber-100 dark:hover:bg-amber-500/25">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><rect x="2" y="10" width="2.5" height="4" rx="0.5"/><rect x="6.5" y="6" width="2.5" height="8" rx="0.5"/><rect x="11" y="2" width="2.5" height="12" rx="0.5" opacity="0.3"/></svg>
    High
  </button>
  <button type="button" data-prio="Medium" aria-pressed="false" class="inline-flex items-center gap-1.5 rounded-lg bg-sky-50 dark:bg-sky-500/15 px-3 py-1.5 font-semibold text-sky-800 dark:text-sky-300 ring-1 ring-sky-500/40 transition hover:bg-sky-100 dark:hover:bg-sky-500/25">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><rect x="2" y="10" width="2.5" height="4" rx="0.5"/><rect x="6.5" y="6" width="2.5" height="8" rx="0.5" opacity="0.3"/><rect x="11" y="2" width="2.5" height="12" rx="0.5" opacity="0.3"/></svg>
    Medium
  </button>
  <span data-prio-label class="ml-1 font-mono text-[11px] text-slate-600 dark:text-zinc-400">Priority: Urgent</span>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-priority-group]');
      const label = root.querySelector('[data-prio-label]');
      const btns = root.querySelectorAll('[data-prio]');
      btns.forEach((btn) => {
        btn.addEventListener('click', () => {
          btns.forEach((b) => {
            b.classList.remove('ring-2', 'ring-offset-1', 'ring-offset-white', 'dark:ring-offset-zinc-900');
            b.classList.add('ring-1');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.remove('ring-1');
          btn.classList.add('ring-2', 'ring-offset-1', 'ring-offset-white', 'dark:ring-offset-zinc-900');
          btn.setAttribute('aria-pressed', 'true');
          label.textContent = 'Priority: ' + btn.dataset.prio;
        });
      });
    })();
  </script>
</div>
