<div data-check-list class="mx-auto w-full max-w-md overflow-hidden rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm text-slate-900 dark:text-zinc-100">
  <div class="border-b border-slate-100 dark:border-zinc-800 px-4 py-3.5">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-900 dark:text-zinc-100">Launch Checklist</h3>
      <span data-check-progress class="font-mono text-xs font-semibold text-indigo-600 dark:text-indigo-400">1 / 3 done</span>
    </div>
    <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-zinc-800">
      <div data-check-bar class="h-full rounded-full bg-indigo-600 transition-all duration-300" style="width: 33%"></div>
    </div>
  </div>
  <div class="divide-y divide-slate-100 dark:divide-zinc-800">
    <label class="flex cursor-pointer items-center gap-3 px-4 py-3.5 transition hover:bg-slate-50 dark:hover:bg-zinc-800/60">
      <input type="checkbox" checked data-check-item class="size-4 rounded accent-indigo-600" />
      <span data-check-text class="flex-1 text-sm font-medium text-slate-500 dark:text-zinc-400 line-through">Ship v4 color token scale</span>
      <span class="rounded-md bg-rose-50 dark:bg-rose-500/15 px-2 py-0.5 text-[11px] font-semibold text-rose-700 dark:text-rose-300">High</span>
    </label>
    <label class="flex cursor-pointer items-center gap-3 px-4 py-3.5 transition hover:bg-slate-50 dark:hover:bg-zinc-800/60">
      <input type="checkbox" data-check-item class="size-4 rounded accent-indigo-600" />
      <span data-check-text class="flex-1 text-sm font-medium text-slate-900 dark:text-zinc-100">Record interactive launch demo</span>
      <span class="rounded-md bg-indigo-50 dark:bg-indigo-500/15 px-2 py-0.5 text-[11px] font-semibold text-indigo-700 dark:text-indigo-300">Media</span>
    </label>
    <label class="flex cursor-pointer items-center gap-3 px-4 py-3.5 transition hover:bg-slate-50 dark:hover:bg-zinc-800/60">
      <input type="checkbox" data-check-item class="size-4 rounded accent-indigo-600" />
      <span data-check-text class="flex-1 text-sm font-medium text-slate-900 dark:text-zinc-100">Run Light &amp; Dark contrast audit</span>
      <span class="rounded-md bg-emerald-50 dark:bg-emerald-500/15 px-2 py-0.5 text-[11px] font-semibold text-emerald-700 dark:text-emerald-300">QA</span>
    </label>
  </div>
</div>
<script>
  document.querySelectorAll('[data-check-list]').forEach((root) => {
    const boxes = Array.from(root.querySelectorAll('[data-check-item]'));
    const prog = root.querySelector('[data-check-progress]');
    const bar = root.querySelector('[data-check-bar]');
    const update = () => {
      let done = 0;
      boxes.forEach((box) => {
        const text = box.parentElement?.querySelector('[data-check-text]');
        if (box.checked) done++;
        if (text) {
          text.classList.toggle('line-through', box.checked);
          text.classList.toggle('text-slate-500', box.checked);
          text.classList.toggle('dark:text-zinc-400', box.checked);
          text.classList.toggle('text-slate-900', !box.checked);
          text.classList.toggle('dark:text-zinc-100', !box.checked);
        }
      });
      if (prog) prog.textContent = done + ' / ' + boxes.length + ' done';
      if (bar) bar.style.width = Math.round((done / boxes.length) * 100) + '%';
    };
    boxes.forEach((b) => b.addEventListener('change', update));
  });
</script>
