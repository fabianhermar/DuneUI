          <th class="px-3 py-3">Invoice</th>

        </tr>
      </tbody>
    </table>

</div>
<script>
(() => {
  const all = document.querySelector('[data-inv-all]');
  const boxes = [...document.querySelectorAll('[data-inv-row]')];
  const label = document.querySelector('[data-inv-sel]');
  const update = () => {
    const n = boxes.filter((b) => b.checked).length;
    if (label) label.textContent = n > 0 ? n + ' invoice(s) selected for batch download' : 'Select rows to batch download receipts';
  };
  if (all) all.addEventListener('change', () => { boxes.forEach((b) => { b.checked = all.checked; }); update(); });
  boxes.forEach((b) => b.addEventListener('change', () => { if (all) all.checked = boxes.every((x) => x.checked); update(); }));
})();
</script>
