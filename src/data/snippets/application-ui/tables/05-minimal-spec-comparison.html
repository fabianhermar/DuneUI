<script>
(() => {
  const btn = document.querySelector('[data-diff-toggle]');
  const sameRows = document.querySelectorAll('[data-same="true"]');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const active = btn.getAttribute('aria-pressed') === 'true';
    const next = !active;
    btn.setAttribute('aria-pressed', next ? 'true' : 'false');
    btn.className = next
      ? 'rounded-lg border border-indigo-600 bg-indigo-600 px-3 py-1.5 text-[11px] font-semibold text-white'
      : 'rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-[11px] font-semibold text-slate-700 hover:bg-slate-50';
    sameRows.forEach((r) => { r.style.display = next ? 'none' : ''; });
  });
})();
</script>
