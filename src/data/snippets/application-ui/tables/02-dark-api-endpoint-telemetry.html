<script>

      const reg = btn.getAttribute('data-reg-btn');
      document.querySelectorAll('[data-reg-btn]').forEach((b) => {
        const active = b.getAttribute('data-reg-btn') === reg;
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
        b.className = active ? 'rounded-md bg-white/15 px-2.5 py-1 font-semibold text-white' : 'rounded-md px-2.5 py-1 text-zinc-400 hover:text-white';
      });
      (data[reg] || data.iad1).forEach((val, idx) => {
        const el = document.querySelector('[data-lat="' + idx + '"]');
        if (el) el.textContent = val;
      });
    });
  });
})();
