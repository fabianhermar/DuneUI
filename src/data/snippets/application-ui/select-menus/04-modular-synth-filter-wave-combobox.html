<div data-sel4 class="mx-auto min-h-[290px] w-full max-w-sm rounded-lg border-2 border-stone-400 dark:border-zinc-700 bg-[#E6E4DF] dark:bg-[#1B1B1D] p-4 font-mono text-stone-900 dark:text-zinc-100 shadow-inner">
  <div class="flex items-center justify-between border-b border-stone-300 dark:border-zinc-700 pb-2 text-[10px] font-bold uppercase tracking-widest">
    <span>VCF FILTER CIRCUIT</span>
    <span class="inline-flex items-center gap-1.5 text-orange-600 dark:text-orange-400"><span class="size-2 rounded-full bg-orange-500"></span>ANALOG</span>
  </div>
  <div class="mt-3 flex items-center gap-2 rounded border border-stone-400 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-2.5 py-1.5 text-xs">
    <span class="text-stone-400">&gt;</span>
    <input data-sel4-search type="text" placeholder="Search filter topology..." class="w-full bg-transparent text-xs focus:outline-none" />
  </div>
  <div class="mt-2.5 space-y-1.5 text-xs">
    <button type="button" data-sel4-opt="moog ladder 24db" data-active="true" class="cursor-pointer flex w-full items-center justify-between rounded border border-orange-500 bg-orange-500/15 px-3 py-2 text-left font-bold">
      <span>01 / Moog Ladder 24dB</span><span class="text-[10px] text-orange-700 dark:text-orange-300">LPF</span>
    </button>
    <button type="button" data-sel4-opt="tb-303 diode acid" class="cursor-pointer flex w-full items-center justify-between rounded border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-left hover:border-orange-500">
      <span>02 / TB-303 Diode Acid</span><span class="text-[10px] text-stone-500">18dB</span>
    </button>
    <button type="button" data-sel4-opt="oberheim sem state" class="cursor-pointer flex w-full items-center justify-between rounded border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-left hover:border-orange-500">
      <span>03 / Oberheim SEM Variable</span><span class="text-[10px] text-stone-500">BPF</span>
    </button>
  </div>
</div>
<script>
(() => {
  document.querySelectorAll('[data-sel4]').forEach((root) => {
    const inp = root.querySelector('[data-sel4-search]'), opts = [...root.querySelectorAll('[data-sel4-opt]')];
    const onCls = 'cursor-pointer flex w-full items-center justify-between rounded border border-orange-500 bg-orange-500/15 px-3 py-2 text-left font-bold';
    const offCls = 'cursor-pointer flex w-full items-center justify-between rounded border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-left hover:border-orange-500';
    inp?.addEventListener('input', () => {
      const q = inp.value.trim().toLowerCase();
      opts.forEach((o) => o.classList.toggle('hidden', !((o.dataset.sel4Opt || '').includes(q))));
    });
    opts.forEach((o) => o.addEventListener('click', () => opts.forEach((x) => { x.className = x === o ? onCls : offCls; })));
  });
})();
</script>
