<form data-waitlist-form class="w-full max-w-lg rounded-2xl border-2 border-black dark:border-zinc-200 bg-[#FFE14D] p-5 shadow-[6px_6px_0px_#000] dark:shadow-[6px_6px_0px_#e4e4e7] sm:p-7 text-black">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <span class="inline-block border-2 border-black bg-white px-2.5 py-0.5 text-xs font-black uppercase tracking-wider text-black">Batch 04 · Drop</span>
    <span class="font-mono text-xs font-bold text-black">118 / 500 UNITS LEFT</span>
  </div>
  <h3 class="mt-3 text-2xl font-black uppercase leading-tight tracking-tight text-black">Get early hardware access</h3>
  <p class="mt-1.5 text-sm font-medium text-black/85">Machined aluminum field synthesizer with tactile encoders and <span class="whitespace-nowrap">USB-C MIDI.</span></p>
  <div class="mt-3 flex flex-wrap gap-2">
    <span class="border border-black bg-black/5 px-2 py-0.5 font-mono text-[11px] font-bold text-black">CNC 6061 ALUMINUM</span>
    <span class="border border-black bg-black/5 px-2 py-0.5 font-mono text-[11px] font-bold text-black">SHIPS Q1 2026</span>
  </div>
  <div class="mt-5 flex flex-col gap-3 sm:flex-row">
    <input type="email" placeholder="you@studio.fm" class="min-w-0 flex-1 border-2 border-black bg-white px-4 py-3 text-sm font-semibold text-black placeholder:text-black/45 focus:outline-none" />
    <button type="button" data-waitlist-btn class="shrink-0 border-2 border-black bg-[#FB7185] px-6 py-3 text-sm font-black uppercase tracking-wide text-black shadow-[3px_3px_0px_#000] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none">Reserve Spot</button>
  </div>
</form>
<script>
  document.querySelectorAll('[data-waitlist-form]').forEach((form) => {
    const btn = form.querySelector('[data-waitlist-btn]');
    btn?.addEventListener('click', () => {
      const done = btn.textContent === 'Reserved #119';
      btn.textContent = done ? 'Reserve Spot' : 'Reserved #119';
      btn.classList.toggle('bg-[#A7F3D0]', !done);
      btn.classList.toggle('bg-[#FB7185]', done);
    });
  });
</script>
