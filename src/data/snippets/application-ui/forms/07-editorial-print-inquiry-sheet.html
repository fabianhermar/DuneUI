<form data-brief-form class="w-full max-w-xl rounded-2xl bg-[#FAF8F4] dark:bg-zinc-900 p-6 ring-1 ring-stone-200 dark:ring-zinc-800 sm:p-9 text-slate-900 dark:text-zinc-100">
  <div class="flex items-center justify-between gap-2">
    <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-stone-600 dark:text-stone-400">Commission Desk · Issue 14</p>
    <span class="text-[11px] font-medium text-amber-800 dark:text-amber-300">Spring Slots Open</span>
  </div>
  <h3 class="mt-2 font-serif text-2xl text-stone-900 dark:text-stone-100 sm:text-3xl">Tell us about your publication</h3>
  <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2">
    <div>
      <label class="block text-xs font-medium uppercase tracking-wider text-stone-600 dark:text-stone-400">Full Name</label>
      <input type="text" placeholder="Clara Vance" class="mt-1 w-full border-b border-stone-300 dark:border-zinc-700 bg-transparent py-2 text-sm text-stone-900 dark:text-stone-100 placeholder:text-stone-400 dark:placeholder:text-zinc-500 focus:border-stone-900 dark:focus:border-stone-200 focus:outline-none" />
    </div>
    <div>
      <label class="block text-xs font-medium uppercase tracking-wider text-stone-600 dark:text-stone-400">Publication</label>
      <input type="text" placeholder="Monocle Quarterly" class="mt-1 w-full border-b border-stone-300 dark:border-zinc-700 bg-transparent py-2 text-sm text-stone-900 dark:text-stone-100 placeholder:text-stone-400 dark:placeholder:text-zinc-500 focus:border-stone-900 dark:focus:border-stone-200 focus:outline-none" />
    </div>
    <div class="sm:col-span-2">
      <label class="block text-xs font-medium uppercase tracking-wider text-stone-600 dark:text-stone-400">Project Scope</label>
      <div class="mt-2.5 flex flex-wrap gap-2">
        <button type="button" data-scope-chip aria-pressed="true" class="rounded-full border border-stone-900 dark:border-zinc-200 bg-stone-900 dark:bg-white px-3.5 py-1.5 text-xs font-medium text-white dark:text-slate-950 transition">Editorial Direction</button>
        <button type="button" data-scope-chip aria-pressed="false" class="rounded-full border border-stone-300 dark:border-zinc-700 bg-transparent px-3.5 py-1.5 text-xs font-medium text-stone-700 dark:text-stone-300 transition hover:border-stone-500">Custom Type</button>
        <button type="button" data-scope-chip aria-pressed="false" class="rounded-full border border-stone-300 dark:border-zinc-700 bg-transparent px-3.5 py-1.5 text-xs font-medium text-stone-700 dark:text-stone-300 transition hover:border-stone-500">Print Binding</button>
        <button type="button" data-scope-chip aria-pressed="false" class="rounded-full border border-stone-300 dark:border-zinc-700 bg-transparent px-3.5 py-1.5 text-xs font-medium text-stone-700 dark:text-stone-300 transition hover:border-stone-500">Art Direction</button>
      </div>
    </div>
  </div>
  <div class="mt-7 flex items-center justify-between gap-4 border-t border-stone-200 dark:border-zinc-800 pt-5">
    <span class="text-xs text-stone-600 dark:text-stone-400">Est. studio reply in 48 hrs</span>
    <button type="button" data-brief-btn class="rounded-full bg-stone-900 dark:bg-white px-6 py-2.5 text-xs font-semibold uppercase tracking-wider text-white dark:text-slate-950 transition hover:bg-stone-800 dark:hover:bg-zinc-200">Send Brief</button>
  </div>
</form>
<script>
  document.querySelectorAll('[data-brief-form]').forEach((form) => {
    const chips = form.querySelectorAll('[data-scope-chip]');
    const onCls = ['border-stone-900', 'dark:border-zinc-200', 'bg-stone-900', 'dark:bg-white', 'text-white', 'dark:text-slate-950'];
    const offCls = ['border-stone-300', 'dark:border-zinc-700', 'bg-transparent', 'text-stone-700', 'dark:text-stone-300'];
    chips.forEach((c) => c.addEventListener('click', () => {
      const pressed = c.getAttribute('aria-pressed') === 'true';
      c.setAttribute('aria-pressed', pressed ? 'false' : 'true');
      if (pressed) { c.classList.remove(...onCls); c.classList.add(...offCls); }
      else { c.classList.remove(...offCls); c.classList.add(...onCls); }
    }));
    const btn = form.querySelector('[data-brief-btn]');
    btn?.addEventListener('click', () => {
      btn.textContent = btn.textContent === 'Brief Received' ? 'Send Brief' : 'Brief Received';
    });
  });
</script>
