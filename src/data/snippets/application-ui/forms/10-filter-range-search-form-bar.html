<form data-travel-form class="w-full max-w-3xl space-y-3 text-slate-900 dark:text-zinc-100">
  <div class="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-2 shadow-xl shadow-slate-900/5 sm:rounded-full">
    <div class="grid grid-cols-1 divide-y divide-slate-200 dark:divide-zinc-800 sm:grid-cols-4 sm:divide-x sm:divide-y-0">
      <div class="px-4 py-2">
        <label class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
          <svg class="h-3 w-3 text-rose-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.69 18.933l.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 00.281-.14c.186-.096.446-.24.757-.433.62-.384 1.445-.966 2.274-1.765C15.302 14.988 17 12.493 17 9A7 7 0 103 9c0 3.492 1.698 5.988 3.355 7.584a13.731 13.731 0 002.273 1.765 11.842 11.842 0 00.976.544l.062.029.018.008.006.003zM10 11.25a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z" clip-rule="evenodd"/></svg>
          Destination
        </label>
        <input type="text" value="Kyoto, Japan" class="mt-0.5 w-full bg-transparent text-sm font-semibold text-slate-900 dark:text-zinc-100 focus:outline-none" />
      </div>
      <div class="px-4 py-2">
        <label class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
          <svg class="h-3 w-3 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.75 2a.75.75 0 01.75.75V4h7V2.75a.75.75 0 011.5 0V4h.25A2.75 2.75 0 0118 6.75v8.5A2.75 2.75 0 0115.25 18H4.75A2.75 2.75 0 012 15.25v-8.5A2.75 2.75 0 014.75 4H5V2.75A.75.75 0 015.75 2zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75z" clip-rule="evenodd"/></svg>
          Check-in
        </label>
        <input type="text" value="Nov 18 – Nov 24" class="mt-0.5 w-full bg-transparent text-sm font-semibold text-slate-900 dark:text-zinc-100 focus:outline-none" />
      </div>
      <div class="px-4 py-2">
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400">Guests</label>
        <div class="mt-0.5 flex items-center justify-between gap-2">
          <span class="text-sm font-semibold text-slate-900 dark:text-zinc-100"><span data-guest-count>2</span> adults</span>
          <div class="flex items-center gap-1">
            <button type="button" data-guest-dec class="flex h-6 w-6 items-center justify-center rounded-full border border-slate-200 dark:border-zinc-700 text-xs font-bold text-slate-700 dark:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-800">-</button>
            <button type="button" data-guest-inc class="flex h-6 w-6 items-center justify-center rounded-full border border-slate-200 dark:border-zinc-700 text-xs font-bold text-slate-700 dark:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-800">+</button>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end p-1.5 sm:pl-3">
        <button type="button" data-travel-search class="flex w-full items-center justify-center gap-2 rounded-xl bg-rose-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-rose-700 sm:rounded-full">
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/></svg>
          <span data-search-label>Search</span>
        </button>
      </div>
    </div>
  </div>
  <div class="flex flex-wrap items-center justify-center gap-2">
    <button type="button" data-filter-chip aria-pressed="true" class="rounded-full border border-slate-900 dark:border-white bg-slate-900 dark:bg-white px-3 py-1 text-xs font-semibold text-white dark:text-slate-950 transition">Architectural</button>
    <button type="button" data-filter-chip aria-pressed="false" class="rounded-full border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-1 text-xs font-medium text-slate-700 dark:text-zinc-300 transition">Tea House</button>
    <button type="button" data-filter-chip aria-pressed="false" class="rounded-full border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-1 text-xs font-medium text-slate-700 dark:text-zinc-300 transition">Instant Book</button>
  </div>
</form>
<script>
  document.querySelectorAll('[data-travel-form]').forEach((form) => {
    const countEl = form.querySelector('[data-guest-count]');
    const dec = form.querySelector('[data-guest-dec]');
    const inc = form.querySelector('[data-guest-inc]');
    const search = form.querySelector('[data-travel-search]');
    const searchLbl = form.querySelector('[data-search-label]');
    let guests = 2;
    dec?.addEventListener('click', () => { guests = Math.max(1, guests - 1); if (countEl) countEl.textContent = String(guests); });
    inc?.addEventListener('click', () => { guests = Math.min(8, guests + 1); if (countEl) countEl.textContent = String(guests); });
    search?.addEventListener('click', () => {
      if (searchLbl) searchLbl.textContent = searchLbl.textContent === 'Search' ? '12 stays' : 'Search';
    });
    const onCls = ['border-slate-900', 'dark:border-white', 'bg-slate-900', 'dark:bg-white', 'font-semibold', 'text-white', 'dark:text-slate-950'];
    const offCls = ['border-slate-200', 'dark:border-zinc-700', 'bg-white', 'dark:bg-zinc-900', 'font-medium', 'text-slate-700', 'dark:text-zinc-300'];
    form.querySelectorAll('[data-filter-chip]').forEach((chip) => {
      chip.addEventListener('click', () => {
        const active = chip.getAttribute('aria-pressed') === 'true';
        chip.setAttribute('aria-pressed', active ? 'false' : 'true');
        if (active) { chip.classList.remove(...onCls); chip.classList.add(...offCls); }
        else { chip.classList.remove(...offCls); chip.classList.add(...onCls); }
      });
    });
  });
</script>
