<form data-ship-form class="w-full max-w-xl rounded-2xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5 shadow-sm sm:p-7 text-slate-900 dark:text-zinc-100">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-stone-100 dark:border-zinc-800 pb-4">
    <div>
      <h3 class="text-base font-bold text-stone-900 dark:text-stone-100">Shipping &amp; Delivery</h3>
      <p class="mt-0.5 text-xs text-stone-500 dark:text-stone-400">Select carrier speed and confirm street address.</p>
    </div>
    <span class="rounded-full bg-stone-100 dark:bg-zinc-800 px-2.5 py-1 text-xs font-semibold text-stone-700 dark:text-stone-200">Step 2 of 3</span>
  </div>
  <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
    <button type="button" data-ship-option data-ship-label="Continue · $14 Shipping" aria-pressed="true" class="flex cursor-pointer items-start justify-between gap-3 rounded-xl border-2 border-stone-900 dark:border-stone-200 bg-stone-50 dark:bg-zinc-800/80 p-3.5 text-left transition">
      <div>
        <p class="text-sm font-semibold text-stone-900 dark:text-stone-100">Express Courier</p>
        <p class="mt-0.5 text-xs text-stone-600 dark:text-stone-400">1–2 business days · Tracked</p>
      </div>
      <span class="text-sm font-bold text-stone-900 dark:text-stone-100">$14</span>
    </button>
    <button type="button" data-ship-option data-ship-label="Continue · Free Shipping" aria-pressed="false" class="flex cursor-pointer items-start justify-between gap-3 rounded-xl border border-stone-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/40 p-3.5 text-left transition hover:border-stone-400">
      <div>
        <p class="text-sm font-semibold text-stone-900 dark:text-stone-100">Carbon Neutral</p>
        <p class="mt-0.5 text-xs text-stone-600 dark:text-stone-400">4–6 business days · Offset</p>
      </div>
      <span class="text-sm font-bold text-emerald-700 dark:text-emerald-300">Free</span>
    </button>
  </div>
  <div class="mt-5 grid grid-cols-1 gap-3.5 sm:grid-cols-6">
    <div class="sm:col-span-6">
      <label class="block text-xs font-semibold text-stone-700 dark:text-stone-300">Street address</label>
      <input type="text" placeholder="742 Evergreen Terrace, Suite 4B" class="mt-1 w-full rounded-xl border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 text-sm text-stone-900 dark:text-zinc-100 placeholder:text-stone-400 focus:border-stone-900 dark:focus:border-stone-200 focus:outline-none" />
    </div>
    <div class="sm:col-span-3">
      <label class="block text-xs font-semibold text-stone-700 dark:text-stone-300">City</label>
      <input type="text" placeholder="Portland" class="mt-1 w-full rounded-xl border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 text-sm text-stone-900 dark:text-zinc-100 placeholder:text-stone-400 focus:border-stone-900 dark:focus:border-stone-200 focus:outline-none" />
    </div>
    <div class="sm:col-span-2">
      <label class="block text-xs font-semibold text-stone-700 dark:text-stone-300">State</label>
      <input type="text" placeholder="OR" class="mt-1 w-full rounded-xl border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 text-sm text-stone-900 dark:text-zinc-100 placeholder:text-stone-400 focus:border-stone-900 dark:focus:border-stone-200 focus:outline-none" />
    </div>
    <div class="sm:col-span-1">
      <label class="block text-xs font-semibold text-stone-700 dark:text-stone-300">ZIP</label>
      <input type="text" placeholder="97209" class="mt-1 w-full rounded-xl border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 font-mono text-sm text-stone-900 dark:text-zinc-100 placeholder:text-stone-400 focus:border-stone-900 dark:focus:border-stone-200 focus:outline-none" />
    </div>
  </div>
  <button type="button" data-ship-cta class="mt-5 w-full rounded-xl bg-stone-900 dark:bg-white py-3 text-sm font-semibold text-white dark:text-slate-950 transition hover:bg-stone-800 dark:hover:bg-zinc-200">Continue · $14 Shipping</button>
</form>
<script>
  document.querySelectorAll('[data-ship-form]').forEach((form) => {
    const opts = form.querySelectorAll('[data-ship-option]');
    const cta = form.querySelector('[data-ship-cta]');
    const onCls = ['border-2', 'border-stone-900', 'dark:border-stone-200', 'bg-stone-50', 'dark:bg-zinc-800/80'];
    const offCls = ['border', 'border-stone-200', 'dark:border-zinc-700', 'bg-white', 'dark:bg-zinc-950/40'];
    opts.forEach((opt) => opt.addEventListener('click', () => {
      opts.forEach((x) => { x.setAttribute('aria-pressed', 'false'); x.classList.remove(...onCls); x.classList.add(...offCls); });
      opt.setAttribute('aria-pressed', 'true');
      opt.classList.remove(...offCls);
      opt.classList.add(...onCls);
      if (cta) cta.textContent = opt.getAttribute('data-ship-label') || 'Continue to Payment';
    }));
  });
</script>
