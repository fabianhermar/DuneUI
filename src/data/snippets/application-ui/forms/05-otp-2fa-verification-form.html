<form data-otp-form class="w-full max-w-md rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 text-center shadow-sm sm:p-8 text-slate-900 dark:text-zinc-100">
  <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-50 dark:bg-blue-500/15 text-blue-600 dark:text-blue-400 ring-1 ring-blue-500/20">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
  </div>
  <h3 class="mt-4 text-lg font-bold tracking-tight text-slate-900 dark:text-zinc-100">Verify two-factor code</h3>
  <p class="mt-1 text-sm text-slate-500 dark:text-zinc-400">Sent to <span class="font-mono font-semibold text-slate-800 dark:text-zinc-200">+1 ••• ••• 4910</span></p>
  <div class="mt-6 grid grid-cols-6 gap-2 sm:gap-2.5">
    <input type="text" inputmode="numeric" maxlength="1" value="4" data-otp-input class="h-12 w-full rounded-xl border-2 border-blue-500 bg-blue-50/50 dark:bg-blue-500/15 text-center font-mono text-lg font-bold text-slate-900 dark:text-zinc-100 focus:outline-none" />
    <input type="text" inputmode="numeric" maxlength="1" value="9" data-otp-input class="h-12 w-full rounded-xl border-2 border-blue-500 bg-blue-50/50 dark:bg-blue-500/15 text-center font-mono text-lg font-bold text-slate-900 dark:text-zinc-100 focus:outline-none" />
    <input type="text" inputmode="numeric" maxlength="1" value="2" data-otp-input class="h-12 w-full rounded-xl border-2 border-blue-500 bg-blue-50/50 dark:bg-blue-500/15 text-center font-mono text-lg font-bold text-slate-900 dark:text-zinc-100 focus:outline-none" />
    <input type="text" inputmode="numeric" maxlength="1" placeholder="•" data-otp-input class="h-12 w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 text-center font-mono text-lg font-bold text-slate-900 dark:text-zinc-100 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
    <input type="text" inputmode="numeric" maxlength="1" placeholder="•" data-otp-input class="h-12 w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 text-center font-mono text-lg font-bold text-slate-900 dark:text-zinc-100 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
    <input type="text" inputmode="numeric" maxlength="1" placeholder="•" data-otp-input class="h-12 w-full rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 text-center font-mono text-lg font-bold text-slate-900 dark:text-zinc-100 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
  </div>
  <button type="button" data-otp-submit class="mt-6 w-full rounded-xl bg-blue-600 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700">Verify identity</button>
  <p class="mt-4 text-xs text-slate-500 dark:text-zinc-400">Didn't receive a code? <button type="button" data-otp-resend class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">Resend in 24s</button></p>
</form>
<script>
  document.querySelectorAll('[data-otp-form]').forEach((form) => {
    const inputs = Array.from(form.querySelectorAll('[data-otp-input]'));
    const submit = form.querySelector('[data-otp-submit]');
    const resend = form.querySelector('[data-otp-resend]');
    inputs.forEach((inp, idx) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 1);
        if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && idx > 0) inputs[idx - 1].focus();
      });
    });
    submit?.addEventListener('click', () => {
      const ok = submit.textContent === 'Identity verified';
      submit.textContent = ok ? 'Verify identity' : 'Identity verified';
      submit.classList.toggle('bg-emerald-600', !ok);
      submit.classList.toggle('bg-blue-600', ok);
    });
    resend?.addEventListener('click', () => { resend.textContent = 'New code sent'; });
  });
</script>
