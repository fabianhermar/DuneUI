<form data-glass-form class="w-full max-w-lg rounded-3xl border border-slate-900/15 dark:border-white/25 bg-white/85 dark:bg-zinc-900/80 p-5 text-slate-900 dark:text-white shadow-xl backdrop-blur-2xl sm:p-7">
  <div class="inline-flex items-center gap-2 rounded-full border border-slate-900/10 dark:border-white/20 bg-slate-900/5 dark:bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider text-slate-700 dark:text-zinc-200">
    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
    Solutions Desk
  </div>
  <h3 class="mt-3 text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Book a private architecture demo</h3>
  <p class="mt-1 text-sm text-slate-600 dark:text-zinc-300">A principal solutions engineer replies within 2 business hours.</p>
  <div class="mt-5 grid grid-cols-1 gap-3.5 sm:grid-cols-2">
    <div>
      <label class="block text-xs font-medium text-slate-700 dark:text-zinc-200">First name</label>
      <input type="text" value="Elena" class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/20 bg-white dark:bg-zinc-950/70 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-700 dark:text-zinc-200">Last name</label>
      <input type="text" value="Kowalski" class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/20 bg-white dark:bg-zinc-950/70 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>
    <div class="sm:col-span-2">
      <label class="block text-xs font-medium text-slate-700 dark:text-zinc-200">Work email</label>
      <input type="email" placeholder="elena@company.dev" class="mt-1 w-full rounded-xl border border-slate-200 dark:border-white/20 bg-white dark:bg-zinc-950/70 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>
    <div class="sm:col-span-2">
      <label class="block text-xs font-medium text-slate-700 dark:text-zinc-200">Engineering Team Size</label>
      <div class="mt-1.5 grid grid-cols-4 gap-2">
        <button type="button" data-size-btn class="rounded-xl border border-slate-200 dark:border-white/20 bg-white dark:bg-zinc-950/70 py-2 text-xs font-semibold text-slate-700 dark:text-zinc-200 transition">1–25</button>
        <button type="button" data-size-btn aria-pressed="true" class="rounded-xl border border-slate-900 dark:border-white bg-slate-900 dark:bg-white py-2 text-xs font-semibold text-white dark:text-slate-950 transition">25–100</button>
        <button type="button" data-size-btn class="rounded-xl border border-slate-200 dark:border-white/20 bg-white dark:bg-zinc-950/70 py-2 text-xs font-semibold text-slate-700 dark:text-zinc-200 transition">100–500</button>
        <button type="button" data-size-btn class="rounded-xl border border-slate-200 dark:border-white/20 bg-white dark:bg-zinc-950/70 py-2 text-xs font-semibold text-slate-700 dark:text-zinc-200 transition">500+</button>
      </div>
    </div>
  </div>
  <button type="button" data-glass-submit class="mt-5 w-full rounded-2xl bg-slate-900 dark:bg-white py-3 text-sm font-semibold text-white dark:text-slate-950 shadow-lg transition hover:bg-slate-800 dark:hover:bg-zinc-200">Request Session</button>
</form>
<script>
  document.querySelectorAll('[data-glass-form]').forEach((form) => {
    const sizeBtns = form.querySelectorAll('[data-size-btn]');
    const submitBtn = form.querySelector('[data-glass-submit]');
    const activeCls = ['border-slate-900', 'dark:border-white', 'bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-950'];
    const idleCls = ['border-slate-200', 'dark:border-white/20', 'bg-white', 'dark:bg-zinc-950/70', 'text-slate-700', 'dark:text-zinc-200'];
    sizeBtns.forEach((b) => b.addEventListener('click', () => {
      sizeBtns.forEach((x) => { x.setAttribute('aria-pressed', 'false'); x.classList.remove(...activeCls); x.classList.add(...idleCls); });
      b.setAttribute('aria-pressed', 'true');
      b.classList.remove(...idleCls);
      b.classList.add(...activeCls);
    }));
    submitBtn?.addEventListener('click', () => {
      const done = submitBtn.textContent === 'Session Requested';
      submitBtn.textContent = done ? 'Request Session' : 'Session Requested';
    });
  });
</script>
