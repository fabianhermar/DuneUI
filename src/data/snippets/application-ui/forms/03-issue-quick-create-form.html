<form data-issue-form class="w-full max-w-lg rounded-2xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#121318] p-5 text-slate-900 dark:text-zinc-100 shadow-lg dark:shadow-2xl sm:p-6">
  <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600 dark:text-zinc-400">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 rounded-md border border-slate-900/15 dark:border-white/15 bg-slate-900/[0.05] dark:bg-white/5 px-2 py-0.5 font-mono font-semibold text-slate-700 dark:text-zinc-200">
        <span class="h-1.5 w-1.5 rounded-full bg-violet-500"></span>
        ENG-402
      </span>
      <span class="text-slate-500 dark:text-zinc-400">› Core UI</span>
    </div>
    <span data-issue-draft class="font-mono text-[11px] text-slate-500 dark:text-zinc-400">Draft saved</span>
  </div>
  <input type="text" value="Refactor responsive preview iframe sizing hook" class="mt-4 w-full bg-transparent text-base font-semibold tracking-tight text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:outline-none sm:text-lg" />
  <textarea rows="3" placeholder="Add acceptance criteria, Figma links, or reproduction notes..." class="mt-2 w-full resize-none bg-transparent text-sm leading-relaxed text-slate-600 dark:text-zinc-300 placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:outline-none">Ensure Tailwind media queries inside component previews switch cleanly at 375px and 768px breakpoints without scroll jump.</textarea>
  <div class="mt-4 flex flex-wrap items-center gap-2 border-t border-slate-200 dark:border-white/10 pt-4">
    <button type="button" data-priority-btn class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-white/5 px-2.5 py-1.5 text-xs font-medium text-slate-800 dark:text-zinc-200 transition hover:border-violet-400">
      <span class="h-2 w-2 rounded-sm bg-amber-500"></span>
      Priority: <strong data-priority-val>High</strong>
    </button>
    <button type="button" data-status-btn class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-white/5 px-2.5 py-1.5 text-xs font-medium text-slate-800 dark:text-zinc-200 transition hover:border-violet-400">
      <span class="h-2 w-2 rounded-full border-2 border-violet-500"></span>
      <span data-status-val>In Progress</span>
    </button>
    <span class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-white/5 px-2.5 py-1.5 text-xs font-medium text-violet-700 dark:text-violet-300">
      <img src="/images/avatars/mateo.jpg" alt="Mateo" class="h-4 w-4 rounded-full object-cover" />
      @frontend
    </span>
  </div>
  <div class="mt-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <label class="inline-flex cursor-pointer items-center gap-2 text-xs font-medium text-slate-600 dark:text-zinc-300">
      <input type="checkbox" checked class="h-3.5 w-3.5 rounded accent-violet-500" />
      Create more
    </label>
    <div class="flex items-center justify-end gap-2">
      <span class="hidden sm:inline-flex items-center rounded border border-slate-200 dark:border-white/15 px-1.5 py-0.5 font-mono text-[10px] text-slate-500 dark:text-zinc-400">⌘ ↵</span>
      <button type="button" data-issue-create class="rounded-lg bg-violet-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-violet-500">Create Issue</button>
    </div>
  </div>
</form>
<script>
  document.querySelectorAll('[data-issue-form]').forEach((form) => {
    const priorities = ['High', 'Urgent', 'Medium'];
    const statuses = ['In Progress', 'Todo', 'Backlog'];
    let pi = 0, si = 0;
    const pBtn = form.querySelector('[data-priority-btn]');
    const pVal = form.querySelector('[data-priority-val]');
    const sBtn = form.querySelector('[data-status-btn]');
    const sVal = form.querySelector('[data-status-val]');
    const cBtn = form.querySelector('[data-issue-create]');
    const draft = form.querySelector('[data-issue-draft]');
    pBtn?.addEventListener('click', () => { pi = (pi + 1) % priorities.length; if (pVal) pVal.textContent = priorities[pi]; });
    sBtn?.addEventListener('click', () => { si = (si + 1) % statuses.length; if (sVal) sVal.textContent = statuses[si]; });
    cBtn?.addEventListener('click', () => {
      const created = cBtn.textContent === 'Created ENG-402';
      cBtn.textContent = created ? 'Create Issue' : 'Created ENG-402';
      if (draft) draft.textContent = created ? 'Draft saved' : 'Synced to Linear';
    });
  });
</script>
