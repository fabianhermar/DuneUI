<form data-ws-form class="w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5 shadow-sm sm:p-8 text-slate-900 dark:text-zinc-100">
  <div class="flex flex-wrap items-start justify-between gap-4 border-b border-slate-100 dark:border-zinc-800/80 pb-5">
    <div class="flex items-center gap-3.5">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-sm font-bold text-white shadow-sm">NS</div>
      <div>
        <h3 class="text-base font-semibold tracking-tight text-slate-900 dark:text-zinc-100">Workspace Profile</h3>
        <p class="mt-0.5 text-sm text-slate-500 dark:text-zinc-400">Manage organization identity, domain handle, and public profile.</p>
      </div>
    </div>
    <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-1 text-xs font-medium text-emerald-700 dark:text-emerald-300">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
      Org Verified
    </span>
  </div>
  <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2">
    <div class="min-w-0">
      <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-zinc-300">Workspace Name</label>
      <input type="text" value="Northstar Studio" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 text-sm text-slate-900 dark:text-zinc-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>
    <div class="min-w-0">
      <div class="flex items-center justify-between gap-2">
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-zinc-300">Subdomain</label>
        <span class="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">Available</span>
      </div>
      <div class="mt-1.5 flex w-full overflow-hidden rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20">
        <input type="text" value="northstar" class="min-w-0 flex-1 bg-transparent px-3.5 py-2.5 text-sm font-medium text-slate-900 dark:text-zinc-100 focus:outline-none" />
        <span class="flex items-center border-l border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800/80 px-3 text-xs font-mono text-slate-600 dark:text-zinc-300">.dune.app</span>
      </div>
    </div>
    <div class="min-w-0">
      <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-zinc-300">Billing Contact</label>
      <input type="email" value="ops@northstar.design" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 text-sm text-slate-900 dark:text-zinc-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    </div>
    <div class="min-w-0">
      <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-zinc-300">Primary Region</label>
      <div class="relative mt-1.5">
        <select class="w-full appearance-none rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 pr-9 text-sm text-slate-900 dark:text-zinc-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
          <option>US East · Virginia</option>
          <option>EU West · Frankfurt</option>
          <option>AP East · Tokyo</option>
        </select>
        <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
      </div>
    </div>
    <div class="min-w-0 sm:col-span-2">
      <div class="flex items-center justify-between gap-2">
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-zinc-300">Bio &amp; Description</label>
        <span data-bio-count class="font-mono text-[11px] text-slate-500 dark:text-zinc-400">68 / 160</span>
      </div>
      <textarea data-bio-input rows="3" maxlength="160" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/60 px-3.5 py-2.5 text-sm text-slate-900 dark:text-zinc-100 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">Product design & interface engineering collective based in Montreal.</textarea>
    </div>
  </div>
  <div class="mt-6 flex flex-col-reverse gap-3 border-t border-slate-100 dark:border-zinc-800/80 pt-5 sm:flex-row sm:items-center sm:justify-between">
    <span data-ws-status class="text-xs text-slate-500 dark:text-zinc-400">Changes sync across team members</span>
    <div class="flex items-center justify-end gap-2.5">
      <button type="reset" class="rounded-xl border border-slate-200 dark:border-zinc-700 px-4 py-2 text-sm font-medium text-slate-700 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800">Reset</button>
      <button type="button" data-ws-save class="inline-flex items-center justify-center gap-1.5 rounded-xl bg-indigo-600 px-5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700">
        <span data-ws-save-label>Save changes</span>
      </button>
    </div>
  </div>
</form>
<script>
  document.querySelectorAll('[data-ws-form]').forEach((form) => {
    const bio = form.querySelector('[data-bio-input]');
    const count = form.querySelector('[data-bio-count]');
    const btn = form.querySelector('[data-ws-save]');
    const label = form.querySelector('[data-ws-save-label]');
    const status = form.querySelector('[data-ws-status]');
    const syncCount = () => { if (bio && count) count.textContent = bio.value.length + ' / 160'; };
    bio?.addEventListener('input', syncCount);
    form.addEventListener('reset', () => setTimeout(syncCount, 0));
    btn?.addEventListener('click', () => {
      if (!label) return;
      const saved = label.textContent === 'Saved changes';
      label.textContent = saved ? 'Save changes' : 'Saved changes';
      if (status) status.textContent = saved ? 'Changes sync across team members' : 'All changes saved to workspace';
      btn.classList.toggle('bg-emerald-600', !saved);
      btn.classList.toggle('hover:bg-emerald-700', !saved);
      btn.classList.toggle('bg-indigo-600', saved);
      btn.classList.toggle('hover:bg-indigo-700', saved);
    });
  });
</script>
