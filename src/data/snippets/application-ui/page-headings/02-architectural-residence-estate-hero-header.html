<header class="mx-auto w-full max-w-5xl overflow-hidden rounded-3xl border border-stone-300 dark:border-zinc-800 bg-white dark:bg-zinc-950 text-stone-900 dark:text-zinc-100 shadow-sm">
  <div class="relative h-52 sm:h-60 w-full overflow-hidden">
    <img src="/images/heroes/concrete-pavilion.jpg" alt="Brutalist concrete pavilion" class="h-full w-full object-cover" />
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
    <div class="absolute top-4 left-5 right-5 flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono text-white/90">
      <span class="rounded-full bg-black/50 px-3 py-1 backdrop-blur-md border border-white/15">46.9480&deg; N, 7.4474&deg; E &middot; BERN</span>
      <span class="rounded-full bg-white/90 px-3 py-1 font-semibold text-stone-950">PRIVATE LISTING</span>
    </div>
    <div class="absolute bottom-5 left-5 right-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between text-white">
      <div>
        <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-stone-300">Kastel Architekten &middot; Built 2024</p>
        <h1 class="mt-1 font-serif text-2xl sm:text-3xl tracking-tight">Casa Aare Monolith</h1>
      </div>
      <div class="flex items-center gap-2.5">
        <button type="button" data-ph2-book class="rounded-full bg-white px-4 py-2 text-xs font-semibold text-stone-950 hover:bg-stone-100 transition-colors">Request Private Tour</button>
      </div>
    </div>
  </div>
  <div class="grid grid-cols-2 divide-x divide-y sm:divide-y-0 divide-stone-200 dark:divide-zinc-800 sm:grid-cols-4 text-xs">
    <div class="px-5 py-3.5"><span class="text-[10px] font-mono uppercase text-stone-400 dark:text-zinc-500">ASKING PRICE</span><p class="mt-0.5 font-mono font-bold text-stone-900 dark:text-white">CHF 4,850,000</p></div>
    <div class="px-5 py-3.5"><span class="text-[10px] font-mono uppercase text-stone-400 dark:text-zinc-500">INTERIOR AREA</span><p class="mt-0.5 font-semibold">412 m&sup2; / 4 Bed</p></div>
    <div class="px-5 py-3.5"><span class="text-[10px] font-mono uppercase text-stone-400 dark:text-zinc-500">MATERIALITY</span><p class="mt-0.5 font-semibold">Board-Formed Concrete</p></div>
    <div class="px-5 py-3.5"><span class="text-[10px] font-mono uppercase text-stone-400 dark:text-zinc-500">ENERGY GRADE</span><p class="mt-0.5 font-mono text-emerald-700 dark:text-emerald-400">Minergie-P Eco</p></div>
  </div>
</header>
<script>
(function(){
  const btn = document.querySelector('[data-ph2-book]');
  btn?.addEventListener('click', () => { btn.textContent = 'Concierge Notified ✓'; setTimeout(() => { btn.textContent = 'Request Private Tour'; }, 1200); });
})();
</script>
