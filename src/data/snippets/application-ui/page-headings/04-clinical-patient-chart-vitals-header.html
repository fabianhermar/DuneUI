<header class="mx-auto w-full max-w-5xl rounded-2xl border border-teal-200/80 dark:border-teal-900/60 bg-white dark:bg-zinc-900 p-5 sm:p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div class="flex items-start sm:items-center gap-4">
      <div class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-teal-50 dark:bg-teal-500/15 font-mono text-sm font-bold text-teal-700 dark:text-teal-300 ring-1 ring-teal-200 dark:ring-teal-500/30">ML</div>
      <div>
        <div class="flex flex-wrap items-center gap-2">
          <h1 class="text-lg font-bold text-slate-900 dark:text-white">Mateo L&oacute;pez, 34M</h1>
          <span class="rounded-md bg-slate-100 dark:bg-zinc-800 px-2 py-0.5 font-mono text-[11px] text-slate-600 dark:text-zinc-300">MRN #904-218</span>
          <span class="rounded-full bg-rose-50 dark:bg-rose-500/15 px-2.5 py-0.5 text-[11px] font-semibold text-rose-700 dark:text-rose-300 ring-1 ring-rose-200 dark:ring-rose-500/30">Allergy: Penicillin</span>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-600 dark:text-zinc-400">
          <span>Blood Type: <strong class="font-mono text-slate-900 dark:text-zinc-200">O+</strong></span>
          <span>BP: <strong class="font-mono text-teal-700 dark:text-teal-300">118/76 mmHg</strong></span>
          <span>HR: <strong class="font-mono text-slate-900 dark:text-zinc-200">64 bpm</strong></span>
          <span>Attending: <strong class="text-slate-800 dark:text-zinc-200">Dr. S. Lin</strong></span>
        </div>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 shrink-0">
      <button type="button" class="rounded-xl border border-slate-200 dark:border-zinc-700 px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-zinc-200 hover:bg-slate-50 dark:hover:bg-zinc-800">Lab Results</button>
      <button type="button" data-ph4-consult class="rounded-xl bg-teal-600 px-4 py-2 text-xs font-semibold text-white hover:bg-teal-500 transition-colors">Begin Consult</button>
    </div>
  </div>
</header>
<script>
(function(){
  const c = document.querySelector('[data-ph4-consult]');
  let active = false;
  c?.addEventListener('click', () => { active = !active; c.textContent = active ? 'Consult Active · 00:01' : 'Begin Consult'; });
})();
</script>
