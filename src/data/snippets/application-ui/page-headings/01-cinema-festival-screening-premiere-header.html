<header class="mx-auto w-full max-w-5xl overflow-hidden rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50 dark:bg-[#0D0D0F] text-stone-900 dark:text-stone-100">
  <div class="grid grid-cols-1 md:grid-cols-12">
    <div class="p-6 sm:p-8 md:col-span-8 flex flex-col justify-between">
      <div>
        <div class="flex flex-wrap items-center gap-3 text-[10px] font-mono uppercase tracking-[0.22em] text-rose-700 dark:text-rose-400">
          <span>OFFICIAL SELECTION &middot; VENICE 2026</span>
          <span class="text-stone-300 dark:text-zinc-700">/</span>
          <span class="text-stone-500 dark:text-zinc-400">4K RESTORATION</span>
        </div>
        <h1 class="mt-3 font-serif text-3xl sm:text-4xl tracking-tight text-stone-950 dark:text-white">L&rsquo;Ombre du Vent</h1>
        <p class="mt-2 max-w-xl text-xs leading-relaxed text-stone-600 dark:text-zinc-400">Directed by Claire Moreau &middot; 138 min &middot; Shot on 65mm Eastmancolor. Screenings include live Q&amp;A with cinematographer.</p>
      </div>
      <div class="mt-6 flex flex-wrap items-center gap-3">
        <button type="button" data-ph1-play class="inline-flex items-center gap-2 rounded-full bg-rose-700 px-5 py-2.5 text-xs font-semibold text-white hover:bg-rose-600 transition-colors">
          <span>&#9654;</span> Watch Trailer
        </button>
        <button type="button" data-ph1-save class="inline-flex items-center gap-1.5 rounded-full border border-stone-300 dark:border-zinc-700 px-4 py-2.5 text-xs font-medium text-stone-800 dark:text-zinc-200 hover:bg-stone-200/60 dark:hover:bg-zinc-800 transition-colors">+ Watchlist</button>
        <span class="ml-auto font-mono text-[11px] text-stone-500 dark:text-zinc-500">RATIO 2.39:1 &middot; DOLBY ATMOS</span>
      </div>
    </div>
    <div class="relative min-h-[160px] md:col-span-4 bg-stone-900">
      <img src="/images/heroes/staircase-sunlight.jpg" alt="Film still" class="h-full w-full object-cover opacity-85" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent flex items-end p-4">
        <span class="font-mono text-[10px] uppercase tracking-widest text-white/90">Sala Grande &middot; 20:30 CET</span>
      </div>
    </div>
  </div>
</header>
<script>
(function(){
  const play = document.querySelector('[data-ph1-play]'), save = document.querySelector('[data-ph1-save]');
  let saved = false;
  play?.addEventListener('click', () => { play.textContent = 'Playing Preview...'; setTimeout(() => { play.innerHTML = '<span>&#9654;</span> Watch Trailer'; }, 1200); });
  save?.addEventListener('click', () => { saved = !saved; save.textContent = saved ? '✓ In Watchlist' : '+ Watchlist'; });
})();
</script>
