<header class="mx-auto w-full max-w-4xl rounded-2xl border border-stone-200 dark:border-zinc-800 bg-[#F4F1EA] dark:bg-[#161614] p-5 sm:p-6 text-stone-900 dark:text-stone-100 shadow-sm">
  <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-4 min-w-0">
      <img src="/images/heroes/synth-modular.jpg" alt="Modular synth sleeve" class="size-20 sm:size-24 shrink-0 rounded-xl object-cover ring-1 ring-stone-900/10 dark:ring-white/15 shadow-md" />
      <div class="min-w-0">
        <span class="inline-block rounded bg-amber-500/20 px-2 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider text-amber-800 dark:text-amber-300">LP 180G VINYL &middot; CAT# 019</span>
        <h1 class="mt-1.5 truncate text-xl sm:text-2xl font-bold tracking-tight text-stone-950 dark:text-white">Patchworks in D Minor</h1>
        <p class="mt-0.5 text-xs text-stone-600 dark:text-stone-400">Klangwerk Berlin &middot; 9 Tracks &middot; 46:12</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2.5 shrink-0">
      <button type="button" data-ph3-play class="inline-flex items-center gap-2 rounded-full bg-stone-950 dark:bg-amber-400 px-4 py-2.5 text-xs font-bold text-white dark:text-stone-950 hover:opacity-90 transition-opacity">
        <span data-ph3-icon>&#9654;</span> <span data-ph3-lbl>Play Preview</span>
      </button>
      <button type="button" class="rounded-full border border-stone-300 dark:border-stone-700 px-4 py-2.5 text-xs font-semibold text-stone-800 dark:text-stone-200 hover:bg-stone-200/50 dark:hover:bg-stone-800 transition-colors">Order Vinyl &middot; $32</button>
    </div>
  </div>
  <div class="mt-5 flex items-center gap-3 border-t border-stone-300/70 dark:border-stone-800 pt-3.5">
    <span data-ph3-time class="font-mono text-[11px] text-stone-500 dark:text-stone-400">00:42 / 04:18</span>
    <div class="flex-1 flex items-center gap-1 h-4">
      <span class="h-2 w-1 rounded-full bg-amber-600 dark:bg-amber-400"></span>
      <span class="h-4 w-1 rounded-full bg-amber-600 dark:bg-amber-400"></span>
      <span class="h-3 w-1 rounded-full bg-amber-600 dark:bg-amber-400"></span>
      <span class="h-4 w-1 rounded-full bg-amber-600 dark:bg-amber-400"></span>
      <span class="h-2 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-3 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-1.5 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-3.5 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-2 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-4 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-2.5 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
      <span class="h-1.5 w-1 rounded-full bg-stone-300 dark:bg-stone-700"></span>
    </div>
    <span class="font-mono text-[10px] uppercase text-stone-500 dark:text-stone-400">118 BPM &middot; Analog Tape</span>
  </div>
</header>
<script>
(function(){
  let playing = false;
  const btn = document.querySelector('[data-ph3-play]'), icon = document.querySelector('[data-ph3-icon]'), lbl = document.querySelector('[data-ph3-lbl]');
  btn?.addEventListener('click', () => {
    playing = !playing;
    if (icon) icon.textContent = playing ? '❚❚' : '▶';
    if (lbl) lbl.textContent = playing ? 'Pause Track 01' : 'Play Preview';
  });
})();
</script>
