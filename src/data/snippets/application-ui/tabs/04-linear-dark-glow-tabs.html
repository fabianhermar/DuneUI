<script>
(() => {
  const tabs = document.querySelectorAll('[data-ltab]');
  const panels = document.querySelectorAll('[data-lpanel]');
  tabs.forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-ltab');
      tabs.forEach((t) => {
        const active = t.getAttribute('data-ltab') === id;
        t.setAttribute('aria-selected', active ? 'true' : 'false');
        t.className = active
          ? 'rounded-lg bg-zinc-800 px-3.5 py-1.5 font-semibold text-white shadow ring-1 ring-white/10'
          : 'rounded-lg px-3.5 py-1.5 font-medium text-zinc-400 hover:text-white';
      });
      panels.forEach((p) => {
        const show = p.getAttribute('data-lpanel') === id;
        p.classList.toggle('hidden', !show);
        if (id !== 'logs') p.classList.toggle('flex', show);
      });
    });
  });
})();
</script>
