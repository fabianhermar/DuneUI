<div class="mx-auto w-full max-w-xl rounded-2xl bg-white dark:bg-zinc-900 p-5 shadow-sm ring-1 ring-slate-200 dark:ring-zinc-800 sm:p-6 text-black dark:text-zinc-100">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 dark:border-zinc-800/80 pb-4">
    <div>
      <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 dark:text-zinc-500">Treasury Statements</p>
      <h4 class="text-sm font-bold text-slate-900 dark:text-zinc-100">Quarterly Payout Summary</h4>
    </div>
    <div role="tablist" aria-label="Fiscal quarter" class="flex flex-wrap gap-1.5">
      <button type="button" data-qtab="q4" data-qrev="$148,920.00" data-qtax="$22,338.00" aria-selected="true" class="rounded-lg bg-violet-600 px-3 py-1.5 text-xs font-semibold text-white shadow-xs">Q4 2026</button>
      <button type="button" data-qtab="q3" data-qrev="$126,410.00" data-qtax="$18,961.50" aria-selected="false" class="rounded-lg bg-white dark:bg-zinc-800 px-3 py-1.5 text-xs font-medium text-slate-600 dark:text-zinc-300 ring-1 ring-slate-200 dark:ring-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-800/60">Q3 2026</button>
      <button type="button" data-qtab="q2" data-qrev="$104,180.00" data-qtax="$15,627.00" aria-selected="false" class="rounded-lg bg-white dark:bg-zinc-800 px-3 py-1.5 text-xs font-medium text-slate-600 dark:text-zinc-300 ring-1 ring-slate-200 dark:ring-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-800/60">Q2 2026</button>
    </div>
  </div>
  <div class="mt-4 grid grid-cols-1 gap-3 text-xs sm:grid-cols-2">
    <div class="rounded-xl bg-slate-50 dark:bg-zinc-800/60 p-3.5">
      <p class="text-slate-500 dark:text-zinc-400">Net Disbursed</p>
      <p data-qrev-out class="mt-1 font-mono text-lg font-bold text-slate-900 dark:text-zinc-100">$148,920.00</p>
    </div>
    <div class="rounded-xl bg-slate-50 dark:bg-zinc-800/60 p-3.5">
      <p class="text-slate-500 dark:text-zinc-400">Withheld Tax Reserve</p>
      <p data-qtax-out class="mt-1 font-mono text-lg font-bold text-emerald-700 dark:text-emerald-300">$22,338.00</p>
    </div>
  </div>
</div>
<script>
(() => {
  const tabs = document.querySelectorAll('[data-qtab]');
  const revOut = document.querySelector('[data-qrev-out]');
  const taxOut = document.querySelector('[data-qtax-out]');
  tabs.forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-qtab');
      tabs.forEach((t) => {
        const active = t.getAttribute('data-qtab') === id;
        t.setAttribute('aria-selected', active ? 'true' : 'false');
        t.className = active
          ? 'rounded-lg bg-violet-600 px-3 py-1.5 text-xs font-semibold text-white shadow-xs'
          : 'rounded-lg bg-white px-3 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50';
      });
      if (revOut) revOut.textContent = btn.getAttribute('data-qrev') || '';
      if (taxOut) taxOut.textContent = btn.getAttribute('data-qtax') || '';
    });
  });
})();
</script>
