<div class="w-full max-w-md rounded-2xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5 shadow-xs text-black dark:text-zinc-100" data-merch-box>
  <div class="flex items-center justify-between gap-3 border-b border-stone-100 dark:border-zinc-800/80 pb-3.5">
    <div>
      <p class="text-[11px] font-semibold uppercase tracking-wider text-stone-400 dark:text-zinc-400">Atelier Knitwear</p>
      <h4 class="text-sm font-bold text-stone-900 dark:text-stone-100">Heavyweight Merino Crewneck</h4>
    </div>
    <span class="text-base font-bold text-stone-900 dark:text-stone-100">$118</span>
  </div>
  <div class="mt-3.5 flex flex-wrap items-center justify-between gap-4">
    <div>
      <p class="mb-1.5 text-[11px] font-semibold text-stone-500 dark:text-stone-400">Size: <span data-size-label class="text-stone-900 dark:text-stone-100">M (Regular)</span></p>
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="const r=this.closest('[data-merch-box]');r.querySelector('[data-size-label]').textContent='M (Regular)';r.querySelectorAll('[data-sz]').forEach(b=>b.className='rounded-lg border border-stone-200 dark:border-zinc-700 px-3 py-1.5 text-xs font-semibold text-stone-700 dark:text-zinc-300');this.className='rounded-lg border border-stone-900 dark:border-white bg-stone-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-stone-950';" data-sz class="rounded-lg border border-stone-900 dark:border-white bg-stone-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-stone-950">M</button>
        <button type="button" onclick="const r=this.closest('[data-merch-box]');r.querySelector('[data-size-label]').textContent='L (Relaxed)';r.querySelectorAll('[data-sz]').forEach(b=>b.className='rounded-lg border border-stone-200 dark:border-zinc-700 px-3 py-1.5 text-xs font-semibold text-stone-700 dark:text-zinc-300');this.className='rounded-lg border border-stone-900 dark:border-white bg-stone-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-stone-950';" data-sz class="rounded-lg border border-stone-200 dark:border-zinc-700 px-3 py-1.5 text-xs font-semibold text-stone-700 dark:text-zinc-300">L</button>
        <button type="button" onclick="const r=this.closest('[data-merch-box]');r.querySelector('[data-size-label]').textContent='XL (2 left)';r.querySelectorAll('[data-sz]').forEach(b=>b.className='rounded-lg border border-stone-200 dark:border-zinc-700 px-3 py-1.5 text-xs font-semibold text-stone-700 dark:text-zinc-300');this.className='rounded-lg border border-stone-900 dark:border-white bg-stone-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-stone-950';" data-sz class="rounded-lg border border-stone-200 dark:border-zinc-700 px-3 py-1.5 text-xs font-semibold text-stone-700 dark:text-zinc-300">XL</button>
      </div>
    </div>
    <div>
      <p class="mb-1.5 text-[11px] font-semibold text-stone-500 dark:text-stone-400">Quantity</p>
      <div class="inline-flex items-center rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50 dark:bg-zinc-800/60">
        <button type="button" onclick="const r=this.closest('[data-merch-box]');const q=r.querySelector('[data-qty]');const n=Math.max(1,Number(q.textContent)-1);q.textContent=n;r.querySelector('[data-sub]').textContent='$'+(n*118);" class="cursor-pointer px-3 py-1.5 text-sm font-bold text-stone-700 dark:text-stone-300">−</button>
        <span data-qty class="px-3 text-xs font-bold text-stone-900 dark:text-stone-100">2</span>
        <button type="button" onclick="const r=this.closest('[data-merch-box]');const q=r.querySelector('[data-qty]');const n=Number(q.textContent)+1;q.textContent=n;r.querySelector('[data-sub]').textContent='$'+(n*118);" class="cursor-pointer px-3 py-1.5 text-sm font-bold text-stone-700 dark:text-stone-300">+</button>
      </div>
    </div>
  </div>
  <div class="mt-4 flex items-center justify-between border-t border-stone-100 dark:border-zinc-800/80 pt-3.5 text-xs">
    <span class="text-stone-500 dark:text-stone-400">Subtotal: <strong data-sub class="text-stone-950 dark:text-white">$236</strong></span>
    <span class="font-medium text-emerald-700 dark:text-emerald-300">Free Express Shipping</span>
  </div>
</div>
