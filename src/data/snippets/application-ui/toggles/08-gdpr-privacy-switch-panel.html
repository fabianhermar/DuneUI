<div class="w-full max-w-md overflow-hidden rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5 shadow-md text-black dark:text-zinc-100" data-gdpr-card>
  <div class="flex items-start justify-between gap-3">
    <div>
      <h4 class="text-sm font-bold text-slate-900 dark:text-zinc-100">Data & Cookie Governance</h4>
      <p class="mt-0.5 text-xs text-slate-500 dark:text-zinc-400">Manage consent scopes stored on this browser.</p>
    </div>
    <span class="rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-0.5 text-[10px] font-semibold text-emerald-700 dark:text-emerald-300 ring-1 ring-emerald-200">GDPR Ready</span>
  </div>
  <div class="mt-4 space-y-2.5 text-xs">
    <div class="flex items-center justify-between gap-3 rounded-xl bg-slate-50 dark:bg-zinc-800/60 px-3.5 py-2.5">
      <div><p class="font-semibold text-slate-900 dark:text-zinc-100">Strictly Necessary</p><p class="text-[11px] text-slate-500 dark:text-zinc-400">Auth session & CSRF protection</p></div>
      <span class="font-mono text-[10px] font-bold text-emerald-700 dark:text-emerald-300">LOCKED ON</span>
    </div>
    <div class="flex items-center justify-between gap-3 rounded-xl border border-slate-200 dark:border-zinc-800 px-3.5 py-2.5">
      <div><p class="font-semibold text-slate-900 dark:text-zinc-100">Product Telemetry</p><p class="text-[11px] text-slate-500 dark:text-zinc-400">Anonymized performance metrics</p></div>
      <button type="button" aria-pressed="true" onclick="const on=this.getAttribute('aria-pressed')==='true';this.setAttribute('aria-pressed',!on);this.classList.toggle('bg-slate-900',!on);this.classList.toggle('bg-slate-200',on);this.firstElementChild.classList.toggle('translate-x-4',!on);this.firstElementChild.classList.toggle('translate-x-0',on);" class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full bg-slate-900 dark:bg-white p-0.5 transition-colors"><span class="h-4 w-4 translate-x-4 rounded-full bg-white shadow-xs transition-transform border border-slate-200 dark:border-zinc-800"></span></button>
    </div>
    <div class="flex items-center justify-between gap-3 rounded-xl border border-slate-200 dark:border-zinc-800 px-3.5 py-2.5">
      <div><p class="font-semibold text-slate-900 dark:text-zinc-100">Session Replay</p><p class="text-[11px] text-slate-500 dark:text-zinc-400">Debug UX issues in real flows</p></div>
      <button type="button" aria-pressed="false" onclick="const on=this.getAttribute('aria-pressed')==='true';this.setAttribute('aria-pressed',!on);this.classList.toggle('bg-slate-900',!on);this.classList.toggle('bg-slate-200',on);this.firstElementChild.classList.toggle('translate-x-4',!on);this.firstElementChild.classList.toggle('translate-x-0',on);" class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full bg-slate-200 dark:bg-zinc-700 p-0.5 transition-colors text-black dark:text-zinc-100"><span class="h-4 w-4 translate-x-0 rounded-full bg-white shadow-xs transition-transform border border-slate-200 dark:border-zinc-800"></span></button>
    </div>
  </div>
  <div class="mt-4 flex gap-2">
    <button type="button" onclick="this.closest('[data-gdpr-card]').querySelectorAll('button[aria-pressed]').forEach(b=>{b.setAttribute('aria-pressed','false');b.classList.remove('bg-slate-900','dark:bg-white');b.classList.add('bg-slate-200','dark:bg-zinc-700');b.firstElementChild.classList.remove('translate-x-4');b.firstElementChild.classList.add('translate-x-0');});" class="flex-1 rounded-xl border border-slate-200 dark:border-zinc-700 py-2 text-xs font-semibold text-slate-700 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800">Reject Optional</button>
    <button type="button" onclick="this.textContent='Preferences Saved ✓'" class="flex-1 rounded-xl bg-slate-900 dark:bg-white py-2 text-xs font-semibold text-white dark:text-slate-950 hover:bg-slate-800 dark:hover:bg-zinc-200">Save Preferences</button>
  </div>
</div>
