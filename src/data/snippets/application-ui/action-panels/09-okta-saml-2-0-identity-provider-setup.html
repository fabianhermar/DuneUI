<div class="mx-auto w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h3 class="text-sm font-semibold text-slate-900 dark:text-zinc-100">SAML 2.0 Enterprise Single Sign-On</h3>
      <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400">Provision SCIM directory sync and just-in-time workspace login.</p>
    </div>
    <button type="button" data-ap9-test class="rounded-xl bg-indigo-600 px-3.5 py-2 text-xs font-semibold text-white hover:bg-indigo-500 transition-colors">Test IdP Handshake</button>
  </div>
  <div class="mt-4 flex flex-wrap gap-2 text-xs">
    <button type="button" data-ap9-idp="Okta" class="rounded-lg border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/50 dark:bg-indigo-500/10 px-3 py-1.5 font-semibold text-indigo-700 dark:text-indigo-300">Okta</button>
    <button type="button" data-ap9-idp="Google Workspace" class="rounded-lg border border-slate-200 dark:border-zinc-700 px-3 py-1.5 font-medium text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800">Google Workspace</button>
    <button type="button" data-ap9-idp="Microsoft Entra ID" class="rounded-lg border border-slate-200 dark:border-zinc-700 px-3 py-1.5 font-medium text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800">Microsoft Entra ID</button>
  </div>
  <div class="mt-4 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950/60 px-3.5 py-2.5 font-mono text-[11px]">
    <span class="truncate text-slate-600 dark:text-zinc-400">ACS: <strong class="text-slate-900 dark:text-zinc-200">https://auth.dune.dev/sso/saml/acme</strong></span>
    <span data-ap9-msg class="shrink-0 font-sans font-semibold text-slate-500 dark:text-zinc-400">Provider: Okta</span>
  </div>
</div>
<script>
(function(){
  const idps = [...document.querySelectorAll('[data-ap9-idp]')], test = document.querySelector('[data-ap9-test]'), msg = document.querySelector('[data-ap9-msg]');
  const onCls = 'rounded-lg border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/50 dark:bg-indigo-500/10 px-3 py-1.5 font-semibold text-indigo-700 dark:text-indigo-300';
  const offCls = 'rounded-lg border border-slate-200 dark:border-zinc-700 px-3 py-1.5 font-medium text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800';
  idps.forEach(b => b.addEventListener('click', () => {
    idps.forEach(x => { x.className = x === b ? onCls : offCls; });
    if (msg) msg.textContent = 'Provider: ' + (b.dataset.ap9Idp || 'Okta');
  }));
  test?.addEventListener('click', () => {
    test.textContent = 'Verified SAML ✓';
    if (msg) msg.textContent = 'Certificate valid · 48ms';
  });
})();
</script>
