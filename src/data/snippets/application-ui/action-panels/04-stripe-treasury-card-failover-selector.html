<div class="mx-auto w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h3 class="text-sm font-semibold text-slate-900 dark:text-zinc-100">Payment methods &amp; billing failover</h3>
      <p class="mt-0.5 text-xs text-slate-500 dark:text-zinc-400">Select the primary corporate card used for monthly invoices.</p>
    </div>
    <span class="rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-0.5 font-mono text-[10px] font-semibold text-emerald-700 dark:text-emerald-300">Auto-failover ON</span>
  </div>
  <div class="mt-4 space-y-2.5">
    <button type="button" data-ap4-card="visa" class="flex w-full flex-wrap items-center justify-between gap-4 rounded-xl border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/40 dark:bg-indigo-500/10 px-4 py-3 text-left transition-colors">
      <div class="flex items-center gap-3">
        <span class="rounded bg-slate-900 dark:bg-white px-2 py-1 font-mono text-[10px] font-bold text-white dark:text-slate-950">VISA</span>
        <div>
          <p class="text-xs font-semibold text-slate-900 dark:text-zinc-100">Visa Corporate &bull;&bull; 4242</p>
          <p class="text-[11px] text-slate-500 dark:text-zinc-400">Exp 08/2029 &middot; Last billed $49.00</p>
        </div>
      </div>
      <span data-ap4-tag class="rounded-full bg-indigo-600 px-2.5 py-0.5 text-[10px] font-semibold text-white">Primary</span>
    </button>
    <button type="button" data-ap4-card="amex" class="flex w-full flex-wrap items-center justify-between gap-4 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50/70 dark:bg-zinc-800/40 px-4 py-3 text-left hover:border-slate-300 dark:hover:border-zinc-700 transition-colors">
      <div class="flex items-center gap-3">
        <span class="rounded bg-sky-700 px-2 py-1 font-mono text-[10px] font-bold text-white">AMEX</span>
        <div>
          <p class="text-xs font-semibold text-slate-900 dark:text-zinc-100">Amex Platinum &bull;&bull; 8801</p>
          <p class="text-[11px] text-slate-500 dark:text-zinc-400">Exp 11/2028 &middot; Backup method</p>
        </div>
      </div>
      <span data-ap4-tag class="rounded-full border border-slate-200 dark:border-zinc-700 px-2.5 py-0.5 text-[10px] font-medium text-slate-600 dark:text-zinc-300">Backup</span>
    </button>
  </div>
</div>
<script>
(function(){
  const cards = [...document.querySelectorAll('[data-ap4-card]')];
  const onCls = 'flex w-full flex-wrap items-center justify-between gap-4 rounded-xl border-2 border-indigo-600 dark:border-indigo-400 bg-indigo-50/40 dark:bg-indigo-500/10 px-4 py-3 text-left transition-colors';
  const offCls = 'flex w-full flex-wrap items-center justify-between gap-4 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50/70 dark:bg-zinc-800/40 px-4 py-3 text-left hover:border-slate-300 dark:hover:border-zinc-700 transition-colors';
  cards.forEach(c => c.addEventListener('click', () => {
    cards.forEach(x => {
      const on = x === c;
      x.className = on ? onCls : offCls;
      const tag = x.querySelector('[data-ap4-tag]');
      if (tag) {
        tag.textContent = on ? 'Primary' : 'Backup';
        tag.className = on
          ? 'rounded-full bg-indigo-600 px-2.5 py-0.5 text-[10px] font-semibold text-white'
          : 'rounded-full border border-slate-200 dark:border-zinc-700 px-2.5 py-0.5 text-[10px] font-medium text-slate-600 dark:text-zinc-300';
      }
    });
  }));
})();
</script>
