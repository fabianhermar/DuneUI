<div class="mx-auto w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h3 class="text-sm font-semibold text-slate-900 dark:text-zinc-100">Hardware Passkeys &amp; 2FA Enforcement</h3>
      <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400">11 of 14 workspace members have FIDO2 passkeys enrolled.</p>
    </div>
    <span data-ap8-status class="rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-1 text-[11px] font-semibold text-emerald-700 dark:text-emerald-300">79% Enrolled</span>
  </div>
  <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-zinc-800">
    <div class="h-full w-[79%] rounded-full bg-emerald-500"></div>
  </div>
  <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 dark:border-zinc-800 pt-4">
    <div class="flex flex-wrap gap-1.5 text-[11px]" role="group" aria-label="2FA policy">
      <button type="button" data-ap8-mode="Optional" class="rounded-lg border border-slate-200 dark:border-zinc-700 px-2.5 py-1 font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-50 dark:hover:bg-zinc-800">Optional</button>
      <button type="button" data-ap8-mode="Admins Only" class="rounded-lg border border-slate-200 dark:border-zinc-700 px-2.5 py-1 font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-50 dark:hover:bg-zinc-800">Admins Only</button>
      <button type="button" data-ap8-mode="Required for All" class="rounded-lg bg-slate-900 dark:bg-white px-2.5 py-1 font-semibold text-white dark:text-slate-950">Required for All</button>
    </div>
    <button type="button" data-ap8-save class="rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white hover:bg-emerald-500 transition-colors">Save Policy</button>
  </div>
</div>
<script>
(function(){
  let selected = 'Required for All';
  const modes = [...document.querySelectorAll('[data-ap8-mode]')], save = document.querySelector('[data-ap8-save]'), st = document.querySelector('[data-ap8-status]');
  const onCls = 'rounded-lg bg-slate-900 dark:bg-white px-2.5 py-1 font-semibold text-white dark:text-slate-950';
  const offCls = 'rounded-lg border border-slate-200 dark:border-zinc-700 px-2.5 py-1 font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-50 dark:hover:bg-zinc-800';
  modes.forEach(m => m.addEventListener('click', () => {
    selected = m.dataset.ap8Mode || selected;
    modes.forEach(x => { x.className = x === m ? onCls : offCls; });
  }));
  save?.addEventListener('click', () => {
    save.textContent = 'Policy Saved ✓';
    if (st) st.textContent = 'Active: ' + selected;
    setTimeout(() => { save.textContent = 'Save Policy'; }, 1200);
  });
})();
</script>
