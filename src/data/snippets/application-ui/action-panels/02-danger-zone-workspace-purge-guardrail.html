<div class="mx-auto w-full max-w-2xl rounded-2xl border border-rose-200 dark:border-rose-500/30 bg-rose-50/50 dark:bg-rose-950/25 p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="flex items-start gap-3">
      <div class="mt-0.5 flex size-9 shrink-0 items-center justify-center rounded-xl bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 ring-1 ring-rose-200 dark:ring-rose-500/30">
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-rose-950 dark:text-rose-200">Delete workspace permanently</h3>
        <p class="mt-1 text-xs leading-relaxed text-rose-900/75 dark:text-rose-300/80">Irreversibly purges <strong class="font-semibold">14 projects</strong>, <strong class="font-semibold">3 API keys</strong>, and <strong class="font-semibold">2.4 GB</strong> of storage. Type <code class="rounded bg-rose-100 dark:bg-rose-500/20 px-1.5 py-0.5 font-mono text-[11px] font-bold text-rose-900 dark:text-rose-200">DELETE</code> below to arm.</p>
      </div>
    </div>
  </div>
  <div class="mt-4 flex flex-col gap-2.5 sm:flex-row sm:items-center border-t border-rose-200/70 dark:border-rose-500/20 pt-4">
    <input type="text" data-ap2-inp placeholder="Type DELETE to confirm" class="w-full sm:max-w-xs rounded-xl border border-rose-300 dark:border-rose-500/40 bg-white dark:bg-zinc-900 px-3.5 py-2 font-mono text-xs text-rose-950 dark:text-rose-100 placeholder:text-rose-400/70 focus:border-rose-500 focus:outline-none" />
    <button type="button" data-ap2-btn disabled class="rounded-xl bg-rose-600 px-4 py-2 text-xs font-semibold text-white opacity-40 transition-all hover:bg-rose-500 disabled:cursor-not-allowed">Delete Workspace</button>
    <span data-ap2-armed class="hidden font-mono text-[11px] font-semibold text-rose-700 dark:text-rose-300">Guardrail unlocked</span>
  </div>
</div>
<script>
(function(){
  const inp = document.querySelector('[data-ap2-inp]'), btn = document.querySelector('[data-ap2-btn]'), armed = document.querySelector('[data-ap2-armed]');
  inp?.addEventListener('input', () => {
    const ok = inp.value.trim() === 'DELETE';
    if (btn) {
      btn.disabled = !ok;
      btn.classList.toggle('opacity-40', !ok);
    }
    armed?.classList.toggle('hidden', !ok);
  });
  btn?.addEventListener('click', () => {
    btn.textContent = 'Scheduled for Purge';
    btn.disabled = true;
    btn.classList.add('opacity-70');
  });
})();
</script>
