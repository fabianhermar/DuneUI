<div class="mx-auto w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <div class="flex items-center gap-2">
        <h3 class="text-sm font-semibold text-slate-900 dark:text-white">Production Secret Key</h3>
        <span class="rounded bg-emerald-500/15 px-1.5 py-0.5 font-mono text-[10px] font-semibold text-emerald-700 dark:text-emerald-400">ACTIVE</span>
      </div>
      <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400">Scopes: <span class="font-mono text-slate-700 dark:text-zinc-300">read:events, write:webhooks</span> &middot; Last used 4m ago</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" data-ap3-eye class="rounded-lg border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">Hide</button>
      <button type="button" data-ap3-copy class="rounded-lg border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-3 py-1.5 text-xs font-medium text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">Copy</button>
      <button type="button" data-ap3-rot class="rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-indigo-500 transition-colors">Rotate Key</button>
    </div>
  </div>
  <div class="mt-4 flex items-center justify-between gap-3 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-4 py-2.5 font-mono text-xs">
    <span class="truncate text-emerald-700 dark:text-emerald-400" data-ap3-key>sk_live_dune_94a2f801c7b9</span>
    <span data-ap3-msg class="shrink-0 text-[10px] text-slate-400 dark:text-zinc-500">Grace period: 24h</span>
  </div>
</div>
<script>
(function(){
  let secret = 'sk_live_dune_94a2f801c7b9', revealed = true;
  const k = document.querySelector('[data-ap3-key]'), eye = document.querySelector('[data-ap3-eye]'), c = document.querySelector('[data-ap3-copy]'), r = document.querySelector('[data-ap3-rot]'), msg = document.querySelector('[data-ap3-msg]');
  eye?.addEventListener('click', () => {
    revealed = !revealed;
    eye.textContent = revealed ? 'Hide' : 'Reveal';
    if (k) k.textContent = revealed ? secret : 'sk_live_dune_••••••••••••';
  });
  c?.addEventListener('click', () => {
    c.textContent = 'Copied!';
    setTimeout(() => { c.textContent = 'Copy'; }, 900);
  });
  r?.addEventListener('click', () => {
    secret = 'sk_live_dune_' + Math.random().toString(16).slice(2, 14);
    revealed = true;
    if (eye) eye.textContent = 'Hide';
    if (k) k.textContent = secret;
    if (msg) msg.textContent = 'Rotated just now · Old expires in 24h';
  });
})();
</script>
