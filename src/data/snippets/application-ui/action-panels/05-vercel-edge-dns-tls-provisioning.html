<div class="mx-auto w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <div class="flex flex-wrap items-center gap-2.5">
        <h3 class="font-mono text-sm font-semibold text-slate-900 dark:text-zinc-100">ui.northstar.dev</h3>
        <span data-ap5-badge class="rounded-full bg-amber-50 dark:bg-amber-500/15 px-2.5 py-0.5 text-[11px] font-semibold text-amber-700 dark:text-amber-300 ring-1 ring-amber-200 dark:ring-amber-500/30">Pending DNS</span>
      </div>
      <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400">Add this CNAME record at your registrar to provision Let&apos;s Encrypt TLS 1.3.</p>
    </div>
    <button type="button" data-ap5-verify class="rounded-xl bg-slate-900 dark:bg-white px-4 py-2 text-xs font-semibold text-white dark:text-slate-950 hover:bg-slate-800 dark:hover:bg-zinc-200 transition-colors">Verify DNS</button>
  </div>
  <div class="mt-4 grid grid-cols-12 items-center gap-2 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950/60 px-3.5 py-2.5 font-mono text-[11px]">
    <div class="col-span-3 text-slate-500 dark:text-zinc-400">CNAME</div>
    <div class="col-span-3 font-semibold text-slate-900 dark:text-zinc-100">ui</div>
    <div class="col-span-6 flex items-center justify-between gap-2 truncate text-indigo-600 dark:text-indigo-400">
      <span class="truncate">cname.dune-edge.net</span>
      <button type="button" data-ap5-copy class="shrink-0 rounded border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-1.5 py-0.5 font-sans text-[10px] font-semibold text-slate-600 dark:text-zinc-300">Copy</button>
    </div>
  </div>
</div>
<script>
(function(){
  const b = document.querySelector('[data-ap5-verify]'), badge = document.querySelector('[data-ap5-badge]'), copy = document.querySelector('[data-ap5-copy]');
  copy?.addEventListener('click', () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 800); });
  b?.addEventListener('click', () => {
    b.textContent = 'Checking...';
    setTimeout(() => {
      b.textContent = 'Verified ✓';
      if (badge) {
        badge.textContent = 'TLS 1.3 Active';
        badge.className = 'rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-700 dark:text-emerald-300 ring-1 ring-emerald-200 dark:ring-emerald-500/30';
      }
    }, 350);
  });
})();
</script>
