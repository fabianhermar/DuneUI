<section data-ldr1 class="mx-auto w-full max-w-xl rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-6 sm:p-8 text-slate-900 dark:text-zinc-100 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 dark:border-zinc-800 pb-4">
    <div>
      <span class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">Edge Compiler &middot; Telemetry</span>
      <h2 class="mt-0.5 text-lg font-bold text-slate-900 dark:text-white">Orbital Ring &amp; Bundle Progress</h2>
    </div>
    <button type="button" data-ldr1-btn class="rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-3.5 py-1.5 text-xs font-semibold text-slate-700 dark:text-zinc-300 hover:border-indigo-500 transition">
      Simulate Rebuild
    </button>
  </div>
  <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-12 sm:items-center">
    <div class="flex flex-col items-center justify-center sm:col-span-5">
      <div class="relative flex size-36 items-center justify-center">
        <svg class="size-36 animate-spin text-indigo-600 dark:text-indigo-400" viewBox="0 0 120 120" fill="none">
          <circle cx="60" cy="60" r="50" stroke="currentColor" stroke-opacity="0.15" stroke-width="8" />
          <circle cx="60" cy="60" r="50" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-dasharray="210 314" />
        </svg>
        <svg class="absolute size-24 animate-spin text-sky-500 dark:text-sky-400" style="animation-direction: reverse; animation-duration: 2.4s;" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="38" stroke="currentColor" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="8 8" />
          <circle cx="50" cy="50" r="38" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 240" />
        </svg>
        <div class="absolute flex flex-col items-center">
          <span data-ldr1-pct class="font-mono text-2xl font-bold text-slate-900 dark:text-white">78%</span>
          <span class="font-mono text-[10px] uppercase tracking-wider text-slate-400">60fps</span>
        </div>
      </div>
    </div>
    <div class="space-y-3 text-xs sm:col-span-7">
      <div class="flex items-center justify-between rounded-xl bg-indigo-50/70 dark:bg-indigo-500/10 px-3.5 py-2.5">
        <span data-ldr1-stage class="font-semibold text-indigo-950 dark:text-indigo-200">Tree-shaking unused AST chunks...</span>
        <span class="size-2 rounded-full bg-indigo-600 dark:bg-indigo-400 animate-ping"></span>
      </div>
      <div class="space-y-2 font-mono text-[11px]">
        <div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-zinc-800 px-3 py-2">
          <span class="flex items-center gap-2 text-emerald-700 dark:text-emerald-400"><span>&#10003;</span> 01. Parse TypeScript AST</span>
          <span class="text-slate-400">112ms</span>
        </div>
        <div class="flex items-center justify-between rounded-xl border border-indigo-200 dark:border-indigo-500/40 bg-slate-50 dark:bg-zinc-900 px-3 py-2">
          <span class="flex items-center gap-2 font-bold text-slate-900 dark:text-white"><span class="size-2 rounded-full bg-indigo-500 animate-pulse"></span> 02. Optimize CSS Tokens</span>
          <span data-ldr1-ms class="text-indigo-600 dark:text-indigo-400">Running</span>
        </div>
        <div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-zinc-800 px-3 py-2 text-slate-400">
          <span>&bull; 03. Emit Edge Worker Manifest</span>
          <span>Queued</span>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  const r = document.querySelector('[data-ldr1]'); if (!r) return;
  const pct = r.querySelector('[data-ldr1-pct]'), stg = r.querySelector('[data-ldr1-stage]'), ms = r.querySelector('[data-ldr1-ms]'), btn = r.querySelector('[data-ldr1-btn]');
  const steps = ['Parsing TypeScript AST...', 'Resolving Tailwind v4 tokens...', 'Tree-shaking unused AST chunks...', 'Bundle Emitted (0 Errors) ✓'];
  btn?.addEventListener('click', () => {
    let val = 12;
    btn.textContent = 'Building...';
    const iv = setInterval(() => {
      val = Math.min(100, val + 22);
      pct.textContent = val + '%';
      stg.textContent = val < 40 ? steps[0] : val < 75 ? steps[1] : val < 100 ? steps[2] : steps[3];
      ms.textContent = val === 100 ? '240ms ✓' : val + '%';
      if (val >= 100) { clearInterval(iv); btn.textContent = 'Simulate Rebuild'; }
    }, 280);
  });
})();
</script>
