<section data-ldr2 class="mx-auto w-full max-w-xl rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-6 sm:p-7 text-slate-900 dark:text-zinc-100 shadow-xl space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="relative flex size-11 items-center justify-center rounded-2xl bg-violet-600/15 ring-1 ring-violet-500/40">
        <span class="absolute size-7 rounded-full border-2 border-violet-500 border-t-transparent animate-spin"></span>
        <span class="size-2.5 rounded-full bg-violet-500 animate-pulse"></span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-mono text-[10px] font-bold uppercase tracking-widest text-violet-600 dark:text-violet-400">Neural Reasoning Engine</span>
          <span data-ldr2-badge class="rounded-full bg-violet-500/15 px-2 py-0.5 font-mono text-[10px] font-semibold text-violet-700 dark:text-violet-300">THINKING &middot; 2.4s</span>
        </div>
        <h3 data-ldr2-title class="mt-0.5 text-base font-bold text-slate-900 dark:text-white">Synthesizing multi-document context...</h3>
      </div>
    </div>
    <button type="button" data-ldr2-next class="rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-3 py-1.5 font-mono text-[11px] font-semibold hover:border-violet-500 transition">
      Next Trace &rarr;
    </button>
  </div>
  <div class="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-50/80 dark:bg-zinc-900/80 p-4 space-y-3 text-xs">
    <div class="flex items-center justify-between border-b border-slate-200/80 dark:border-zinc-800 pb-2.5 font-mono text-[11px]">
      <span class="text-slate-500 dark:text-zinc-400">CHAIN-OF-THOUGHT STREAM</span>
      <span class="text-emerald-600 dark:text-emerald-400 font-bold">148 tok/s</span>
    </div>
    <div class="space-y-2 font-mono text-[11px]">
      <div class="flex items-center gap-2.5 text-slate-500 dark:text-zinc-400">
        <span class="text-emerald-500">&#10003;</span>
        <span>Retrieved 142 semantic vector embeddings (cosine &ge; 0.89)</span>
      </div>
      <div class="flex items-center gap-2.5 text-slate-900 dark:text-white font-semibold">
        <span class="inline-block size-2 rounded-full bg-violet-500 animate-ping"></span>
        <span data-ldr2-line>Cross-checking TypeScript AST definitions &amp; design tokens...</span>
      </div>
    </div>
    <div class="flex items-end justify-between gap-1 pt-2">
      <div class="flex items-end gap-1 h-6">
        <span class="w-1.5 h-3 rounded-full bg-violet-500 animate-pulse"></span>
        <span class="w-1.5 h-6 rounded-full bg-violet-500 animate-bounce"></span>
        <span class="w-1.5 h-4 rounded-full bg-violet-400 animate-pulse"></span>
        <span class="w-1.5 h-5 rounded-full bg-indigo-500 animate-bounce"></span>
        <span class="w-1.5 h-2.5 rounded-full bg-violet-400 animate-pulse"></span>
        <span class="w-1.5 h-6 rounded-full bg-violet-600 animate-pulse"></span>
        <span class="w-1.5 h-3.5 rounded-full bg-sky-400 animate-bounce"></span>
      </div>
      <span class="font-mono text-[10px] text-slate-400">Context Window: 34.2k / 128k</span>
    </div>
  </div>
</section>
<script>
(function(){
  const r = document.querySelector('[data-ldr2]'); if (!r) return;
  const ttl = r.querySelector('[data-ldr2-title]'), ln = r.querySelector('[data-ldr2-line]'), bdg = r.querySelector('[data-ldr2-badge]');
  const traces = [
    ['Synthesizing multi-document context...', 'Cross-checking TypeScript AST definitions & design tokens...', 'THINKING · 2.4s'],
    ['Validating WCAG AA contrast ratios...', 'Simulating Light & Dark surface luminance matrix...', 'VERIFYING · 3.1s'],
    ['Streaming production component code...', 'Emitting zero-dependency HTML & Tailwind v4 utilities...', 'STREAMING · 3.8s']
  ];
  let idx = 0;
  r.querySelector('[data-ldr2-next]')?.addEventListener('click', () => {
    idx = (idx + 1) % traces.length;
    ttl.textContent = traces[idx][0]; ln.textContent = traces[idx][1]; bdg.textContent = traces[idx][2];
  });
})();
</script>
