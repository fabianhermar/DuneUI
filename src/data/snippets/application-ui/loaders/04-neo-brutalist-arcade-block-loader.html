<section data-ldr4 class="mx-auto w-full max-w-xl border-2 border-black dark:border-zinc-200 bg-[#FFFDF7] dark:bg-zinc-900 p-6 shadow-[6px_6px_0_0_#000] dark:shadow-[6px_6px_0_0_#e4e4e7] font-mono text-xs text-slate-900 dark:text-zinc-100 space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b-2 border-black dark:border-zinc-200 pb-3.5">
    <div class="flex items-center gap-2.5">
      <span class="inline-flex size-7 items-center justify-center border-2 border-black bg-[#FFE95A] font-black text-black animate-spin">*</span>
      <div>
        <span class="block text-[10px] font-black uppercase text-neutral-500 dark:text-neutral-400">MEMORY BUFFER // CARTRIDGE 04</span>
        <h3 class="text-sm font-black uppercase">COMPILING SHADER ARCHIVE...</h3>
      </div>
    </div>
    <button type="button" data-ldr4-boost class="border-2 border-black dark:border-zinc-200 bg-[#A7F3D0] px-3 py-1.5 font-black text-black shadow-[3px_3px_0_#000] active:translate-x-[1px] active:translate-y-[1px]">
      TURBO +20%
    </button>
  </div>
  <div class="border-2 border-black dark:border-zinc-200 bg-white dark:bg-zinc-950 p-3">
    <div data-ldr4-grid class="grid grid-cols-10 gap-1.5">
      <span class="h-7 border-2 border-black bg-lime-300"></span>
      <span class="h-7 border-2 border-black bg-lime-300"></span>
      <span class="h-7 border-2 border-black bg-lime-300"></span>
      <span class="h-7 border-2 border-black bg-lime-300"></span>
      <span class="h-7 border-2 border-black bg-[#FFE95A]"></span>
      <span class="h-7 border-2 border-black bg-[#FFE95A]"></span>
      <span class="h-7 border-2 border-black bg-[#FFE95A] animate-pulse"></span>
      <span class="h-7 border-2 border-black/30 dark:border-zinc-700 bg-neutral-100 dark:bg-zinc-900"></span>
      <span class="h-7 border-2 border-black/30 dark:border-zinc-700 bg-neutral-100 dark:bg-zinc-900"></span>
      <span class="h-7 border-2 border-black/30 dark:border-zinc-700 bg-neutral-100 dark:bg-zinc-900"></span>
    </div>
  </div>
  <div class="flex flex-wrap items-center justify-between gap-2 font-black">
    <span data-ldr4-txt class="border-2 border-black bg-[#FFE95A] px-2.5 py-1 text-black">STATUS: 70% LOADED (50.4 / 72.0 MB)</span>
    <span class="text-[11px]">CRC32: 0x94A8F2</span>
  </div>
</section>
<script>
(function(){
  const r = document.querySelector('[data-ldr4]'); if (!r) return;
  const cells = [...r.querySelectorAll('[data-ldr4-grid] span')], txt = r.querySelector('[data-ldr4-txt]');
  let count = 7;
  r.querySelector('[data-ldr4-boost]')?.addEventListener('click', () => {
    count = count >= 10 ? 2 : Math.min(10, count + 2);
    cells.forEach((c, i) => {
      c.className = i < count ? 'h-7 border-2 border-black bg-lime-300' : 'h-7 border-2 border-black/30 dark:border-zinc-700 bg-neutral-100 dark:bg-zinc-900';
    });
    const p = count * 10;
    txt.textContent = p === 100 ? 'STATUS: 100% READY TO LAUNCH ✓' : 'STATUS: ' + p + '% LOADED (' + (p * 0.72).toFixed(1) + ' / 72.0 MB)';
  });
})();
</script>
