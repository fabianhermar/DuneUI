    <div><span class="block text-[10px] text-slate-400">EU-CENTRAL (FRA1)</span><strong class="text-emerald-600 dark:text-emerald-400">&#10003; Ready (24ms)</strong></div>

  </div>
</section>
<script>
(function(){
  const r = document.querySelector('[data-ldr3]'); if (!r) return;
  const bars = [...r.querySelectorAll('[data-ldr3-bars] span')], pct = r.querySelector('[data-ldr3-pct]'), msg = r.querySelector('[data-ldr3-msg]'), st = r.querySelector('[data-ldr3-step]');
  let filled = 9;
  r.querySelector('[data-ldr3-adv]')?.addEventListener('click', () => {
    filled = filled >= 12 ? 3 : filled + 3;
    bars.forEach((b, i) => {
      b.className = i < filled - 1 ? 'h-3 rounded-xs bg-emerald-500' : i === filled - 1 && filled < 12 ? 'h-3 rounded-xs bg-emerald-400 animate-pulse' : i < filled ? 'h-3 rounded-xs bg-emerald-500' : 'h-3 rounded-xs bg-slate-200 dark:bg-zinc-800';
    });
    const p = Math.round((filled / 12) * 100);
    pct.textContent = p + '%';
    st.textContent = 'STAGE ' + Math.ceil(filled / 3) + ' / 4';
    msg.textContent = p === 100 ? 'All 38 global edge nodes live & verified ✓' : 'Propagating edge worker bundles to 38 PoPs...';
  });
})();
</script>
