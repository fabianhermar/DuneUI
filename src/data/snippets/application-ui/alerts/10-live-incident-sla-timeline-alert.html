<div role="alert" data-incident-alert class="mx-auto w-full max-w-xl rounded-2xl border border-rose-200 dark:border-rose-500/40 bg-rose-50 dark:bg-rose-950/35 p-5 text-rose-950 dark:text-rose-100 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <span class="inline-flex items-center gap-2 font-mono text-xs font-bold uppercase text-rose-800 dark:text-rose-300">
      <span class="relative flex size-2.5"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-rose-400 opacity-75"></span><span class="relative inline-flex size-2.5 rounded-full bg-rose-500"></span></span>
      SEV-2 &middot; Elevated API Latency (EU-West)
    </span>
    <span class="rounded-md bg-rose-100 dark:bg-rose-500/20 px-2 py-0.5 font-mono text-[10px] font-bold text-rose-800 dark:text-rose-200">14:08 UTC</span>
  </div>
  <p class="mt-2 text-xs leading-relaxed text-rose-900 dark:text-rose-100/85">Traffic failover deployed to secondary Frankfurt edge pool; p99 response times are recovering toward 42ms baseline.</p>
  <div class="mt-3.5 flex flex-wrap items-center justify-between gap-2 border-t border-rose-200/80 dark:border-rose-500/25 pt-3 text-[11px]">
    <span class="font-mono text-rose-800 dark:text-rose-200/80">Next update in 10m</span>
    <button type="button" data-sub-btn class="rounded-lg border border-rose-300 dark:border-rose-400/40 bg-white dark:bg-rose-950/60 px-3 py-1 font-semibold text-rose-900 dark:text-rose-100 transition hover:bg-rose-100 dark:hover:bg-rose-900/60">Subscribe to Updates</button>
  </div>
  <script>
    (() => {
      const btn = document.currentScript.closest('[data-incident-alert]').querySelector('[data-sub-btn]');
      btn?.addEventListener('click', () => {
        btn.textContent = 'Subscribed to SEV-2 ✓';
        btn.disabled = true;
      });
    })();
  </script>
</div>
