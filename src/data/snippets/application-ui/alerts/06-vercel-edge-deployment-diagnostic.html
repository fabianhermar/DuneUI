      </span>
      <span class="text-xs sm:text-sm font-medium">Deployed to <code class="font-mono font-semibold text-emerald-700 dark:text-emerald-300">dne-94a.edge.app</code></span>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" data-copy-url="https://dne-94a.edge.app" class="rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 px-2.5 py-1 font-mono text-[11px] font-semibold text-slate-700 dark:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-700">Copy URL</button>

    <span>Commit <strong class="text-slate-700 dark:text-zinc-200">a84f92c</strong> &middot; main</span>
    <span>Region iad1 &middot; Build 1.4s</span>
  </div>
  <script>
    (() => {
      const btn = document.currentScript.closest('[data-deploy-alert]').querySelector('[data-copy-url]');
      btn?.addEventListener('click', () => {
        navigator.clipboard?.writeText(btn.dataset.copyUrl).catch(() => {});
        btn.textContent = 'Copied ✓';
        setTimeout(() => { btn.textContent = 'Copy URL'; }, 1500);
      });
    })();
  </script>
