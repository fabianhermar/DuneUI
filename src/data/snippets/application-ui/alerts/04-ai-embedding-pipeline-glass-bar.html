<div role="alert" data-glass-alert class="mx-auto w-full max-w-xl rounded-2xl border border-slate-900/15 dark:border-white/25 bg-white/80 dark:bg-white/12 p-4 text-slate-900 dark:text-white shadow-lg dark:shadow-2xl backdrop-blur-2xl">
  <div class="flex flex-col items-start justify-between gap-3 sm:flex-row sm:items-center">
    <div class="flex items-center gap-3 min-w-0">
      <span class="relative flex size-3 shrink-0 items-center justify-center">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex size-2.5 rounded-full bg-cyan-500 dark:bg-cyan-300"></span>
      </span>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <p class="text-sm font-semibold truncate">Neural vector index synced</p>
          <span class="rounded-full bg-cyan-500/15 px-2 py-0.5 font-mono text-[10px] font-bold text-cyan-700 dark:text-cyan-200">99.4%</span>
        </div>
        <p class="text-xs text-slate-600 dark:text-white/75">1,420 chunks embedded across 3 namespaces in 0.8s</p>
      </div>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <button type="button" data-glass-inspect class="rounded-xl bg-slate-900 dark:bg-white px-3.5 py-1.5 text-xs font-semibold text-white dark:text-slate-950 shadow-sm transition hover:bg-slate-800 dark:hover:bg-sky-100">Inspect</button>
    </div>
  </div>
  <div data-glass-metrics class="mt-3 hidden grid-cols-3 gap-2 border-t border-slate-900/10 dark:border-white/15 pt-3 text-center font-mono text-[11px]">
    <div class="rounded-lg bg-slate-900/[0.05] dark:bg-black/25 py-1.5"><p class="font-bold">1,420</p><p class="text-[10px] text-slate-500 dark:text-white/65">Vectors</p></div>
    <div class="rounded-lg bg-slate-900/[0.05] dark:bg-black/25 py-1.5"><p class="font-bold">384d</p><p class="text-[10px] text-slate-500 dark:text-white/65">Dimensions</p></div>
    <div class="rounded-lg bg-slate-900/[0.05] dark:bg-black/25 py-1.5"><p class="font-bold text-emerald-700 dark:text-emerald-300">0 err</p><p class="text-[10px] text-slate-500 dark:text-white/65">Dropped</p></div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-glass-alert]');
      const btn = root.querySelector('[data-glass-inspect]');
      const panel = root.querySelector('[data-glass-metrics]');
      btn?.addEventListener('click', () => {
        const isHidden = panel.classList.toggle('hidden');
        panel.classList.toggle('grid', !isHidden);
        btn.textContent = isHidden ? 'Inspect' : 'Close';
      });
    })();
  </script>
</div>
