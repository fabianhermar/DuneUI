<div role="alert" data-validation-alert class="mx-auto w-full max-w-xl rounded-2xl border border-rose-200 dark:border-rose-500/35 border-s-4 border-s-rose-600 dark:border-s-rose-500 bg-rose-50/75 dark:bg-rose-950/35 p-4 sm:p-5 text-slate-900 dark:text-zinc-100">
  <div class="flex items-start gap-3">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="mt-0.5 size-5 shrink-0 text-rose-600 dark:text-rose-400">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
    </svg>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <strong class="text-sm font-semibold text-rose-950 dark:text-rose-100">Webhook delivery blocked by 2 errors</strong>
        <button type="button" data-copy-err="ERR_TLS_PIN_MISMATCH" class="rounded-md border border-rose-300 dark:border-rose-500/40 bg-white dark:bg-rose-950/60 px-2 py-0.5 font-mono text-[10px] font-semibold text-rose-800 dark:text-rose-200 hover:bg-rose-100 dark:hover:bg-rose-900/60">ERR_TLS_PIN_MISMATCH</button>
      </div>

      <ul class="mt-2.5 list-disc space-y-1 pl-4 text-xs text-rose-900 dark:text-rose-200/90">
        <li>Destination endpoint <code class="font-mono font-semibold">hooks.acme.dev</code> failed TLS certificate pinning.</li>
        <li>Signing secret expired 14 hours ago; automatic retries are paused.</li>
      </ul>

      <div class="mt-3.5 flex flex-wrap items-center gap-3 text-xs font-semibold">
        <a href="#_" class="rounded-lg bg-rose-700 dark:bg-rose-500 px-3 py-1.5 text-white shadow-2xs transition hover:bg-rose-800 dark:hover:bg-rose-400 dark:text-slate-950">Rotate Signing Secret &rarr;</a>
        <a href="#_" class="text-rose-800 dark:text-rose-300 hover:underline">View Delivery Logs</a>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const btn = document.currentScript.closest('[data-validation-alert]').querySelector('[data-copy-err]');
      btn?.addEventListener('click', () => {
        const code = btn.getAttribute('data-copy-err');
        navigator.clipboard?.writeText(code).catch(() => {});
        btn.textContent = 'Copied ' + code;
        setTimeout(() => { btn.textContent = code; }, 1600);
      });
    })();
  </script>
</div>
