<div data-shell-ide class="flex w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 font-mono text-xs text-slate-700 dark:text-zinc-300 md:min-h-[440px] md:flex-row">
  <div class="flex md:hidden items-center justify-between gap-2 border-b border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950 px-3 py-2">
    <div class="flex items-center gap-2 min-w-0">
      <button type="button" data-mobile-toggle aria-expanded="false" aria-label="Toggle file explorer" class="inline-flex size-8 shrink-0 items-center justify-center rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-slate-900 dark:text-white">
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span data-mobile-file class="truncate text-[11px] font-bold text-slate-900 dark:text-white">EXPLORER · Sidebar.tsx</span>
    </div>
    <span class="rounded bg-sky-500/15 px-1.5 py-0.5 text-[10px] text-sky-700 dark:text-sky-300">TSX</span>
  </div>

  <aside data-sidebar-drawer class="hidden md:flex w-full shrink-0 border-b border-slate-200 dark:border-zinc-800 md:w-72 md:border-b-0 md:border-r">
    <div class="flex flex-col items-center gap-2 border-r border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950/60 px-2 py-3 text-slate-500 dark:text-zinc-400">
      <button type="button" data-activity-btn data-panel-name="EXPLORER · DUNEUI" aria-label="Files" class="rounded-lg bg-slate-200/80 dark:bg-zinc-800 p-2 text-slate-900 dark:text-white border border-slate-300 dark:border-white/15">▤</button>
      <button type="button" data-activity-btn data-panel-name="SEARCH · WORKSPACE" aria-label="Search" class="rounded-lg p-2 hover:text-slate-900 dark:hover:text-zinc-100">⌕</button>
      <button type="button" data-activity-btn data-panel-name="SOURCE CONTROL · GIT" aria-label="Source Control" class="rounded-lg p-2 hover:text-slate-900 dark:hover:text-zinc-100">⎇</button>
      <button type="button" data-activity-btn data-panel-name="SETTINGS · DUNE" aria-label="Settings" class="mt-auto rounded-lg p-2 hover:text-slate-900 dark:hover:text-zinc-100">⚙</button>
    </div>
    <div class="flex-1 p-3">
      <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
        <span data-panel-title>EXPLORER · DUNEUI</span>
        <span>⋯</span>
      </div>
      <ul class="mt-3 space-y-1">
        <li class="text-slate-700 dark:text-zinc-300 font-semibold">▾ src/</li>
        <li class="pl-3 text-slate-600 dark:text-zinc-400">▾ components/</li>
        <li><button type="button" data-file-btn data-file="Sidebar.tsx" data-code="export function AppSidebar() {&#10;  return &lt;aside className=&quot;hidden md:flex md:w-64 border-r&quot;&gt;...&lt;/aside&gt;;&#10;}" class="flex w-full items-center justify-between rounded bg-sky-50 dark:bg-sky-500/15 py-1 pl-6 pr-2 text-left text-sky-700 dark:text-sky-300"><span>Sidebar.tsx</span><span class="text-[10px] text-amber-700 dark:text-amber-400">M</span></button></li>
        <li><button type="button" data-file-btn data-file="Navbar.tsx" data-code="export function TopNavbar() {&#10;  return &lt;header className=&quot;flex items-center justify-between px-4&quot;&gt;...&lt;/header&gt;;&#10;}" class="flex w-full items-center justify-between rounded py-1 pl-6 pr-2 text-left text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70"><span>Navbar.tsx</span></button></li>
        <li><button type="button" data-file-btn data-file="tokens.css" data-code=":root {&#10;  --dune-surface: #ffffff;&#10;  --dune-accent: #4f46e5;&#10;}" class="flex w-full items-center justify-between rounded py-1 pl-6 pr-2 text-left text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70"><span>tokens.css</span><span class="text-[10px] text-emerald-700 dark:text-emerald-400">U</span></button></li>
        <li><button type="button" data-file-btn data-file="package.json" data-code="{&#10;  &quot;name&quot;: &quot;@duneui/core&quot;,&#10;  &quot;version&quot;: &quot;4.2.0&quot;&#10;}" class="flex w-full items-center justify-between rounded py-1 pl-2 pr-2 text-left text-slate-500 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800/70"><span>package.json</span></button></li>
      </ul>
    </div>
  </aside>

  <main class="flex-1 min-w-0 bg-slate-50 dark:bg-[#090A0E] p-4 sm:p-5">
    <div class="flex items-center gap-3 overflow-x-auto border-b border-slate-200 dark:border-zinc-800 pb-3 text-[11px]">
      <span data-tab-name="Sidebar.tsx" class="shrink-0 rounded-t border-b-2 border-sky-500 pb-1 font-semibold text-slate-900 dark:text-white">Sidebar.tsx</span>
      <span data-tab-name="Navbar.tsx" class="shrink-0 pb-1 text-slate-500 dark:text-zinc-400">Navbar.tsx</span>
      <span data-tab-name="tokens.css" class="shrink-0 pb-1 text-slate-500 dark:text-zinc-400">tokens.css</span>
    </div>
    <pre class="mt-4 overflow-x-auto text-[11px] leading-relaxed text-slate-700 dark:text-zinc-300"><code data-code-view>export function AppSidebar() {
  return &lt;aside className="hidden md:flex md:w-64 border-r"&gt;...&lt;/aside&gt;;
}</code></pre>
  </main>
</div>
<script>
  document.querySelectorAll('[data-shell-ide]').forEach((root) => {
    const toggle = root.querySelector('[data-mobile-toggle]');
    const drawer = root.querySelector('[data-sidebar-drawer]');
    const panelTitle = root.querySelector('[data-panel-title]');
    const mobileFile = root.querySelector('[data-mobile-file]');
    const codeView = root.querySelector('[data-code-view]');
    const activityBtns = Array.from(root.querySelectorAll('[data-activity-btn]'));
    const fileBtns = Array.from(root.querySelectorAll('[data-file-btn]'));
    const tabs = Array.from(root.querySelectorAll('[data-tab-name]'));

    const setDrawer = (open) => {
      toggle?.setAttribute('aria-expanded', String(open));
      drawer?.classList.toggle('hidden', !open);
      drawer?.classList.toggle('flex', open);
    };
    toggle?.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      setDrawer(!open);
    });
    activityBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        activityBtns.forEach((el) => el.classList.remove('bg-slate-200/80', 'dark:bg-zinc-800', 'text-slate-900', 'dark:text-white', 'border', 'border-slate-300', 'dark:border-white/15'));
        btn.classList.add('bg-slate-200/80', 'dark:bg-zinc-800', 'text-slate-900', 'dark:text-white', 'border', 'border-slate-300', 'dark:border-white/15');
        if (panelTitle) panelTitle.textContent = btn.getAttribute('data-panel-name') || 'EXPLORER · DUNEUI';
      });
    });
    fileBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        fileBtns.forEach((el) => {
          el.classList.remove('bg-sky-50', 'dark:bg-sky-500/15', 'text-sky-700', 'dark:text-sky-300');
        });
        btn.classList.add('bg-sky-50', 'dark:bg-sky-500/15', 'text-sky-700', 'dark:text-sky-300');
        const fname = btn.getAttribute('data-file') || 'Sidebar.tsx';
        if (mobileFile) mobileFile.textContent = 'EXPLORER · ' + fname;
        if (codeView) codeView.textContent = btn.getAttribute('data-code') || '';
        tabs.forEach((t) => {
          const match = t.getAttribute('data-tab-name') === fname;
          t.className = match
            ? 'shrink-0 rounded-t border-b-2 border-sky-500 pb-1 font-semibold text-slate-900 dark:text-white'
            : 'shrink-0 pb-1 text-slate-500 dark:text-zinc-400';
        });
        if (window.innerWidth < 768) setDrawer(false);
      });
    });
  });
</script>
