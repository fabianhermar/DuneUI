          <span class="size-3 rounded-full bg-rose-400"></span>

            <button type="button" data-glass-nav data-folder="Design Assets" class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-left text-slate-800 dark:text-white/85 hover:bg-slate-900/[0.07] dark:hover:bg-white/15"><span>◫</span> Design Assets</button>
            <button type="button" data-glass-nav data-folder="Shared iCloud" class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-left text-slate-800 dark:text-white/85 hover:bg-slate-900/[0.07] dark:hover:bg-white/15"><span>☁</span> Shared iCloud</button>

        <div>
          <p class="px-2.5 text-[10px] font-semibold uppercase tracking-wider text-slate-600 dark:text-white/70">Smart Tags</p>

            <button type="button" data-glass-nav data-folder="Concept 2027" class="flex w-full items-center gap-2.5 rounded-xl px-3 py-1.5 text-left hover:bg-slate-900/[0.07] dark:hover:bg-white/15"><span class="size-2.5 rounded-full bg-fuchsia-400"></span> Concept 2027</button>

  <main class="flex flex-1 min-w-0 flex-col justify-between bg-white/50 dark:bg-black/15 p-4 sm:p-7">

      <div class="flex items-center justify-between border-b border-slate-900/15 dark:border-white/15 pb-3">
        <h4 data-main-folder class="text-base font-semibold">Recents</h4>
        <span class="rounded-full bg-slate-900/[0.07] dark:bg-white/20 px-3 py-1 text-[11px]">Icon View</span>
      </div>
      <div class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-3 text-xs">
        <div class="rounded-2xl border border-slate-900/15 dark:border-white/25 bg-white/65 dark:bg-white/15 p-4 text-center"><p class="font-semibold">Hero-v4.fig</p><p class="mt-1 text-[10px] text-slate-600 dark:text-white/75">Edited 2m ago</p></div>
        <div class="rounded-2xl border border-slate-900/15 dark:border-white/25 bg-white/65 dark:bg-white/15 p-4 text-center"><p class="font-semibold">Tokens.json</p><p class="mt-1 text-[10px] text-slate-600 dark:text-white/75">Today</p></div>
        <div class="rounded-2xl border border-slate-900/15 dark:border-white/25 bg-white/65 dark:bg-white/15 p-4 text-center col-span-2 sm:col-span-1"><p class="font-semibold">Motion.mov</p><p class="mt-1 text-[10px] text-slate-600 dark:text-white/75">Yesterday</p></div>

    <p class="mt-6 text-[11px] text-slate-700 dark:text-white/75">Translucent sidebar chrome with collapsible mobile drawer and native hierarchy</p>
  </main>

<script>
  document.querySelectorAll('[data-shell-glass]').forEach((root) => {
    const toggle = root.querySelector('[data-mobile-toggle]');
    const drawer = root.querySelector('[data-sidebar-drawer]');
    const mainFolder = root.querySelector('[data-main-folder]');
    const items = Array.from(root.querySelectorAll('[data-glass-nav]'));

    const setDrawer = (open) => {
      toggle?.setAttribute('aria-expanded', String(open));
      drawer?.classList.toggle('hidden', !open);
      drawer?.classList.toggle('flex', open);
    };
    toggle?.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      setDrawer(!open);
    });
    items.forEach((btn) => {
      btn.addEventListener('click', () => {
        items.forEach((el) => {
          el.classList.remove('bg-white/85', 'dark:bg-white/25', 'font-semibold', 'shadow-xs');
        });
        btn.classList.add('bg-white/85', 'dark:bg-white/25', 'font-semibold', 'shadow-xs');
        if (mainFolder) mainFolder.textContent = btn.getAttribute('data-folder') || 'Recents';
        if (window.innerWidth < 768) setDrawer(false);
      });
    });
  });
</script>
