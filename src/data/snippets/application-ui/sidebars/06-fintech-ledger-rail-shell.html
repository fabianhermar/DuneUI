          <button type="button" data-ledger-nav data-label="Available USD Balance" data-amount="$62,410.50" class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">Balances</button>
          <button type="button" data-ledger-nav data-label="Settled Transactions (24h)" data-amount="1,842" class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">Transactions</button>
          <button type="button" data-ledger-nav data-label="Verified Billing Accounts" data-amount="9,304" class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">Customers</button>

            <button type="button" data-ledger-nav data-label="Radar Blocked Risk" data-amount="$12,840.00" class="block w-full rounded-lg px-3 py-2 text-left text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">Radar Fraud</button>
            <button type="button" data-ledger-nav data-label="Webhook Delivery Rate" data-amount="99.98%" class="block w-full rounded-lg px-3 py-2 text-left text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">Developers</button>

      <p class="mt-1 text-slate-500 dark:text-zinc-400">Automatic settlement to Silicon Valley Commercial •••4019</p>
    </div>

</div>
<script>
  document.querySelectorAll('[data-shell-fintech]').forEach((root) => {
    const toggle = root.querySelector('[data-mobile-toggle]');
    const drawer = root.querySelector('[data-sidebar-drawer]');
    const labelEl = root.querySelector('[data-ledger-label]');
    const amountEl = root.querySelector('[data-ledger-amount]');
    const links = Array.from(root.querySelectorAll('[data-ledger-nav]'));
    const testBtn = root.querySelector('[data-test-toggle]');
    const testLabel = root.querySelector('[data-test-label]');
    const testTrack = root.querySelector('[data-test-track]');

    const setDrawer = (open) => {
      toggle?.setAttribute('aria-expanded', String(open));
      drawer?.classList.toggle('hidden', !open);
      drawer?.classList.toggle('flex', open);
    };
    toggle?.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      setDrawer(!open);
    });
    links.forEach((btn) => {
      btn.addEventListener('click', () => {
        links.forEach((el) => {
          el.classList.remove('bg-indigo-50', 'dark:bg-indigo-500/15', 'font-semibold', 'text-indigo-700', 'dark:text-indigo-300');
          el.classList.add('text-slate-600', 'dark:text-zinc-300');
        });
        btn.classList.remove('text-slate-600', 'dark:text-zinc-300');
        btn.classList.add('bg-indigo-50', 'dark:bg-indigo-500/15', 'font-semibold', 'text-indigo-700', 'dark:text-indigo-300');
        if (labelEl) labelEl.textContent = btn.getAttribute('data-label') || 'Gross Volume Today';
        if (amountEl) amountEl.textContent = btn.getAttribute('data-amount') || '$148,920.00';
        if (window.innerWidth < 768) setDrawer(false);
      });
    });
    testBtn?.addEventListener('click', () => {
      const isTest = testBtn.getAttribute('aria-pressed') === 'true';
      testBtn.setAttribute('aria-pressed', String(!isTest));
      if (isTest) {
        testBtn.className = 'mt-5 flex w-full items-center justify-between rounded-xl border border-emerald-200 dark:border-emerald-500/30 bg-emerald-50 dark:bg-emerald-500/15 px-3 py-2 text-xs';
        if (testLabel) { testLabel.textContent = 'Live Mode'; testLabel.className = 'font-semibold text-emerald-900 dark:text-emerald-200'; }
        if (testTrack) testTrack.className = 'inline-flex h-5 w-9 items-center justify-start rounded-full bg-emerald-600 p-0.5 transition';
      } else {
        testBtn.className = 'mt-5 flex w-full items-center justify-between rounded-xl border border-amber-200 dark:border-amber-500/30 bg-amber-50 dark:bg-amber-500/15 px-3 py-2 text-xs';
        if (testLabel) { testLabel.textContent = 'Test Mode'; testLabel.className = 'font-semibold text-amber-900 dark:text-amber-200'; }
        if (testTrack) testTrack.className = 'inline-flex h-5 w-9 items-center justify-end rounded-full bg-amber-500 p-0.5 transition';
      }
    });
  });
</script>
