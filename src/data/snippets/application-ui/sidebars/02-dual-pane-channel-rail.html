<script>
  document.querySelectorAll('[data-shell-dual]').forEach((root) => {
    const toggle = root.querySelector('[data-mobile-toggle]');
    const drawer = root.querySelector('[data-sidebar-drawer]');
    const wsHeading = root.querySelector('[data-ws-heading]');
    const mobileWsPill = root.querySelector('[data-mobile-ws-pill]');
    const mobileChannel = root.querySelector('[data-mobile-channel]');
    const mainChannel = root.querySelector('[data-main-channel]');
    const placeholder = root.querySelector('[data-msg-placeholder]');
    const wsPills = Array.from(root.querySelectorAll('[data-ws-pill]'));
    const channelBtns = Array.from(root.querySelectorAll('[data-channel-btn]'));

    const setDrawer = (open) => {
      toggle?.setAttribute('aria-expanded', String(open));
      drawer?.classList.toggle('hidden', !open);
      drawer?.classList.toggle('flex', open);
    };
    toggle?.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      setDrawer(!open);
    });
    wsPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        wsPills.forEach((el) => {
          el.className = 'flex size-10 items-center justify-center rounded-2xl bg-slate-100 dark:bg-zinc-800 text-xs font-bold text-slate-600 dark:text-zinc-300 hover:bg-slate-200 dark:hover:bg-zinc-700 hover:text-slate-900 dark:hover:text-white border border-slate-200 dark:border-white/15';
        });
        pill.className = 'flex size-10 items-center justify-center rounded-2xl bg-indigo-600 text-xs font-bold text-white shadow-lg shadow-indigo-500/30 ring-2 ring-indigo-300 dark:ring-white/30';
        const label = pill.getAttribute('data-ws-label') || 'DuneHQ';
        const code = pill.getAttribute('data-ws-code') || 'DN';
        if (wsHeading) wsHeading.textContent = label;
        if (mobileWsPill) mobileWsPill.textContent = code;
      });
    });
    channelBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        channelBtns.forEach((el) => {
          el.classList.remove('bg-indigo-50', 'dark:bg-indigo-500/20', 'font-semibold', 'text-slate-900', 'dark:text-white');
        });
        btn.classList.add('bg-indigo-50', 'dark:bg-indigo-500/20', 'font-semibold', 'text-slate-900', 'dark:text-white');
        const name = btn.getAttribute('data-channel-name') || '# design-system';
        if (mainChannel) mainChannel.textContent = name;
        if (mobileChannel) mobileChannel.textContent = name;
        if (placeholder) placeholder.textContent = 'Message ' + name + '...';
        if (window.innerWidth < 768) setDrawer(false);
      });
    });
  });
</script>
