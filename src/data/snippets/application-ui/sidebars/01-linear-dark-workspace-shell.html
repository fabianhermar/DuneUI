<script>
  document.querySelectorAll('[data-shell-linear]').forEach((root) => {
    const toggle = root.querySelector('[data-mobile-toggle]');
    const drawer = root.querySelector('[data-sidebar-drawer]');
    const mainTitle = root.querySelector('[data-main-title]');
    const mainCrumb = root.querySelector('[data-main-crumb]');
    const mobileCrumb = root.querySelector('[data-mobile-crumb]');
    const wsBtn = root.querySelector('[data-ws-switch]');
    const wsName = root.querySelector('[data-ws-name]');
    const wsBadge = root.querySelector('[data-ws-badge]');
    const items = Array.from(root.querySelectorAll('[data-nav-item]'));
    let activeWorkspace = 'Dune Labs';
    let currentSection = 'Inbox';

    const setDrawer = (open) => {
      toggle?.setAttribute('aria-expanded', String(open));
      drawer?.classList.toggle('hidden', !open);
      drawer?.classList.toggle('flex', open);
    };
    toggle?.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      setDrawer(!open);
    });
    wsBtn?.addEventListener('click', () => {
      activeWorkspace = activeWorkspace === 'Dune Labs' ? 'Dune Studio' : 'Dune Labs';
      if (wsName) wsName.textContent = activeWorkspace;
      if (wsBadge) wsBadge.textContent = activeWorkspace === 'Dune Labs' ? 'D' : 'S';
      if (mainCrumb) mainCrumb.textContent = activeWorkspace + ' / ' + currentSection;
      if (mobileCrumb) mobileCrumb.textContent = activeWorkspace + ' · ' + currentSection;
    });
    items.forEach((btn) => {
      btn.addEventListener('click', () => {
        items.forEach((el) => {
          el.classList.remove('bg-slate-900/[0.08]', 'dark:bg-white/10', 'font-medium', 'text-slate-900', 'dark:text-white');
          el.classList.add('text-slate-600', 'dark:text-zinc-400');
        });
        btn.classList.remove('text-slate-600', 'dark:text-zinc-400');
        btn.classList.add('bg-slate-900/[0.08]', 'dark:bg-white/10', 'font-medium', 'text-slate-900', 'dark:text-white');
        currentSection = btn.getAttribute('data-view-section') || 'Inbox';
        if (mainTitle) mainTitle.textContent = btn.getAttribute('data-view-title') || 'Active Design Triage';
        if (mainCrumb) mainCrumb.textContent = activeWorkspace + ' / ' + currentSection;
        if (mobileCrumb) mobileCrumb.textContent = activeWorkspace + ' · ' + currentSection;
        if (window.innerWidth < 768) setDrawer(false);
      });
    });
  });
</script>
