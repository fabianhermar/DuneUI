<div class="flex flex-col items-center pt-40 pb-4 text-slate-900 dark:text-white">
  <div class="group relative inline-flex">
    <button type="button" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#121318] px-4 py-2 text-xs font-semibold text-slate-800 dark:text-zinc-200 shadow-sm transition hover:border-slate-300 dark:hover:border-white/30 hover:bg-slate-900/[0.07] dark:hover:bg-white/10 focus:outline-none">
      <span>Keyboard Shortcuts</span>
      <kbd class="rounded bg-slate-900/[0.07] dark:bg-white/10 px-1.5 py-0.5 font-mono text-[10px] text-slate-700 dark:text-zinc-300">⌘/</kbd>
    </button>
    <div class="pointer-events-none invisible absolute bottom-full left-1/2 z-20 w-64 -translate-x-1/2 pb-2.5 opacity-0 translate-y-2 transition-all duration-200 ease-out group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 group-focus-within:visible group-focus-within:translate-y-0 group-focus-within:opacity-100">
      <div class="relative space-y-2 rounded-2xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#121318] p-4 text-xs text-slate-700 dark:text-zinc-300 shadow-lg dark:shadow-2xl">
        <div class="flex items-center justify-between"><span>Navigate items</span><kbd class="rounded bg-slate-900/[0.07] dark:bg-white/10 px-1.5 py-0.5 font-mono text-[10px]">↑↓</kbd></div>
        <div class="flex items-center justify-between"><span>Open selection</span><kbd class="rounded bg-slate-900/[0.07] dark:bg-white/10 px-1.5 py-0.5 font-mono text-[10px]">↵</kbd></div>
        <div class="flex items-center justify-between"><span>Command palette</span><kbd class="rounded bg-slate-900/[0.07] dark:bg-white/10 px-1.5 py-0.5 font-mono text-[10px]">⌘K</kbd></div>
        <div class="flex items-center justify-between"><span>Dismiss overlay</span><kbd class="rounded bg-slate-900/[0.07] dark:bg-white/10 px-1.5 py-0.5 font-mono text-[10px]">ESC</kbd></div>
        <span class="absolute left-1/2 top-full -mt-1.5 h-3 w-3 -translate-x-1/2 rotate-45 border-b border-r border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-[#121318]"></span>
      </div>
    </div>
  </div>
  <p class="mt-3 text-[11px] text-slate-500 dark:text-zinc-500">Hover button for animated keybinding list</p>
</div>
