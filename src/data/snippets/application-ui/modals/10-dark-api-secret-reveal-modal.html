<div data-secret-modal class="mx-auto w-full max-w-md rounded-2xl border border-emerald-500/35 bg-white dark:bg-[#121318] p-6 text-slate-900 dark:text-white shadow-xl dark:shadow-2xl">
  <div class="flex items-center justify-between gap-2">
    <span class="rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-0.5 font-mono text-[11px] font-semibold text-emerald-700 dark:text-emerald-300">TOKEN GENERATED</span>
    <span class="font-mono text-[11px] text-slate-500 dark:text-zinc-400">read:tokens</span>
  </div>
  <h3 class="mt-3 text-base font-bold">Copy your production secret key</h3>
  <p class="mt-1 text-xs leading-relaxed text-slate-600 dark:text-zinc-400">This secret is only shown once. Store it securely in your environment vault.</p>
  <div class="mt-4 flex items-center justify-between gap-2 rounded-xl border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-black px-3 py-2.5 font-mono text-xs text-emerald-700 dark:text-emerald-300">
    <span class="truncate">dn_live_99a2f0b4d1e8c4b9...</span>
    <button type="button" data-key-copy class="shrink-0 rounded-lg bg-slate-900 dark:bg-white px-2.5 py-1 text-[11px] font-semibold text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-zinc-200">Copy</button>

<script>
  document.querySelectorAll('[data-secret-modal]').forEach((root) => {
    const btn = root.querySelector('[data-key-copy]');
    btn?.addEventListener('click', () => {
      btn.textContent = btn.textContent === 'Copied' ? 'Copy' : 'Copied';
    });

</script>
