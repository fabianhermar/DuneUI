    </div>
  </div>

<script>
  document.querySelectorAll('[data-oauth-modal]').forEach((root) => {
    const status = root.querySelector('[data-oauth-status]');
    const btn = root.querySelector('[data-oauth-btn]');
    btn?.addEventListener('click', () => {
      const connected = btn.textContent?.includes('Connected');
      btn.textContent = connected ? 'Authorize GitHub' : 'Connected ✓';
      if (status) status.textContent = connected ? 'Pending approval' : 'Active';
    });
  });
</script>
