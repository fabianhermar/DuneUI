<div data-invite-modal class="mx-auto w-full max-w-lg rounded-2xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#14151a] p-5 sm:p-6 shadow-xl dark:shadow-2xl text-slate-900 dark:text-zinc-100">
  <div class="flex items-start justify-between gap-3">
    <div class="flex items-start gap-3">
      <div class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-indigo-50 dark:bg-indigo-500/15 text-indigo-600 dark:text-indigo-400">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M11 5a3 3 0 11-6 0 3 3 0 016 0zM2.615 16.428a1.224 1.224 0 01-.569-1.175 6.002 6.002 0 0111.908 0c.058.467-.172.92-.57 1.174A9.953 9.953 0 018 18a9.953 9.953 0 01-5.385-1.572zM16.25 5.75a.75.75 0 00-1.5 0v2h-2a.75.75 0 000 1.5h2v2a.75.75 0 001.5 0v-2h2a.75.75 0 000-1.5h-2v-2z"/></svg>
      </div>
      <div>
        <h3 class="text-base font-semibold tracking-tight text-slate-900 dark:text-white">Invite collaborators</h3>
        <p class="mt-0.5 text-xs text-slate-600 dark:text-zinc-400">Members receive read &amp; preview access to staging deployments.</p>
      </div>
    </div>
    <span class="rounded-md border border-slate-200 dark:border-white/15 px-1.5 py-0.5 font-mono text-[10px] font-medium text-slate-500 dark:text-zinc-400">ESC</span>
  </div>
  <div class="mt-5 flex flex-col gap-2 sm:flex-row">
    <input type="email" value="alex@linear.app" placeholder="teammate@company.dev" class="min-w-0 flex-1 rounded-xl border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-zinc-950 px-3.5 py-2 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" />
    <button type="button" data-invite-send class="shrink-0 rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-indigo-500">Send Invite</button>
  </div>
  <div class="mt-4 flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 dark:border-white/10 pt-4 text-xs text-slate-600 dark:text-zinc-400">
    <span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Link expires in 7 days</span>
    <button type="button" data-invite-copy class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Copy invite URL</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-invite-modal]').forEach((root) => {
    const send = root.querySelector('[data-invite-send]');
    const copy = root.querySelector('[data-invite-copy]');
    send?.addEventListener('click', () => {
      send.textContent = send.textContent === 'Invite Sent' ? 'Send Invite' : 'Invite Sent';
    });
    copy?.addEventListener('click', () => {
      copy.textContent = copy.textContent === 'URL Copied' ? 'Copy invite URL' : 'URL Copied';
    });
  });
</script>
