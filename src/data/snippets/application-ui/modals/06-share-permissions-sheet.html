<div data-share-modal class="mx-auto w-full max-w-md rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5 shadow-md text-slate-900 dark:text-zinc-100">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800/80 pb-3.5">
    <h3 class="text-sm font-semibold text-slate-900 dark:text-zinc-100">Share “Q4 Roadmap.fig”</h3>
    <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-700 dark:text-emerald-300"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Link active</span>
  </div>
  <ul class="my-4 space-y-3 text-sm">
    <li class="flex items-center justify-between gap-2">
      <div class="flex min-w-0 items-center gap-2.5">
        <img src="/images/avatars/sofia.jpg" alt="Sofia Cruz" class="size-8 shrink-0 rounded-full object-cover" />
        <div class="min-w-0">
          <p class="truncate font-semibold text-slate-900 dark:text-zinc-100">Sofia Cruz</p>
          <p class="truncate text-xs text-slate-500 dark:text-zinc-400">sofia@dune.dev</p>
        </div>
      </div>
      <span class="shrink-0 text-xs font-semibold text-slate-500 dark:text-zinc-400">Owner</span>
    </li>
    <li class="flex items-center justify-between gap-2">
      <div class="flex min-w-0 items-center gap-2.5">
        <img src="/images/avatars/mateo.jpg" alt="Mateo Ruiz" class="size-8 shrink-0 rounded-full object-cover" />
        <div class="min-w-0">
          <p class="truncate font-semibold text-slate-900 dark:text-zinc-100">Mateo Ruiz</p>
          <p class="truncate text-xs text-slate-500 dark:text-zinc-400">mateo@dune.dev</p>
        </div>
      </div>
      <button type="button" data-perm-btn class="shrink-0 rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 px-2.5 py-1 text-xs font-semibold text-slate-700 dark:text-zinc-200">Can edit ▾</button>
    </li>
  </ul>
  <div class="flex flex-col gap-2 rounded-xl border border-slate-200/80 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-950/60 p-2 sm:flex-row sm:items-center sm:justify-between">
    <span class="truncate px-1.5 font-mono text-xs text-slate-600 dark:text-zinc-400">figma.com/file/9xK2-q4</span>
    <button type="button" data-share-copy class="shrink-0 rounded-lg bg-slate-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-zinc-200">Copy link</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-share-modal]').forEach((root) => {
    const perms = ['Can edit ▾', 'Can view ▾', 'Admin ▾'];
    const pBtn = root.querySelector('[data-perm-btn]');
    const copy = root.querySelector('[data-share-copy]');
    pBtn?.addEventListener('click', () => {
      const idx = perms.indexOf(pBtn.textContent?.trim() || 'Can edit ▾');
      pBtn.textContent = perms[(idx + 1) % perms.length];
    });
    copy?.addEventListener('click', () => {
      copy.textContent = copy.textContent === 'Copied' ? 'Copy link' : 'Copied';
    });
  });
</script>
