<div data-nps-modal class="mx-auto w-full max-w-md rounded-2xl bg-white dark:bg-zinc-900 p-6 shadow-lg ring-1 ring-slate-200 dark:ring-zinc-800 text-slate-900 dark:text-zinc-100">
  <p class="text-[11px] font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Quick Check-in</p>
  <h3 class="mt-1 text-base font-bold text-slate-900 dark:text-zinc-100">How likely are you to recommend DuneUI?</h3>
  <div class="mt-4 grid grid-cols-5 gap-2 text-center font-mono text-xs font-bold">
    <button type="button" data-nps-btn aria-pressed="false" class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/50 py-2.5 text-slate-700 dark:text-zinc-300 transition">1</button>
    <button type="button" data-nps-btn aria-pressed="false" class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/50 py-2.5 text-slate-700 dark:text-zinc-300 transition">2</button>
    <button type="button" data-nps-btn aria-pressed="false" class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/50 py-2.5 text-slate-700 dark:text-zinc-300 transition">3</button>
    <button type="button" data-nps-btn aria-pressed="true" class="rounded-xl border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-500/20 py-2.5 text-indigo-700 dark:text-indigo-300 transition">4</button>
    <button type="button" data-nps-btn aria-pressed="false" class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-950/50 py-2.5 text-slate-700 dark:text-zinc-300 transition">5</button>
  </div>
  <div class="mt-2 flex justify-between text-[11px] text-slate-500 dark:text-zinc-400">
    <span>Unlikely</span>
    <span>Essential</span>
  </div>
  <button type="button" data-nps-submit class="mt-5 w-full rounded-xl bg-slate-900 dark:bg-white py-2.5 text-xs font-semibold text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-zinc-200">Submit Rating</button>
</div>
<script>
  document.querySelectorAll('[data-nps-modal]').forEach((root) => {
    const btns = root.querySelectorAll('[data-nps-btn]');
    const submit = root.querySelector('[data-nps-submit]');
    const onCls = ['border-2', 'border-indigo-600', 'bg-indigo-50', 'dark:bg-indigo-500/20', 'text-indigo-700', 'dark:text-indigo-300'];
    const offCls = ['border', 'border-slate-200', 'dark:border-zinc-700', 'bg-white', 'dark:bg-zinc-950/50', 'text-slate-700', 'dark:text-zinc-300'];
    btns.forEach((b) => b.addEventListener('click', () => {
      btns.forEach((x) => { x.setAttribute('aria-pressed', 'false'); x.classList.remove(...onCls); x.classList.add(...offCls); });
      b.setAttribute('aria-pressed', 'true');
      b.classList.remove(...offCls);
      b.classList.add(...onCls);
    }));
    submit?.addEventListener('click', () => {
      submit.textContent = submit.textContent === 'Thanks for rating' ? 'Submit Rating' : 'Thanks for rating';
    });
  });
</script>
