<div data-cookie-modal class="mx-auto w-full max-w-md rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 shadow-lg text-slate-900 dark:text-zinc-100">
  <h3 class="text-base font-bold tracking-tight text-slate-900 dark:text-zinc-100">Manage Privacy Preferences</h3>
  <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400">Choose which telemetry cookies help us improve docs &amp; previews.</p>
  <div class="mt-4 divide-y divide-slate-100 dark:divide-zinc-800/80 text-xs">
    <div class="flex items-center justify-between gap-3 py-3">
      <div>
        <p class="font-semibold text-slate-900 dark:text-zinc-100">Strictly Necessary</p>
        <p class="text-slate-500 dark:text-zinc-400">Session auth &amp; CSRF security</p>
      </div>
      <span class="rounded-full bg-emerald-50 dark:bg-emerald-500/15 px-2.5 py-0.5 font-semibold text-emerald-700 dark:text-emerald-300">Always On</span>
    </div>
    <div class="flex items-center justify-between gap-3 py-3">
      <div>
        <p class="font-semibold text-slate-900 dark:text-zinc-100">Telemetry Analytics</p>
        <p class="text-slate-500 dark:text-zinc-400">Anonymous performance timings</p>
      </div>
      <button type="button" role="switch" aria-checked="false" data-cookie-switch class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full bg-slate-200 dark:bg-zinc-700 p-0.5 transition">
        <span data-cookie-knob class="inline-block h-5 w-5 translate-x-0 rounded-full bg-white shadow transition"></span>
      </button>
    </div>
  </div>
  <div class="mt-5 flex flex-col gap-2 sm:flex-row">
    <button type="button" data-cookie-save class="flex-1 rounded-xl border border-slate-200 dark:border-zinc-700 py-2.5 text-xs font-semibold text-slate-700 dark:text-zinc-200 transition hover:bg-slate-50 dark:hover:bg-zinc-800">Save Preferences</button>
    <button type="button" data-cookie-accept class="flex-1 rounded-xl bg-slate-900 dark:bg-white py-2.5 text-xs font-semibold text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-zinc-200">Accept All</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-cookie-modal]').forEach((root) => {
    const sw = root.querySelector('[data-cookie-switch]');
    const knob = root.querySelector('[data-cookie-knob]');
    const save = root.querySelector('[data-cookie-save]');
    const accept = root.querySelector('[data-cookie-accept]');
    const setSwitch = (on) => {
      if (!sw || !knob) return;
      sw.setAttribute('aria-checked', on ? 'true' : 'false');
      sw.classList.toggle('bg-indigo-600', on);
      sw.classList.toggle('bg-slate-200', !on);
      sw.classList.toggle('dark:bg-zinc-700', !on);
      knob.classList.toggle('translate-x-5', on);
      knob.classList.toggle('translate-x-0', !on);
    };
    sw?.addEventListener('click', () => setSwitch(sw.getAttribute('aria-checked') !== 'true'));
    save?.addEventListener('click', () => { save.textContent = 'Preferences Saved'; });
    accept?.addEventListener('click', () => { setSwitch(true); accept.textContent = 'All Accepted'; });
  });
</script>
