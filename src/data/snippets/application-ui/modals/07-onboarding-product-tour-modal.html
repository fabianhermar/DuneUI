<div data-tour-modal class="mx-auto w-full max-w-md overflow-hidden rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-xl text-slate-900 dark:text-zinc-100">
  <div class="flex h-36 flex-col items-center justify-center gap-2 bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 p-6 text-white">
    <span class="inline-flex items-center gap-1.5 rounded-full border border-white/30 bg-white/15 px-3.5 py-1.5 text-xs font-semibold backdrop-blur-md">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>
      Live Viewport Switcher
    </span>
  </div>
  <div class="p-6">
    <h3 data-tour-title class="text-lg font-bold tracking-tight text-slate-900 dark:text-zinc-100">Meet Responsive Sandboxes</h3>
    <p data-tour-body class="mt-2 text-xs leading-relaxed text-slate-600 dark:text-zinc-300">Preview every UI block from 375px mobile to wide desktop on Light, Dark, and Aurora stages.</p>
    <div class="mt-5 flex items-center justify-between">
      <span data-tour-step class="font-mono text-xs font-semibold text-slate-500 dark:text-zinc-400">Step 1 of 3</span>
      <button type="button" data-tour-next class="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-indigo-700">Next Tip →</button>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('[data-tour-modal]').forEach((root) => {
    const tips = [
      { t: 'Meet Responsive Sandboxes', b: 'Preview every UI block from 375px mobile to wide desktop on Light, Dark, and Aurora stages.', btn: 'Next Tip →' },
      { t: 'Zero-Bloat Production HTML', b: 'Copy clean Tailwind v4 markup with instant dark-mode tokens ready to paste into your app.', btn: 'Next Tip →' },
      { t: 'Keyboard-First Workflow', b: 'Press Cmd+K anywhere to jump across 40+ UI families and live examples.', btn: 'Restart Tour' }
    ];
    let step = 0;
    const tEl = root.querySelector('[data-tour-title]');
    const bEl = root.querySelector('[data-tour-body]');
    const sEl = root.querySelector('[data-tour-step]');
    const btn = root.querySelector('[data-tour-next]');
    btn?.addEventListener('click', () => {
      step = (step + 1) % tips.length;
      if (tEl) tEl.textContent = tips[step].t;
      if (bEl) bEl.textContent = tips[step].b;
      if (sEl) sEl.textContent = 'Step ' + (step + 1) + ' of 3';
      btn.textContent = tips[step].btn;
    });
  });
</script>
