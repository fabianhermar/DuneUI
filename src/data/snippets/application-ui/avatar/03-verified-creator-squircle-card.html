<div class="flex justify-center">
  <div data-creator-glass class="flex w-full max-w-md items-center justify-between gap-4 rounded-2xl border border-slate-900/15 dark:border-white/25 bg-white/80 dark:bg-white/12 p-4 text-slate-900 dark:text-white shadow-xl backdrop-blur-2xl">
    <div class="flex items-center gap-3.5 min-w-0">
      <div class="relative shrink-0">
        <img src="/images/avatars/sofia.jpg" alt="Sofia Navarro" class="size-13 rounded-2xl object-cover object-top ring-1 ring-slate-900/15 dark:ring-white/40 shadow-md" />
        <span class="absolute -bottom-1 -right-1 flex size-5 items-center justify-center rounded-full bg-sky-500 text-white ring-2 ring-white dark:ring-slate-900">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3.5"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" /></svg>
        </span>
      </div>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold">Sofia Navarro</p>
        <p class="truncate text-xs text-slate-600 dark:text-white/75">Staff Design Engineer &middot; 142 kits</p>
      </div>
    </div>
    <button type="button" data-follow-btn class="shrink-0 rounded-xl bg-slate-900 dark:bg-white px-3.5 py-1.5 text-xs font-semibold text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-sky-100">Follow</button>
    <script>
      (() => {
        const btn = document.currentScript.closest('[data-creator-glass]').querySelector('[data-follow-btn]');
        btn?.addEventListener('click', () => {
          const active = btn.dataset.following === '1';
          btn.dataset.following = active ? '0' : '1';
          btn.textContent = active ? 'Follow' : 'Following ✓';
        });
      })();
    </script>
  </div>
</div>
