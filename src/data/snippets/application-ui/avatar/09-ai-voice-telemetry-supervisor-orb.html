<div data-ai-avatar class="mx-auto flex w-full max-w-md items-center justify-between gap-4 rounded-2xl border border-slate-200 dark:border-white/15 bg-white dark:bg-zinc-900/95 p-4 shadow-md text-slate-900 dark:text-zinc-100">
  <div class="flex items-center gap-3.5">
    <div class="relative flex size-14 shrink-0 items-center justify-center rounded-full bg-gradient-to-tr from-cyan-400 via-indigo-500 to-fuchsia-500 shadow-[0_0_24px_rgba(99,102,241,0.4)]">
      <span class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-zinc-950 font-mono text-xs font-bold text-cyan-700 dark:text-cyan-300">AI</span>
      <img src="/images/avatars/sofia.jpg" alt="Supervisor Sofia" class="absolute -bottom-0.5 -right-0.5 size-6 rounded-full object-cover object-top ring-2 ring-white dark:ring-zinc-900" />
    </div>
    <div>
      <div class="flex items-center gap-2">
        <p class="text-sm font-semibold text-slate-900 dark:text-white">Nova Copilot</p>
        <span class="rounded bg-cyan-50 dark:bg-cyan-500/15 px-1.5 py-0.5 font-mono text-[10px] font-semibold text-cyan-700 dark:text-cyan-300">18ms</span>
      </div>
      <p data-ai-state class="mt-0.5 text-xs text-emerald-700 dark:text-emerald-400">● Listening &middot; Supervised by Sofia</p>
    </div>
  </div>
  <button type="button" data-ai-mute class="rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 px-3 py-1.5 font-mono text-xs font-semibold text-slate-700 dark:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-700">Mute</button>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-ai-avatar]');
      const btn = root.querySelector('[data-ai-mute]');
      const st = root.querySelector('[data-ai-state]');
      btn?.addEventListener('click', () => {
        const muted = btn.dataset.muted === '1';
        btn.dataset.muted = muted ? '0' : '1';
        btn.textContent = muted ? 'Mute' : 'Unmute';
        st.textContent = muted ? '● Listening · Supervised by Sofia' : '○ Muted · Supervised by Sofia';
      });
    })();
  </script>
</div>
