<div data-story-strip class="mx-auto w-full max-w-md rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-4 shadow-2xs text-slate-900 dark:text-zinc-100">
  <div class="flex flex-wrap items-center justify-center gap-5">
    <button type="button" data-story-item="Sofia (@sofianav)" class="group text-center focus:outline-none">
      <div data-story-ring class="relative rounded-full bg-gradient-to-tr from-amber-500 via-rose-500 to-fuchsia-600 p-0.5 transition">
        <div class="rounded-full bg-white dark:bg-zinc-900 p-0.5"><img src="/images/avatars/sofia.jpg" alt="Sofia" class="size-13 rounded-full object-cover object-top" /></div>
        <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 rounded bg-rose-600 px-1.5 py-0.5 font-mono text-[9px] font-bold uppercase text-white ring-2 ring-white dark:ring-zinc-900">LIVE</span>
      </div>
      <span class="mt-2 block text-xs font-medium text-slate-700 dark:text-zinc-300">Sofia</span>
    </button>
    <button type="button" data-story-item="Mateo (@msilva)" class="group text-center focus:outline-none">
      <div data-story-ring class="rounded-full bg-gradient-to-tr from-cyan-400 to-indigo-600 p-0.5 transition">
        <div class="rounded-full bg-white dark:bg-zinc-900 p-0.5"><img src="/images/avatars/mateo.jpg" alt="Mateo" class="size-13 rounded-full object-cover object-top" /></div>
      </div>
      <span class="mt-2 block text-xs font-medium text-slate-700 dark:text-zinc-300">Mateo</span>
    </button>
    <button type="button" data-story-item="Nora (@norakim)" class="group text-center focus:outline-none">
      <div data-story-ring class="rounded-full bg-gradient-to-tr from-emerald-400 to-teal-600 p-0.5 transition">
        <div class="rounded-full bg-white dark:bg-zinc-900 p-0.5"><img src="/images/avatars/nora.svg" alt="Nora" class="size-13 rounded-full object-cover object-top" /></div>
      </div>
      <span class="mt-2 block text-xs font-medium text-slate-700 dark:text-zinc-300">Nora</span>
    </button>
    <button type="button" data-story-item="Lucas (@lvance)" class="group text-center focus:outline-none">
      <div data-story-ring class="rounded-full bg-slate-200 dark:bg-zinc-700 p-0.5 transition">
        <div class="rounded-full bg-white dark:bg-zinc-900 p-0.5"><img src="/images/avatars/lucas.svg" alt="Lucas" class="size-13 rounded-full object-cover object-top opacity-80" /></div>
      </div>
      <span class="mt-2 block text-xs font-medium text-slate-500 dark:text-zinc-400">Lucas</span>
    </button>
  </div>
  <p data-story-caption class="mt-3 text-center font-mono text-[11px] text-slate-500 dark:text-zinc-400">Click any ring to mark story viewed</p>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-story-strip]');
      const cap = root.querySelector('[data-story-caption]');
      root.querySelectorAll('[data-story-item]').forEach((item) => {
        item.addEventListener('click', () => {
          const ring = item.querySelector('[data-story-ring]');
          ring.className = 'relative rounded-full bg-slate-200 dark:bg-zinc-700 p-0.5 transition';
          cap.textContent = 'Viewed update from ' + item.dataset.storyItem;
        });
      });
    })();
  </script>
</div>
