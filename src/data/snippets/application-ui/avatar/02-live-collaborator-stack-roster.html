<div data-collab-wrap class="mx-auto w-full max-w-md rounded-2xl bg-white dark:bg-zinc-900 p-4 shadow-sm ring-1 ring-slate-200 dark:ring-zinc-800 text-slate-900 dark:text-zinc-100">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="flex -space-x-2.5">
        <img src="/images/avatars/sofia.jpg" alt="Sofia Navarro" class="size-9 rounded-full object-cover object-top ring-2 ring-white dark:ring-zinc-900" />
        <img src="/images/avatars/mateo.jpg" alt="Mateo Silva" class="size-9 rounded-full object-cover object-top ring-2 ring-white dark:ring-zinc-900" />
        <img src="/images/avatars/nora.svg" alt="Nora Kim" class="size-9 rounded-full object-cover object-top ring-2 ring-white dark:ring-zinc-900" />
        <img src="/images/avatars/lucas.svg" alt="Lucas Vance" class="size-9 rounded-full object-cover object-top ring-2 ring-white dark:ring-zinc-900" />
        <span class="inline-flex size-9 items-center justify-center rounded-full bg-slate-100 dark:bg-zinc-800 font-mono text-xs font-bold text-slate-700 dark:text-zinc-200 ring-2 ring-white dark:ring-zinc-900">+5</span>
      </div>
      <div class="text-xs">
        <p class="font-semibold text-slate-900 dark:text-white">9 collaborators</p>
        <p class="text-[11px] text-emerald-700 dark:text-emerald-400">● Live in /design-tokens</p>
      </div>
    </div>
    <button type="button" data-roster-toggle aria-expanded="false" class="rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-700">Inspect Roster</button>
  </div>
  <div data-roster-panel class="mt-3 hidden space-y-2 border-t border-slate-100 dark:border-zinc-800 pt-3 text-xs">
    <div class="flex items-center justify-between">
      <span class="flex items-center gap-2.5 font-medium"><img src="/images/avatars/sofia.jpg" alt="" class="size-6 rounded-full object-cover object-top" />Sofia Navarro</span>
      <span class="font-mono text-[11px] text-indigo-700 dark:text-indigo-300">Editing Hero.astro</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="flex items-center gap-2.5 font-medium"><img src="/images/avatars/mateo.jpg" alt="" class="size-6 rounded-full object-cover object-top" />Mateo Silva</span>
      <span class="font-mono text-[11px] text-emerald-700 dark:text-emerald-400">Reviewing Tokens</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="flex items-center gap-2.5 font-medium"><img src="/images/avatars/lucas.svg" alt="" class="size-6 rounded-full object-cover object-top" />Lucas Vance</span>
      <span class="font-mono text-[11px] text-slate-500 dark:text-zinc-400">Idle · 2m ago</span>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-collab-wrap]');
      const btn = root.querySelector('[data-roster-toggle]');
      const panel = root.querySelector('[data-roster-panel]');
      btn?.addEventListener('click', () => {
        const open = panel.classList.toggle('hidden') === false;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.textContent = open ? 'Hide Roster' : 'Inspect Roster';
      });
    })();
  </script>
</div>
