<div data-drw1 data-open="true" class="group/d1 relative mx-auto h-[500px] w-full max-w-4xl overflow-hidden rounded-3xl border border-slate-200/90 dark:border-white/12 bg-slate-100 dark:bg-[#090B11] text-slate-900 dark:text-zinc-100 shadow-lg">
  <!-- Background Host Workspace (Scales & Softens When Drawer Opens) -->
  <div class="flex h-full flex-col bg-[#F7F8FB] dark:bg-[#0D1018] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] origin-left group-data-[open=true]/d1:scale-[0.97] group-data-[open=true]/d1:rounded-2xl">
    <div class="flex items-center justify-between border-b border-slate-200/80 dark:border-white/10 bg-white dark:bg-[#111521] px-5 py-3.5">
      <div class="flex items-center gap-2.5">
        <span class="flex size-7 items-center justify-center rounded-lg bg-indigo-600 text-xs font-bold text-white shadow-sm">K</span>
        <div>
          <p class="text-xs font-semibold text-slate-950 dark:text-white">Cloud Topology</p>
          <p class="font-mono text-[10px] text-slate-500 dark:text-zinc-400">3 active regions &bull; US / EU / AP</p>
        </div>
      </div>
      <button type="button" data-drw1-open class="cursor-pointer rounded-full bg-slate-950 dark:bg-white px-3.5 py-1.5 text-[11px] font-semibold text-white dark:text-slate-950 shadow-xs transition hover:bg-indigo-600 dark:hover:bg-zinc-200">+ Provision Cluster</button>
    </div>
    <div data-drw1-grid class="grid grid-cols-1 gap-3 p-5 sm:grid-cols-2">
      <div class="rounded-2xl border border-slate-200/90 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4">
        <div class="flex items-center justify-between"><span class="text-xs font-semibold">Edge API Gateway</span><span class="rounded-full bg-emerald-500/15 px-2 py-0.5 font-mono text-[9px] font-bold text-emerald-700 dark:text-emerald-300">LIVE</span></div>
        <p class="mt-1.5 font-mono text-[11px] text-slate-500 dark:text-zinc-400">iad1 &bull; Updated 14m ago by Elena</p>
      </div>
      <div class="rounded-2xl border border-slate-200/90 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4">
        <div class="flex items-center justify-between"><span class="text-xs font-semibold">Stripe Webhook Relay</span><span class="rounded-full bg-indigo-500/15 px-2 py-0.5 font-mono text-[9px] font-bold text-indigo-700 dark:text-indigo-300">SYNC</span></div>
        <p class="mt-1.5 font-mono text-[11px] text-slate-500 dark:text-zinc-400">fra1 &bull; Updated 2h ago by Henrik</p>
      </div>
    </div>
  </div>

  <!-- Blurred Scrim Backdrop -->
  <div data-drw1-backdrop class="absolute inset-0 bg-slate-950/30 dark:bg-black/60 backdrop-blur-[2px] opacity-0 pointer-events-none transition-opacity duration-300 group-data-[open=true]/d1:opacity-100 group-data-[open=true]/d1:pointer-events-auto"></div>

  <!-- Floating Inset Slide-Over Panel -->
  <aside role="dialog" aria-modal="true" aria-label="Provision cluster" class="absolute inset-y-3 right-3 flex w-[calc(100%-1.5rem)] max-w-sm flex-col overflow-hidden rounded-2xl border border-slate-200/90 dark:border-white/15 bg-white/95 dark:bg-[#121622]/95 shadow-2xl backdrop-blur-2xl translate-x-[112%] group-data-[open=true]/d1:translate-x-0 transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]">
    <div class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-indigo-400/60 to-transparent"></div>
    <div class="flex items-start justify-between border-b border-slate-200/80 dark:border-white/10 px-5 py-4">
      <div>
        <span class="font-mono text-[9px] font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">NEW PROVISIONING</span>
        <h3 class="mt-0.5 text-sm font-bold text-slate-950 dark:text-white">Create Edge Workspace</h3>
      </div>
      <button type="button" data-drw1-close aria-label="Close drawer" class="cursor-pointer flex size-7 items-center justify-center rounded-lg border border-slate-200 dark:border-white/10 text-slate-500 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white transition">
        <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="flex-1 space-y-4 overflow-y-auto p-5 text-xs">
      <!-- Live Endpoint Preview Pill -->
      <div class="flex items-center justify-between rounded-xl border border-indigo-200/80 dark:border-indigo-400/20 bg-indigo-50/70 dark:bg-indigo-500/10 px-3 py-2 font-mono text-[10px]">
        <span data-drw1-preview class="truncate font-semibold text-indigo-700 dark:text-indigo-200">dune-telemetry.edge.dev</span>
        <span class="shrink-0 rounded bg-emerald-500/15 px-1.5 py-0.5 text-[9px] font-bold text-emerald-700 dark:text-emerald-300">TLS 1.3</span>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-700 dark:text-zinc-300">Workspace slug</label>
        <input data-drw1-name type="text" value="Dune Telemetry" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-white/15 bg-slate-50/70 dark:bg-white/[0.04] px-3 py-2 text-xs font-medium text-slate-950 dark:text-white focus:border-indigo-500 focus:outline-none" />
      </div>

      <div>
        <span class="block text-[11px] font-semibold text-slate-700 dark:text-zinc-300">Primary Region</span>
        <div class="mt-1.5 grid grid-cols-3 gap-1.5 font-mono text-[10px]">
          <button type="button" data-drw1-reg="iad1" class="cursor-pointer rounded-lg border border-indigo-500 bg-indigo-50 dark:bg-indigo-500/20 py-1.5 font-bold text-indigo-700 dark:text-indigo-200">iad1 · US</button>
          <button type="button" data-drw1-reg="fra1" class="cursor-pointer rounded-lg border border-slate-200 dark:border-white/12 py-1.5 font-semibold text-slate-600 dark:text-zinc-400">fra1 · EU</button>
          <button type="button" data-drw1-reg="hnd1" class="cursor-pointer rounded-lg border border-slate-200 dark:border-white/12 py-1.5 font-semibold text-slate-600 dark:text-zinc-400">hnd1 · JP</button>
        </div>
      </div>

      <div>
        <span class="block text-[11px] font-semibold text-slate-700 dark:text-zinc-300">Access Policy</span>
        <div class="mt-1.5 grid grid-cols-2 gap-1 rounded-xl bg-slate-100 dark:bg-white/[0.05] p-1 text-[11px] font-semibold">
          <button type="button" data-drw1-vis="team" class="cursor-pointer rounded-lg bg-white dark:bg-white/15 py-1.5 text-slate-950 dark:text-white shadow-2xs">Team Only</button>
          <button type="button" data-drw1-vis="org" class="cursor-pointer rounded-lg py-1.5 text-slate-500 dark:text-zinc-400">Org Public</button>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between border-t border-slate-200/80 dark:border-white/10 bg-slate-50/80 dark:bg-white/[0.02] px-5 py-3.5">
      <button type="button" data-drw1-close class="cursor-pointer text-xs font-semibold text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">Cancel</button>
      <button type="button" data-drw1-save class="cursor-pointer rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white shadow-md shadow-indigo-500/25 transition hover:bg-indigo-500">Deploy Cluster &rarr;</button>
    </div>
  </aside>
</div>
<script>
(() => {
  document.querySelectorAll('[data-drw1]').forEach((root) => {
    const inp = root.querySelector('[data-drw1-name]');
    const prev = root.querySelector('[data-drw1-preview]');
    const grid = root.querySelector('[data-drw1-grid]');
    const save = root.querySelector('[data-drw1-save]');
    let region = 'iad1';
    const setOpen = (v) => root.setAttribute('data-open', String(v));
    root.querySelector('[data-drw1-open]')?.addEventListener('click', () => setOpen(true));
    root.querySelector('[data-drw1-backdrop]')?.addEventListener('click', () => setOpen(false));
    root.querySelectorAll('[data-drw1-close]').forEach((b) => b.addEventListener('click', () => setOpen(false)));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
    inp?.addEventListener('input', () => {
      const slug = (inp.value || 'workspace').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'workspace';
      if (prev) prev.textContent = slug + '.edge.dev';
    });
    const regBtns = root.querySelectorAll('[data-drw1-reg]');
    regBtns.forEach((b) => b.addEventListener('click', () => {
      region = b.getAttribute('data-drw1-reg') || 'iad1';
      regBtns.forEach((x) => { x.className = x === b ? 'cursor-pointer rounded-lg border border-indigo-500 bg-indigo-50 dark:bg-indigo-500/20 py-1.5 font-bold text-indigo-700 dark:text-indigo-200' : 'cursor-pointer rounded-lg border border-slate-200 dark:border-white/12 py-1.5 font-semibold text-slate-600 dark:text-zinc-400'; });
    }));
    const visBtns = root.querySelectorAll('[data-drw1-vis]');
    visBtns.forEach((b) => b.addEventListener('click', () => {
      visBtns.forEach((x) => { x.className = x === b ? 'cursor-pointer rounded-lg bg-white dark:bg-white/15 py-1.5 text-slate-950 dark:text-white shadow-2xs' : 'cursor-pointer rounded-lg py-1.5 text-slate-500 dark:text-zinc-400'; });
    }));
    save?.addEventListener('click', () => {
      const name = (inp?.value || 'New Cluster').trim();
      const card = document.createElement('div');
      card.className = 'rounded-2xl border border-indigo-200 dark:border-indigo-400/30 bg-white dark:bg-white/[0.04] p-4';
      card.innerHTML = '<div class="flex items-center justify-between"><span class="text-xs font-semibold"></span><span class="rounded-full bg-emerald-500/15 px-2 py-0.5 font-mono text-[9px] font-bold text-emerald-700 dark:text-emerald-300">LIVE</span></div><p class="mt-1.5 font-mono text-[11px] text-slate-500 dark:text-zinc-400"></p>';
      card.querySelector('span.text-xs').textContent = name;
      card.querySelector('p').textContent = region + ' · Provisioned just now';
      grid?.prepend(card);
      save.textContent = 'Provisioned ✓';
      setTimeout(() => { save.textContent = 'Deploy Cluster →'; setOpen(false); }, 650);
    });
  });
})();
</script>
