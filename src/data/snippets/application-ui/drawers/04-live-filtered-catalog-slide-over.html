<div data-drw4 data-open="true" class="group/d4 relative mx-auto h-[500px] w-full max-w-4xl overflow-hidden rounded-3xl border border-slate-200 dark:border-white/12 bg-slate-50 dark:bg-[#0B0D13] text-slate-900 dark:text-zinc-100 shadow-lg">
  <!-- Background Live Template Grid -->
  <div class="flex h-full flex-col transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] origin-right group-data-[open=true]/d4:scale-[0.97] group-data-[open=true]/d4:rounded-2xl">
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-white/10 bg-white dark:bg-[#11141E] px-5 py-3.5">
      <div class="flex items-center gap-2.5">
        <button type="button" data-drw4-open class="cursor-pointer inline-flex items-center gap-2 rounded-xl border border-slate-200 dark:border-white/15 bg-slate-50 dark:bg-white/5 px-3 py-1.5 text-xs font-semibold hover:border-indigo-500 transition">
          <span>Filters</span>
          <span data-drw4-count class="rounded-full bg-indigo-600 px-1.5 py-0.5 font-mono text-[9px] text-white">2</span>
        </button>
        <p data-drw4-shown class="font-mono text-[11px] text-slate-500 dark:text-zinc-400">Showing 4 of 6 kits</p>
      </div>
      <span class="font-mono text-[10px] text-slate-400">TAILWIND v4 DIRECTORY</span>
    </div>

    <div data-drw4-grid class="grid grid-cols-1 gap-3 p-5 sm:grid-cols-3 text-xs">
      <div data-fw="astro" class="rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4"><span class="font-mono text-[9px] text-indigo-600 dark:text-indigo-400">ASTRO</span><p class="mt-1 font-bold">Orbital Docs Shell</p></div>
      <div data-fw="react" class="rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4"><span class="font-mono text-[9px] text-sky-600 dark:text-sky-400">REACT 19</span><p class="mt-1 font-bold">Treasury Dashboard</p></div>
      <div data-fw="astro" class="rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4"><span class="font-mono text-[9px] text-indigo-600 dark:text-indigo-400">ASTRO</span><p class="mt-1 font-bold">Monograph Lookbook</p></div>
      <div data-fw="vue" class="hidden rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4"><span class="font-mono text-[9px] text-emerald-600 dark:text-emerald-400">VUE 3</span><p class="mt-1 font-bold">Commerce Cart Flow</p></div>
      <div data-fw="react" class="rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4"><span class="font-mono text-[9px] text-sky-600 dark:text-sky-400">REACT 19</span><p class="mt-1 font-bold">Telemetry Console</p></div>
      <div data-fw="vue" class="hidden rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/[0.03] p-4"><span class="font-mono text-[9px] text-emerald-600 dark:text-emerald-400">VUE 3</span><p class="mt-1 font-bold">Settings Sheet</p></div>
    </div>
  </div>

  <div data-drw4-bg class="absolute inset-0 bg-slate-950/30 dark:bg-black/60 backdrop-blur-[2px] opacity-0 pointer-events-none transition-opacity duration-300 group-data-[open=true]/d4:opacity-100 group-data-[open=true]/d4:pointer-events-auto"></div>

  <!-- Floating Left Filter Drawer -->
  <aside role="dialog" aria-modal="true" aria-label="Filter catalog" class="absolute inset-y-3 left-3 flex w-[calc(100%-1.5rem)] max-w-xs flex-col overflow-hidden rounded-2xl border border-slate-200 dark:border-white/15 bg-white dark:bg-[#121622] shadow-2xl -translate-x-[112%] group-data-[open=true]/d4:translate-x-0 transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]">
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-white/10 px-5 py-4">
      <h3 class="text-sm font-bold">Filter Kits</h3>
      <button type="button" data-drw4-close aria-label="Close filters" class="cursor-pointer flex size-7 items-center justify-center rounded-lg border border-slate-200 dark:border-white/10 text-slate-500 hover:text-slate-950 dark:hover:text-white">
        <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="flex-1 space-y-5 overflow-y-auto p-5 text-xs">
      <div>
        <p class="font-mono text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400">Runtime Stack</p>
        <div class="mt-2.5 space-y-2">
          <label class="flex cursor-pointer items-center justify-between rounded-xl border border-slate-200 dark:border-white/10 px-3 py-2 hover:border-indigo-400">
            <span class="flex items-center gap-2 font-medium"><input type="checkbox" value="astro" checked data-drw4-chk class="rounded accent-indigo-600" /> Astro 7 + Tailwind</span>
            <span class="font-mono text-[10px] text-slate-400">2</span>
          </label>
          <label class="flex cursor-pointer items-center justify-between rounded-xl border border-slate-200 dark:border-white/10 px-3 py-2 hover:border-indigo-400">
            <span class="flex items-center gap-2 font-medium"><input type="checkbox" value="react" checked data-drw4-chk class="rounded accent-indigo-600" /> React 19 TSX</span>
            <span class="font-mono text-[10px] text-slate-400">2</span>
          </label>
          <label class="flex cursor-pointer items-center justify-between rounded-xl border border-slate-200 dark:border-white/10 px-3 py-2 hover:border-indigo-400">
            <span class="flex items-center gap-2 font-medium"><input type="checkbox" value="vue" data-drw4-chk class="rounded accent-indigo-600" /> Vue 3 SFC</span>
            <span class="font-mono text-[10px] text-slate-400">2</span>
          </label>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between border-t border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.02] px-5 py-3.5">
      <button type="button" data-drw4-reset class="cursor-pointer text-xs font-medium text-slate-500 hover:text-slate-900 dark:hover:text-white">Reset</button>
      <button type="button" data-drw4-close class="cursor-pointer rounded-xl bg-slate-950 dark:bg-white px-4 py-1.5 text-xs font-semibold text-white dark:text-slate-950">View Results</button>
    </div>
  </aside>
</div>
<script>
(() => {
  document.querySelectorAll('[data-drw4]').forEach((root) => {
    const chks = [...root.querySelectorAll('[data-drw4-chk]')];
    const items = [...root.querySelectorAll('[data-drw4-grid] > div')];
    const cnt = root.querySelector('[data-drw4-count]');
    const shown = root.querySelector('[data-drw4-shown]');
    const setOpen = (v) => root.setAttribute('data-open', String(v));
    const sync = () => {
      const active = chks.filter((c) => c.checked).map((c) => c.value);
      if (cnt) cnt.textContent = String(active.length);
      let visCount = 0;
      items.forEach((it) => {
        const show = active.length === 0 || active.includes(it.getAttribute('data-fw'));
        it.classList.toggle('hidden', !show);
        if (show) visCount++;
      });
      if (shown) shown.textContent = 'Showing ' + visCount + ' of 6 kits';
    };
    chks.forEach((c) => c.addEventListener('change', sync));
    root.querySelector('[data-drw4-reset]')?.addEventListener('click', () => { chks.forEach((c) => { c.checked = true; }); sync(); });
    root.querySelector('[data-drw4-open]')?.addEventListener('click', () => setOpen(true));
    root.querySelector('[data-drw4-bg]')?.addEventListener('click', () => setOpen(false));
    root.querySelectorAll('[data-drw4-close]').forEach((b) => b.addEventListener('click', () => setOpen(false)));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
  });
})();
</script>
