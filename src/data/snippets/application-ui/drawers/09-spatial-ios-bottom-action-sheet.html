<div data-drw9 data-open="true" class="group/d9 relative mx-auto h-[500px] w-full max-w-md overflow-hidden rounded-[32px] border-[6px] border-slate-900 dark:border-zinc-700 bg-slate-100 dark:bg-[#090B10] text-slate-900 dark:text-zinc-100 shadow-2xl">
  <!-- Background App Screen Pushing Back Into Depth -->
  <div class="flex h-full flex-col bg-white dark:bg-[#11141E] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] origin-top group-data-[open=true]/d9:scale-[0.92] group-data-[open=true]/d9:rounded-3xl">
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-white/10 px-5 py-4">
      <div><p class="font-mono text-[9px] uppercase tracking-widest text-indigo-600 dark:text-indigo-400">COMPONENT</p><p class="text-xs font-bold">Orbital Showcase</p></div>
      <button type="button" data-drw9-open class="cursor-pointer rounded-full bg-slate-950 dark:bg-white px-3.5 py-1.5 text-[11px] font-semibold text-white dark:text-slate-950">Export</button>
    </div>
    <div class="p-5 space-y-3">
      <div class="h-24 rounded-2xl bg-gradient-to-br from-indigo-500/15 via-sky-500/10 to-transparent border border-indigo-200/60 dark:border-white/10 p-4">
        <p class="text-xs font-bold">Ready to ship</p>
        <p class="mt-1 text-[11px] text-slate-500 dark:text-zinc-400">Zero external stylesheets required.</p>
      </div>
    </div>
  </div>

  <div data-drw9-bg class="absolute inset-0 bg-slate-950/35 dark:bg-black/60 backdrop-blur-[2px] opacity-0 pointer-events-none transition-opacity duration-300 group-data-[open=true]/d9:opacity-100 group-data-[open=true]/d9:pointer-events-auto"></div>

  <aside role="dialog" aria-modal="true" aria-label="Export options" class="absolute inset-x-0 bottom-0 rounded-t-3xl border-t border-slate-200 dark:border-white/15 bg-white dark:bg-[#151926] p-5 shadow-2xl translate-y-full group-data-[open=true]/d9:translate-y-0 transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]">
    <div class="mx-auto mb-3.5 h-1.5 w-11 rounded-full bg-slate-300 dark:bg-white/20"></div>
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-sm font-bold">Export Component Spec</h3>
        <p class="text-[11px] text-slate-500 dark:text-zinc-400">Select target runtime format</p>
      </div>
      <button type="button" data-drw9-close aria-label="Close sheet" class="cursor-pointer flex size-7 items-center justify-center rounded-full bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-zinc-300 hover:bg-slate-200">
        <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="mt-4 grid grid-cols-2 gap-2.5 text-xs">
      <button type="button" data-drw9-fmt="<section class='rounded-3xl p-6'>...</section>" class="cursor-pointer flex items-center gap-2.5 rounded-2xl border-2 border-indigo-500 bg-indigo-50/70 dark:bg-indigo-500/15 p-3 font-semibold"><span class="size-2.5 rounded-full bg-sky-500"></span>Tailwind v4</button>
      <button type="button" data-drw9-fmt="export function Showcase() { return <section /> }" class="cursor-pointer flex items-center gap-2.5 rounded-2xl border border-slate-200 dark:border-white/12 p-3 font-semibold hover:border-indigo-400"><span class="size-2.5 rounded-full bg-indigo-500"></span>React TSX</button>
      <button type="button" data-drw9-fmt="<template><section /></template>" class="cursor-pointer flex items-center gap-2.5 rounded-2xl border border-slate-200 dark:border-white/12 p-3 font-semibold hover:border-indigo-400"><span class="size-2.5 rounded-full bg-emerald-500"></span>Vue SFC</button>
      <button type="button" data-drw9-fmt="--color-surface: #ffffff;" class="cursor-pointer flex items-center gap-2.5 rounded-2xl border border-slate-200 dark:border-white/12 p-3 font-semibold hover:border-indigo-400"><span class="size-2.5 rounded-full bg-amber-500"></span>CSS Tokens</button>
    </div>

    <div class="mt-3.5 flex items-center justify-between gap-2 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-black/30 px-3 py-2 font-mono text-[10px]">
      <span data-drw9-code class="truncate text-slate-600 dark:text-zinc-300">&lt;section class='rounded-3xl p-6'&gt;...&lt;/section&gt;</span>
      <button type="button" data-drw9-copy class="cursor-pointer shrink-0 font-bold text-indigo-600 dark:text-indigo-400">Copy</button>
    </div>
  </aside>
</div>
<script>
(() => {
  document.querySelectorAll('[data-drw9]').forEach((root) => {
    const code = root.querySelector('[data-drw9-code]');
    const copy = root.querySelector('[data-drw9-copy]');
    const fmts = root.querySelectorAll('[data-drw9-fmt]');
    const setOpen = (v) => root.setAttribute('data-open', String(v));
    const onCls = 'cursor-pointer flex items-center gap-2.5 rounded-2xl border-2 border-indigo-500 bg-indigo-50/70 dark:bg-indigo-500/15 p-3 font-semibold';
    const offCls = 'cursor-pointer flex items-center gap-2.5 rounded-2xl border border-slate-200 dark:border-white/12 p-3 font-semibold hover:border-indigo-400';
    fmts.forEach((b) => b.addEventListener('click', () => {
      fmts.forEach((x) => { x.className = x === b ? onCls : offCls; });
      if (code) code.textContent = b.getAttribute('data-drw9-fmt') || '';
    }));
    copy?.addEventListener('click', () => {
      navigator.clipboard?.writeText(code?.textContent || '').catch(() => {});
      copy.textContent = 'Copied!';
      setTimeout(() => { copy.textContent = 'Copy'; }, 1400);
    });
    root.querySelector('[data-drw9-open]')?.addEventListener('click', () => setOpen(true));
    root.querySelector('[data-drw9-bg]')?.addEventListener('click', () => setOpen(false));
    root.querySelector('[data-drw9-close]')?.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
  });
})();
</script>
