<div data-huddle-bar class="flex flex-wrap items-center justify-center gap-3 text-slate-900 dark:text-zinc-100">
  <button type="button" class="inline-flex items-center gap-2 rounded-full bg-emerald-500 px-5 py-2.5 text-xs font-bold text-slate-950 shadow-sm transition hover:bg-emerald-400 cursor-pointer">
    <span class="relative flex size-2"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-slate-950 opacity-45"></span><span class="relative inline-flex size-2 rounded-full bg-slate-950"></span></span>
    Start Huddle
  </button>
  <button type="button" data-mute-btn aria-pressed="false" class="inline-flex items-center gap-2 rounded-full border border-slate-300 dark:border-white/15 bg-white dark:bg-zinc-900 px-4 py-2.5 text-xs font-semibold text-slate-900 dark:text-white transition hover:bg-slate-50 dark:hover:bg-zinc-800 cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5" aria-hidden="true"><path d="M8 1a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 8 1Z"/><path d="M3.5 7.5a.75.75 0 0 1 .75.75 3.75 3.75 0 0 0 7.5 0 .75.75 0 0 1 1.5 0 5.25 5.25 0 0 1-4.5 5.2v1.05h1.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5h1.5v-1.05A5.25 5.25 0 0 1 2.75 8.25a.75.75 0 0 1 .75-.75Z"/></svg>
    <span data-mute-label>Mute Mic</span>
  </button>
  <button type="button" aria-label="Leave huddle" class="flex size-10 items-center justify-center rounded-full bg-rose-600 text-white shadow-sm transition hover:bg-rose-500 cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4" aria-hidden="true"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
  </button>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-huddle-bar]');
      const muteBtn = root.querySelector('[data-mute-btn]');
      const label = root.querySelector('[data-mute-label]');
      muteBtn?.addEventListener('click', () => {
        const muted = muteBtn.getAttribute('aria-pressed') === 'true';
        muteBtn.setAttribute('aria-pressed', String(!muted));
        muteBtn.classList.toggle('text-rose-700', !muted);
        muteBtn.classList.toggle('dark:text-rose-400', !muted);
        label.textContent = muted ? 'Mute Mic' : 'Mic Muted';
      });
    })();
  </script>
</div>
