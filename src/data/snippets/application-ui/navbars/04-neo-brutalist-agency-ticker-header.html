  </div>
  <div class="flex items-center justify-between gap-2 px-4 sm:px-5 py-3">
    <div class="flex items-center gap-2.5">

      <span class="hidden lg:inline-flex rounded-md border-2 border-black bg-[#A3E635] px-2 py-0.5 font-mono text-[10px] font-black text-black">V.25</span>

    <nav class="hidden md:flex items-center gap-2 text-xs font-black uppercase tracking-wide text-black">

    </nav>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" data-brutal-cta class="rounded-lg border-2 border-black bg-[#A3E635] px-3.5 py-1.5 text-xs font-black uppercase text-black shadow-[2px_2px_0_0_#000] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none">Hire Us ↗</button>

<script>
  document.querySelectorAll('[data-brutal-nav]').forEach((nav) => {
    const cta = nav.querySelector('[data-brutal-cta]');
    cta?.addEventListener('click', () => {
      cta.textContent = cta.textContent?.includes('BOOKED') ? 'Hire Us ↗' : 'SLOT BOOKED ✓';
    });
    const mBtn = nav.querySelector('[data-mobile-toggle]');
    const mDrawer = nav.querySelector('[data-mobile-drawer]');
    mBtn?.addEventListener('click', () => {
      const open = mBtn.getAttribute('aria-expanded') === 'true';
      mBtn.setAttribute('aria-expanded', String(!open));
      mDrawer?.classList.toggle('hidden', open);
      mDrawer?.classList.toggle('flex', !open);
    });
  });
</script>
