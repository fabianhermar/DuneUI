<script>
  document.querySelectorAll('[data-drawer-nav]').forEach((nav) => {
    const btn = nav.querySelector('[data-nav-toggle]');
    const label = nav.querySelector('[data-toggle-label]');
    const panel = nav.querySelector('[data-nav-panel]');
    btn?.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      if (label) label.textContent = open ? 'Index' : 'Close';
      panel?.classList.toggle('hidden', open);
      panel?.classList.toggle('grid', !open);
    });
  });
</script>
