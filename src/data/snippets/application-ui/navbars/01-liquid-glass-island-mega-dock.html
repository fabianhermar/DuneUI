<script>
  document.querySelectorAll('[data-glass-nav]').forEach((root) => {
    const closeBtn = root.querySelector('[data-announce-close]');
    const announce = root.querySelector('[data-glass-announce]');
    closeBtn?.addEventListener('click', () => announce?.classList.add('hidden'));
    const megaBtn = root.querySelector('[data-glass-mega-btn]');
    const megaPanel = root.querySelector('[data-glass-mega]');
    megaBtn?.addEventListener('click', () => {
      const open = megaBtn.getAttribute('aria-expanded') === 'true';
      megaBtn.setAttribute('aria-expanded', String(!open));
      megaPanel?.classList.toggle('hidden', open);
      megaPanel?.classList.toggle('grid', !open);
    });
    const links = Array.from(root.querySelectorAll('[data-glass-link]'));
    links.forEach((btn) => {
      btn.addEventListener('click', () => {
        links.forEach((el) => {
          el.className = 'rounded-full px-3 py-1 text-slate-700 dark:text-zinc-200 transition hover:text-slate-950 dark:hover:text-white';
        });
        btn.className = 'rounded-full bg-white dark:bg-zinc-800 px-3 py-1 font-semibold text-slate-900 dark:text-white shadow-xs transition';
      });
    });
    const mBtn = root.querySelector('[data-mobile-toggle]');
    const mDrawer = root.querySelector('[data-mobile-drawer]');
    mBtn?.addEventListener('click', () => {
      const open = mBtn.getAttribute('aria-expanded') === 'true';
      mBtn.setAttribute('aria-expanded', String(!open));
      mDrawer?.classList.toggle('hidden', open);
      mDrawer?.classList.toggle('flex', !open);
    });
  });
</script>
