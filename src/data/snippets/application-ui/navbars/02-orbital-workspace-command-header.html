<header data-orbit-nav class="w-full overflow-hidden rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 shadow-xl text-slate-800 dark:text-zinc-200">
  <div class="h-0.5 w-full bg-gradient-to-r from-indigo-500 via-sky-500 to-emerald-500"></div>
  <div class="flex items-center justify-between gap-2 px-3.5 sm:px-5 py-3">
    <div class="flex min-w-0 items-center gap-3 sm:gap-5">
      <a href="#" class="flex items-center gap-2 font-semibold text-sm text-slate-900 dark:text-white shrink-0">
        <span class="flex size-7 items-center justify-center rounded-lg bg-indigo-600 text-white shadow-xs">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="7"/><path d="M12 5v14"/></svg>
        </span>
        <span>Orbit</span>
      </a>
      <button type="button" data-env-btn class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-2.5 py-1 text-[11px] font-medium text-slate-700 dark:text-zinc-200 shrink-0">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        <span data-env-label>acme-prod</span>
        <span class="rounded bg-indigo-50 dark:bg-indigo-500/20 px-1 py-0.5 text-[9px] font-bold uppercase text-indigo-700 dark:text-indigo-300">Pro</span>
      </button>
      <nav class="hidden lg:flex items-center gap-1 text-xs">
        <button type="button" data-orbit-tab class="rounded-lg bg-slate-100 dark:bg-zinc-800 px-2.5 py-1.5 font-semibold text-slate-900 dark:text-white">Overview</button>
        <button type="button" data-orbit-tab class="rounded-lg px-2.5 py-1.5 font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">Deployments <span class="ml-1 rounded bg-slate-200/70 dark:bg-zinc-800 px-1 text-[10px]">4</span></button>
        <button type="button" data-orbit-tab class="rounded-lg px-2.5 py-1.5 font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">Traces</button>
        <button type="button" data-orbit-tab class="rounded-lg px-2.5 py-1.5 font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">Logs</button>
      </nav>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" data-orbit-cmd aria-expanded="false" class="hidden sm:flex items-center gap-3 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 px-3 py-1.5 text-xs text-slate-600 dark:text-zinc-300 transition hover:border-slate-300 dark:hover:border-zinc-700">
        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/></svg>
        <span>Quick jump...</span>
        <kbd class="rounded bg-white dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-[10px] font-semibold ring-1 ring-slate-200 dark:ring-zinc-700">⌘K</kbd>
      </button>
      <div class="hidden sm:flex -space-x-2">
        <img src="/images/avatars/sofia.jpg" alt="Sofia" class="size-7 rounded-full object-cover ring-2 ring-white dark:ring-zinc-950" />
        <img src="/images/avatars/mateo.jpg" alt="Mateo" class="size-7 rounded-full object-cover ring-2 ring-white dark:ring-zinc-950" />
      </div>
      <a href="#" class="hidden sm:inline-flex items-center gap-1 rounded-xl bg-slate-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-slate-950">+ Deploy</a>
      <button type="button" data-mobile-toggle aria-expanded="false" aria-label="Open workspace menu" class="inline-flex lg:hidden size-8 items-center justify-center rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 text-slate-800 dark:text-zinc-200">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z" clip-rule="evenodd"/></svg>
      </button>
    </div>
  </div>
  <div data-cmd-bar class="hidden border-t border-slate-100 dark:border-zinc-800 bg-slate-50/70 dark:bg-zinc-900/70 px-4 py-2.5 text-xs">
    <input type="search" placeholder="Jump to project, deployment SHA, or log stream..." class="w-full bg-transparent text-slate-900 dark:text-white placeholder:text-slate-500 dark:placeholder:text-zinc-400 focus:outline-none" />
  </div>
  <nav data-mobile-drawer class="hidden lg:hidden flex-col gap-1 border-t border-slate-100 dark:border-zinc-800 p-3 text-xs font-medium">
    <a href="#" class="rounded-lg bg-slate-100 dark:bg-zinc-800 px-3 py-2 font-semibold text-slate-900 dark:text-white">Overview</a>
    <a href="#" class="flex items-center justify-between rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300"><span>Deployments</span><span class="rounded bg-slate-200 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-[10px]">4</span></a>
    <a href="#" class="rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300">Traces &amp; Logs</a>
    <a href="#" class="mt-2 rounded-xl bg-indigo-600 py-2 text-center font-semibold text-white">+ Deploy acme-prod</a>
  </nav>
</header>
<script>
  document.querySelectorAll('[data-orbit-nav]').forEach((nav) => {
    const envBtn = nav.querySelector('[data-env-btn]');
    const envLabel = nav.querySelector('[data-env-label]');
    envBtn?.addEventListener('click', () => {
      if (envLabel) envLabel.textContent = envLabel.textContent === 'acme-prod' ? 'acme-staging' : 'acme-prod';
    });
    const tabs = Array.from(nav.querySelectorAll('[data-orbit-tab]'));
    tabs.forEach((btn) => {
      btn.addEventListener('click', () => {
        tabs.forEach((el) => {
          el.className = 'rounded-lg px-2.5 py-1.5 font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white';
        });
        btn.className = 'rounded-lg bg-slate-100 dark:bg-zinc-800 px-2.5 py-1.5 font-semibold text-slate-900 dark:text-white';
      });
    });
    const cmdBtn = nav.querySelector('[data-orbit-cmd]');
    const cmdBar = nav.querySelector('[data-cmd-bar]');
    cmdBtn?.addEventListener('click', () => {
      const open = cmdBtn.getAttribute('aria-expanded') === 'true';
      cmdBtn.setAttribute('aria-expanded', String(!open));
      cmdBar?.classList.toggle('hidden', open);
    });
    const mBtn = nav.querySelector('[data-mobile-toggle]');
    const mDrawer = nav.querySelector('[data-mobile-drawer]');
    mBtn?.addEventListener('click', () => {
      const open = mBtn.getAttribute('aria-expanded') === 'true';
      mBtn.setAttribute('aria-expanded', String(!open));
      mDrawer?.classList.toggle('hidden', open);
      mDrawer?.classList.toggle('flex', !open);
    });
  });
</script>
