<header data-market-nav class="w-full overflow-hidden rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-lg text-slate-900 dark:text-zinc-100">
  <div class="flex items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800 bg-stone-50 dark:bg-zinc-950/70 px-4 sm:px-5 py-1.5 text-[10px] font-semibold tracking-wider uppercase text-stone-600 dark:text-zinc-400">
    <span class="truncate">Curated from 140+ independent studios</span>
    <div class="flex items-center gap-3 shrink-0">
      <button type="button" data-currency-btn class="hover:text-stone-950 dark:hover:text-white">USD $</button>
      <a href="#" class="hidden sm:inline hover:text-stone-950 dark:hover:text-white">Sell</a>

  <div class="flex flex-col gap-3 px-4 sm:px-5 py-3.5 md:flex-row md:items-center md:justify-between">

      <div class="flex items-center gap-4">
        <a href="#" class="flex items-center gap-2 text-base font-bold tracking-tight text-slate-900 dark:text-white">
          <span class="flex size-7 items-center justify-center rounded-lg bg-amber-500 text-slate-950 font-black text-xs">B</span>
          <span>Bazaar</span>
        </a>
        <nav class="hidden lg:flex items-center gap-4 text-xs font-medium text-slate-600 dark:text-zinc-300">
          <a href="#" class="text-slate-900 dark:text-white font-semibold">Ceramics</a>
          <a href="#" class="hover:text-slate-900 dark:hover:text-white">Lighting</a>
          <a href="#" class="hover:text-slate-900 dark:hover:text-white">Objects</a>
        </nav>
      </div>
      <div class="flex items-center gap-2 md:hidden">
        <a href="#" class="rounded-xl bg-slate-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-slate-950">Cart (3)</a>
        <button type="button" data-mobile-toggle aria-expanded="false" aria-label="Menu" class="inline-flex size-8 items-center justify-center rounded-xl border border-slate-200 dark:border-zinc-700 text-slate-800 dark:text-zinc-200">
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z" clip-rule="evenodd"/></svg>
        </button>
      </div>
    </div>
    <div class="flex flex-1 md:max-w-sm items-center gap-2 rounded-xl border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-950/60 px-3 py-2 text-xs">
      <svg class="h-4 w-4 shrink-0 text-slate-400 dark:text-zinc-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/></svg>
      <input type="search" placeholder="Search lamps, ceramics, walnut..." class="w-full min-w-0 bg-transparent text-slate-900 dark:text-zinc-100 placeholder:text-slate-400 dark:placeholder:text-zinc-500 focus:outline-none" />
      <kbd class="hidden sm:inline rounded bg-white dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-[10px] font-semibold text-slate-500 dark:text-zinc-400 ring-1 ring-slate-200 dark:ring-zinc-700">/</kbd>
    </div>
    <div class="hidden md:flex items-center gap-3 text-xs font-semibold shrink-0">
      <a href="#" class="text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white">Saved (4)</a>
      <img src="/images/avatars/mateo.jpg" alt="Mateo Ruiz" class="size-7 rounded-full object-cover ring-1 ring-slate-200 dark:ring-zinc-700" />
      <a href="#" class="rounded-xl bg-slate-900 dark:bg-white px-3.5 py-2 text-white dark:text-slate-950 transition hover:bg-slate-800 dark:hover:bg-zinc-200">Cart (3)</a>

  <nav data-mobile-drawer class="hidden md:hidden flex-col gap-1 border-t border-slate-100 dark:border-zinc-800 p-3 text-xs font-medium">

    <a href="#" class="rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300">Architectural Lighting</a>
    <a href="#" class="rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300">Saved Wishlist (4)</a>
  </nav>
</header>
<script>
  document.querySelectorAll('[data-market-nav]').forEach((nav) => {
    const currencies = ['USD $', 'EUR €', 'JPY ¥'];
    let idx = 0;
    const cBtn = nav.querySelector('[data-currency-btn]');
    cBtn?.addEventListener('click', () => {
      idx = (idx + 1) % currencies.length;
      cBtn.textContent = currencies[idx];
    });
    const mBtn = nav.querySelector('[data-mobile-toggle]');
    const mDrawer = nav.querySelector('[data-mobile-drawer]');
    mBtn?.addEventListener('click', () => {
      const open = mBtn.getAttribute('aria-expanded') === 'true';
      mBtn.setAttribute('aria-expanded', String(!open));
      mDrawer?.classList.toggle('hidden', open);
      mDrawer?.classList.toggle('flex', !open);
    });
  });
</script>
