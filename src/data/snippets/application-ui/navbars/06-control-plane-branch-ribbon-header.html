<header data-ribbon-nav class="w-full overflow-hidden rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-md text-slate-900 dark:text-zinc-100">
  <div class="flex items-center justify-between gap-2 px-4 sm:px-5 py-3 border-b border-slate-100 dark:border-zinc-800">
    <div class="flex min-w-0 items-center gap-2 text-xs sm:text-sm font-semibold">
      <svg class="h-4 w-4 shrink-0 text-slate-900 dark:text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L21 19H3L12 3Z"/></svg>
      <span class="hidden sm:inline text-slate-500 dark:text-zinc-400 font-medium">acme-cloud</span>
      <span class="hidden sm:inline text-slate-300 dark:text-zinc-600">/</span>
      <span class="flex min-w-0 items-center gap-1.5 truncate">
        <span class="size-2 shrink-0 rounded-full bg-emerald-500"></span>
        <span class="truncate">billing-service</span>
      </span>
      <button type="button" data-branch-btn class="hidden md:inline-flex items-center gap-1 rounded-md border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 px-2 py-0.5 font-mono text-[10px] font-medium text-slate-700 dark:text-zinc-200">
        <span data-branch-label>main</span> ▾
      </button>
      <span class="hidden lg:inline-flex rounded-md bg-emerald-50 dark:bg-emerald-500/15 px-2 py-0.5 font-mono text-[10px] font-semibold text-emerald-700 dark:text-emerald-300">18ms · fra1</span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div class="hidden sm:flex -space-x-1.5 mr-1">
        <img src="/images/avatars/sofia.jpg" alt="Sofia" class="size-6 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900" />
        <img src="/images/avatars/mateo.jpg" alt="Mateo" class="size-6 rounded-full object-cover ring-2 ring-white dark:ring-zinc-900" />
      </div>
      <button type="button" class="hidden sm:inline-flex rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-zinc-200">Logs</button>
      <button type="button" data-deploy-btn class="rounded-lg bg-slate-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-slate-950">Deploy</button>
      <button type="button" data-mobile-toggle aria-expanded="false" aria-label="Menu" class="inline-flex sm:hidden size-8 items-center justify-center rounded-lg border border-slate-200 dark:border-zinc-700 text-slate-800 dark:text-zinc-200">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z" clip-rule="evenodd"/></svg>
      </button>
    </div>
  </div>
  <nav class="hidden sm:flex gap-5 overflow-x-auto px-4 sm:px-5 text-xs font-medium text-slate-600 dark:text-zinc-400">
    <button type="button" data-ribbon-tab class="border-b-2 border-slate-900 dark:border-white py-2.5 text-slate-900 dark:text-white font-semibold shrink-0">Overview</button>
    <button type="button" data-ribbon-tab class="border-b-2 border-transparent py-2.5 shrink-0 hover:text-slate-900 dark:hover:text-zinc-100">Deployments <span class="ml-1 rounded-full bg-slate-100 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-[10px] text-slate-700 dark:text-zinc-300">12</span></button>
    <button type="button" data-ribbon-tab class="border-b-2 border-transparent py-2.5 shrink-0 hover:text-slate-900 dark:hover:text-zinc-100">Analytics</button>
    <button type="button" data-ribbon-tab class="border-b-2 border-transparent py-2.5 shrink-0 hover:text-slate-900 dark:hover:text-zinc-100">Edge Functions</button>
    <button type="button" data-ribbon-tab class="border-b-2 border-transparent py-2.5 shrink-0 hover:text-slate-900 dark:hover:text-zinc-100">Env Vars</button>
    <button type="button" data-ribbon-tab class="border-b-2 border-transparent py-2.5 shrink-0 hover:text-slate-900 dark:hover:text-zinc-100">Settings</button>
  </nav>
  <nav data-mobile-drawer class="hidden sm:hidden flex-col gap-1 p-3 text-xs font-medium">
    <a href="#" class="rounded-lg bg-slate-100 dark:bg-zinc-800 px-3 py-2 font-semibold text-slate-900 dark:text-white">Overview</a>
    <a href="#" class="flex items-center justify-between rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300"><span>Deployments</span><span class="rounded-full bg-slate-100 dark:bg-zinc-800 px-1.5 font-mono text-[10px]">12</span></a>
    <a href="#" class="rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300">Analytics &amp; Edge Functions</a>
    <a href="#" class="rounded-lg px-3 py-2 text-slate-700 dark:text-zinc-300">Runtime Logs</a>
  </nav>
</header>
<script>
  document.querySelectorAll('[data-ribbon-nav]').forEach((nav) => {
    const branches = ['main', 'staging', 'canary'];
    let bIdx = 0;
    const bBtn = nav.querySelector('[data-branch-btn]');
    const bLabel = nav.querySelector('[data-branch-label]');
    bBtn?.addEventListener('click', () => {
      bIdx = (bIdx + 1) % branches.length;
      if (bLabel) bLabel.textContent = branches[bIdx];
    });
    const dBtn = nav.querySelector('[data-deploy-btn]');
    dBtn?.addEventListener('click', () => {
      dBtn.textContent = dBtn.textContent === 'Live ✓' ? 'Deploy' : 'Live ✓';
    });
    const tabs = Array.from(nav.querySelectorAll('[data-ribbon-tab]'));
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => {
          t.className = 'border-b-2 border-transparent py-2.5 shrink-0 hover:text-slate-900 dark:hover:text-zinc-100';
        });
        tab.className = 'border-b-2 border-slate-900 dark:border-white py-2.5 text-slate-900 dark:text-white font-semibold shrink-0';
      });
    });
    const mBtn = nav.querySelector('[data-mobile-toggle]');
    const mDrawer = nav.querySelector('[data-mobile-drawer]');
    mBtn?.addEventListener('click', () => {
      const open = mBtn.getAttribute('aria-expanded') === 'true';
      mBtn.setAttribute('aria-expanded', String(!open));
      mDrawer?.classList.toggle('hidden', open);
      mDrawer?.classList.toggle('flex', !open);
    });
  });
</script>
