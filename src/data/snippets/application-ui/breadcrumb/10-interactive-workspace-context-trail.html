  <script>
    (() => {
      const root = document.currentScript.closest('[data-ws-trail]');
      const toggle = root.querySelector('[data-ws-toggle]');
      const menu = root.querySelector('[data-ws-menu]');
      const nameEl = root.querySelector('[data-ws-name]');
      const badgeEl = root.querySelector('[data-ws-badge]');
      const docEl = root.querySelector('[data-ws-doc]');
      const setOpen = (open) => {
        toggle.setAttribute('aria-expanded', String(open));
        menu.classList.toggle('hidden', !open);
        menu.classList.toggle('inline-flex', open);
      };
      toggle?.addEventListener('click', () => setOpen(menu.classList.contains('hidden')));
      root.querySelectorAll('[data-ws-pick]').forEach((opt) => {
        opt.addEventListener('click', () => {
          const [team, initial, doc] = opt.dataset.wsPick.split('|');
          nameEl.textContent = team;
          badgeEl.textContent = initial;
          docEl.lastChild.textContent = ' ' + doc;
          setOpen(false);
        });
      });
    })();
