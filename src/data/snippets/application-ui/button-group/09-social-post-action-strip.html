<div data-social-strip class="flex justify-center text-slate-900 dark:text-zinc-100">
  <div class="inline-flex flex-wrap items-center gap-1.5 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-slate-100/80 dark:bg-zinc-900 p-1.5 text-xs font-semibold text-slate-700 dark:text-zinc-300">
    <button type="button" data-like aria-pressed="false" class="inline-flex items-center gap-1.5 rounded-xl bg-white dark:bg-zinc-800 px-3 py-1.5 shadow-xs ring-1 ring-slate-200 dark:ring-zinc-700 text-slate-800 dark:text-zinc-100 hover:text-rose-600 dark:hover:text-rose-400 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5 text-rose-500" aria-hidden="true"><path d="M8 14s-5.5-3.35-5.5-7.4A3.1 3.1 0 0 1 8 4.65 3.1 3.1 0 0 1 13.5 6.6C13.5 10.65 8 14 8 14Z"/></svg>
      <span data-like-count class="tabular-nums">318</span>
    </button>
    <button type="button" class="inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 hover:bg-white dark:hover:bg-zinc-800 hover:text-slate-950 dark:hover:text-white cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5 text-slate-500 dark:text-zinc-400" aria-hidden="true"><path fill-rule="evenodd" d="M2.5 3.75A1.75 1.75 0 0 1 4.25 2h7.5A1.75 1.75 0 0 1 13.5 3.75v5.5A1.75 1.75 0 0 1 11.75 11H6.66l-2.6 2.25A.65.65 0 0 1 3 12.76V11A1.75 1.75 0 0 1 2.5 9.25v-5.5Z" clip-rule="evenodd"/></svg>
      <span class="tabular-nums">42</span>
    </button>
    <button type="button" data-repost aria-pressed="false" class="inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 hover:bg-white dark:hover:bg-zinc-800 hover:text-emerald-700 dark:hover:text-emerald-400 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5 text-slate-500 dark:text-zinc-400" aria-hidden="true"><path fill-rule="evenodd" d="M13.836 2.477a.75.75 0 0 1 .75.75v3.182a.75.75 0 0 1-.75.75h-3.182a.75.75 0 0 1 0-1.5h1.37l-.84-.841a4.5 4.5 0 0 0-7.08.932.75.75 0 0 1-1.3-.75 6 6 0 0 1 9.44-1.242l.842.84V3.227a.75.75 0 0 1 .75-.75Zm-.911 7.5A.75.75 0 0 1 13.199 11a6 6 0 0 1-9.44 1.241l-.84-.84v1.371a.75.75 0 0 1-1.5 0V9.591a.75.75 0 0 1 .75-.75H5.35a.75.75 0 0 1 0 1.5H3.98l.841.841a4.5 4.5 0 0 0 7.08-.932.75.75 0 0 1 1.025-.273Z" clip-rule="evenodd"/></svg>
      <span data-repost-count class="tabular-nums">19</span>
    </button>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-social-strip]');
      const likeBtn = root.querySelector('[data-like]');
      const likeCount = root.querySelector('[data-like-count]');
      const repostBtn = root.querySelector('[data-repost]');
      const repostCount = root.querySelector('[data-repost-count]');
      likeBtn?.addEventListener('click', () => {
        const liked = likeBtn.getAttribute('aria-pressed') === 'true';
        likeBtn.setAttribute('aria-pressed', String(!liked));
        likeBtn.classList.toggle('text-rose-600', !liked);
        likeBtn.classList.toggle('dark:text-rose-400', !liked);
        likeCount.textContent = liked ? '318' : '319';
      });
      repostBtn?.addEventListener('click', () => {
        const active = repostBtn.getAttribute('aria-pressed') === 'true';
        repostBtn.setAttribute('aria-pressed', String(!active));
        repostBtn.classList.toggle('text-emerald-700', !active);
        repostBtn.classList.toggle('dark:text-emerald-400', !active);
        repostCount.textContent = active ? '19' : '20';
      });
    })();
  </script>
</div>
