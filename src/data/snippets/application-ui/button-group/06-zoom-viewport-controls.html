<div data-zoom-bar class="flex justify-center text-slate-900 dark:text-zinc-100">
  <div class="inline-flex items-center overflow-hidden rounded-xl border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 divide-x divide-slate-200 dark:divide-zinc-800 shadow-2xs">
    <button type="button" data-zoom-out aria-label="Zoom out" class="inline-flex items-center justify-center px-3 py-2 text-slate-700 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><path d="M3.75 7.25a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Z"/></svg>
    </button>
    <span data-zoom-val class="min-w-[4.25rem] px-3 py-2 text-center font-mono text-xs font-semibold tabular-nums text-slate-900 dark:text-zinc-100">100%</span>
    <button type="button" data-zoom-in aria-label="Zoom in" class="inline-flex items-center justify-center px-3 py-2 text-slate-700 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><path d="M8.75 3.75a.75.75 0 0 0-1.5 0v3.5h-3.5a.75.75 0 0 0 0 1.5h3.5v3.5a.75.75 0 0 0 1.5 0v-3.5h3.5a.75.75 0 0 0 0-1.5h-3.5v-3.5Z"/></svg>
    </button>
    <button type="button" data-zoom-fit class="px-3.5 py-2 text-xs font-semibold text-indigo-700 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-500/15 cursor-pointer transition-colors">Fit</button>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-zoom-bar]');
      const val = root.querySelector('[data-zoom-val]');
      let zoom = 100;
      const update = (next) => {
        zoom = Math.min(200, Math.max(50, next));
        val.textContent = zoom + '%';
      };
      root.querySelector('[data-zoom-out]')?.addEventListener('click', () => update(zoom - 25));
      root.querySelector('[data-zoom-in]')?.addEventListener('click', () => update(zoom + 25));
      root.querySelector('[data-zoom-fit]')?.addEventListener('click', () => update(100));
    })();
  </script>
</div>
