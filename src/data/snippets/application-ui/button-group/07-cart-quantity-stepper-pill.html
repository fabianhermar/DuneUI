<div data-qty-pill class="flex justify-center text-slate-900 dark:text-zinc-100">
  <div class="inline-flex items-center rounded-full border border-stone-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 p-1 shadow-2xs">
    <button type="button" data-qty-dec aria-label="Decrease quantity" class="flex size-8 items-center justify-center rounded-full text-stone-700 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-zinc-800 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><path d="M3.75 7.25a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Z"/></svg>
    </button>
    <span data-qty-val class="w-10 text-center font-mono text-xs font-bold tabular-nums text-stone-900 dark:text-stone-100">2</span>
    <button type="button" data-qty-inc aria-label="Increase quantity" class="flex size-8 items-center justify-center rounded-full text-stone-700 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-zinc-800 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-3.5"><path d="M8.75 3.75a.75.75 0 0 0-1.5 0v3.5h-3.5a.75.75 0 0 0 0 1.5h3.5v3.5a.75.75 0 0 0 1.5 0v-3.5h3.5a.75.75 0 0 0 0-1.5h-3.5v-3.5Z"/></svg>
    </button>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-qty-pill]');
      const val = root.querySelector('[data-qty-val]');
      let qty = 2;
      root.querySelector('[data-qty-dec]')?.addEventListener('click', () => {
        qty = Math.max(1, qty - 1);
        val.textContent = String(qty);
      });
      root.querySelector('[data-qty-inc]')?.addEventListener('click', () => {
        qty = Math.min(99, qty + 1);
        val.textContent = String(qty);
      });
    })();
  </script>
</div>
