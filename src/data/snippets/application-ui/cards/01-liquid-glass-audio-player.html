<article data-audio-card class="mx-auto w-full max-w-sm rounded-3xl border border-slate-900/12 dark:border-white/25 bg-white/80 dark:bg-white/12 p-5 text-slate-900 dark:text-white shadow-xl backdrop-blur-2xl">
  <div class="flex items-center gap-4">
    <img src="/images/ecommerce/headphones.jpg" alt="Solaris Drift Mix cover art" class="size-16 shrink-0 rounded-2xl object-cover shadow-md ring-1 ring-black/10 dark:ring-white/25" />
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1 rounded-full bg-indigo-600/10 dark:bg-sky-400/20 px-2 py-0.5 text-[10px] font-bold uppercase tracking-widest text-indigo-700 dark:text-sky-200">
          <span class="size-1.5 rounded-full bg-indigo-500 dark:bg-sky-300"></span>Lossless
        </span>
        <span class="font-mono text-[10px] text-slate-500 dark:text-white/65">24-bit</span>
      </div>
      <h3 class="mt-1 truncate text-base font-bold">Solaris Drift Mix</h3>
      <p class="truncate text-xs text-slate-600 dark:text-white/75">Koda &amp; Nami &middot; Studio Tape</p>
    </div>
    <button type="button" data-audio-fav aria-pressed="false" aria-label="Favorite track" class="flex size-8 shrink-0 items-center justify-center rounded-full text-slate-600 dark:text-white/75 hover:bg-slate-900/8 dark:hover:bg-white/15 cursor-pointer transition-colors">
      <svg data-fav-svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>
    </button>
  </div>
  <div class="mt-5">
    <div class="h-1.5 w-full overflow-hidden rounded-full bg-slate-900/12 dark:bg-white/20">
      <div class="h-full w-2/3 rounded-full bg-gradient-to-r from-indigo-600 to-sky-500 dark:from-sky-300 dark:to-white"></div>
    </div>
    <div class="mt-1.5 flex justify-between font-mono text-[10px] tabular-nums text-slate-600 dark:text-white/70">
      <span>02:14</span>
      <span>03:40</span>
    </div>
  </div>
  <div class="mt-3 flex items-center justify-center gap-5">
    <button type="button" aria-label="Previous track" class="flex size-8 items-center justify-center rounded-full text-slate-700 dark:text-white/80 hover:bg-slate-900/8 dark:hover:bg-white/15 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4"><path d="M3.25 3a.75.75 0 0 1 .75.75v3.52l6.97-3.98A.75.75 0 0 1 12 3.94v8.12a.75.75 0 0 1-1.03.65L4 8.73v3.52a.75.75 0 0 1-1.5 0v-8.5A.75.75 0 0 1 3.25 3Z"/></svg>
    </button>
    <button type="button" data-audio-play aria-pressed="true" aria-label="Pause playback" class="flex size-11 items-center justify-center rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-950 shadow-md transition hover:scale-105 cursor-pointer">
      <svg data-play-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4"><path d="M4.5 2.75a.75.75 0 0 0-.75.75v9a.75.75 0 0 0 1.5 0v-9a.75.75 0 0 0-.75-.75Zm7 0a.75.75 0 0 0-.75.75v9a.75.75 0 0 0 1.5 0v-9a.75.75 0 0 0-.75-.75Z"/></svg>
    </button>
    <button type="button" aria-label="Next track" class="flex size-8 items-center justify-center rounded-full text-slate-700 dark:text-white/80 hover:bg-slate-900/8 dark:hover:bg-white/15 cursor-pointer transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4"><path d="M12.75 3a.75.75 0 0 0-.75.75v3.52L5.03 3.29A.75.75 0 0 0 4 3.94v8.12a.75.75 0 0 0 1.03.65L12 8.73v3.52a.75.75 0 0 0 1.5 0v-8.5a.75.75 0 0 0-.75-.75Z"/></svg>
    </button>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-audio-card]');
      const playBtn = root.querySelector('[data-audio-play]');
      const icon = root.querySelector('[data-play-icon]');
      const favBtn = root.querySelector('[data-audio-fav]');
      const favSvg = root.querySelector('[data-fav-svg]');
      const pauseSvg = '<path d="M4.5 2.75a.75.75 0 0 0-.75.75v9a.75.75 0 0 0 1.5 0v-9a.75.75 0 0 0-.75-.75Zm7 0a.75.75 0 0 0-.75.75v9a.75.75 0 0 0 1.5 0v-9a.75.75 0 0 0-.75-.75Z"/>';
      const playSvg = '<path d="M4.5 3.1a.75.75 0 0 1 1.13-.65l7.5 4.4a.75.75 0 0 1 0 1.3l-7.5 4.4A.75.75 0 0 1 4.5 11.9V3.1Z"/>';
      playBtn?.addEventListener('click', () => {
        const playing = playBtn.getAttribute('aria-pressed') === 'true';
        playBtn.setAttribute('aria-pressed', String(!playing));
        icon.innerHTML = playing ? playSvg : pauseSvg;
      });
      favBtn?.addEventListener('click', () => {
        const liked = favBtn.getAttribute('aria-pressed') === 'true';
        favBtn.setAttribute('aria-pressed', String(!liked));
        favBtn.classList.toggle('text-rose-500', !liked);
        favSvg.setAttribute('fill', liked ? 'none' : 'currentColor');
      });
    })();
  </script>
</article>
