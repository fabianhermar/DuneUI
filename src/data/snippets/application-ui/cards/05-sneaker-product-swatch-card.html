<article data-product-card class="mx-auto w-full max-w-xs overflow-hidden rounded-2xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm text-slate-900 dark:text-zinc-100">
  <div class="relative h-48 overflow-hidden bg-stone-100 dark:bg-zinc-800">
    <img src="/images/ecommerce/sneaker.jpg" alt="Aero Runner Carbon sneaker" class="h-full w-full object-cover" />
    <span class="absolute top-3 left-3 rounded-full bg-white/95 dark:bg-zinc-900/90 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-stone-900 dark:text-stone-100 shadow-xs ring-1 ring-black/5 dark:ring-white/10">Limited Drop</span>
    <button type="button" data-wish aria-pressed="false" aria-label="Save to wishlist" class="absolute top-3 right-3 flex size-8 items-center justify-center rounded-full bg-white/95 dark:bg-zinc-900/90 text-stone-700 dark:text-zinc-200 shadow-xs ring-1 ring-black/5 dark:ring-white/10 cursor-pointer transition-colors">
      <svg data-wish-svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>
    </button>
  </div>
  <div class="p-4">
    <div class="flex items-start justify-between gap-2">
      <div>
        <h3 class="text-sm font-bold text-stone-950 dark:text-white">Aero Runner Carbon</h3>
        <p class="mt-0.5 text-xs text-stone-600 dark:text-zinc-400">Recycled knit &middot; <span data-color-name>Obsidian</span></p>
      </div>
      <span class="font-mono text-sm font-bold text-stone-950 dark:text-white">$195</span>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <div class="flex items-center gap-2" role="group" aria-label="Colorways">
        <button type="button" data-swatch="Obsidian" aria-label="Obsidian" class="size-4 rounded-full bg-stone-900 ring-2 ring-offset-2 ring-stone-900 dark:ring-white dark:ring-offset-zinc-900 cursor-pointer"></button>
        <button type="button" data-swatch="Terracotta" aria-label="Terracotta" class="size-4 rounded-full bg-amber-700 cursor-pointer"></button>
        <button type="button" data-swatch="Pine" aria-label="Pine" class="size-4 rounded-full bg-emerald-700 cursor-pointer"></button>
      </div>
      <button type="button" data-add-bag class="inline-flex items-center gap-1 rounded-lg bg-stone-900 dark:bg-white px-3 py-1.5 text-xs font-semibold text-white dark:text-slate-950 hover:bg-stone-800 dark:hover:bg-zinc-200 cursor-pointer transition-colors">+ Bag</button>
    </div>
  </div>
  <script>
    (() => {
      const root = document.currentScript.closest('[data-product-card]');
      const colorName = root.querySelector('[data-color-name]');
      const swatches = root.querySelectorAll('[data-swatch]');
      const addBag = root.querySelector('[data-add-bag]');
      const wish = root.querySelector('[data-wish]');
      const wishSvg = root.querySelector('[data-wish-svg]');
      swatches.forEach((sw) => {
        sw.addEventListener('click', () => {
          swatches.forEach((s) => s.classList.remove('ring-2', 'ring-offset-2', 'ring-stone-900', 'dark:ring-white', 'dark:ring-offset-zinc-900'));
          sw.classList.add('ring-2', 'ring-offset-2', 'ring-stone-900', 'dark:ring-white', 'dark:ring-offset-zinc-900');
          colorName.textContent = sw.dataset.swatch;
        });
      });
      addBag?.addEventListener('click', () => {
        addBag.textContent = 'Added';
        setTimeout(() => { addBag.textContent = '+ Bag'; }, 1000);
      });
      wish?.addEventListener('click', () => {
        const liked = wish.getAttribute('aria-pressed') === 'true';
        wish.setAttribute('aria-pressed', String(!liked));
        wish.classList.toggle('text-rose-600', !liked);
        wishSvg.setAttribute('fill', liked ? 'none' : 'currentColor');
      });
    })();
  </script>
</article>
