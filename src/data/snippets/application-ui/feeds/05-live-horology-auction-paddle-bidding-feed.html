<div class="mx-auto w-full max-w-xl rounded-2xl border border-emerald-900/20 dark:border-emerald-800/50 bg-[#F4F6F3] dark:bg-[#0D1813] p-5 sm:p-6 text-xs text-stone-900 dark:text-stone-100 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-stone-200 dark:border-emerald-900/50 pb-4">
    <div class="flex items-center gap-3">
      <img src="/images/heroes/luxury-watch.jpg" alt="Chronograph" class="size-10 rounded-xl object-cover ring-1 ring-amber-500/40" />
      <div>
        <span class="font-mono text-[10px] font-bold uppercase text-amber-700 dark:text-amber-300">GENEVA SALEROOM &middot; LOT 42</span>
        <h3 class="font-serif text-base">Current Bid: <strong data-fd5-top class="font-mono">$74,000</strong></h3>
      </div>
    </div>
    <button type="button" data-fd5-bid class="cursor-pointer rounded-lg bg-amber-600 dark:bg-amber-400 px-3.5 py-2 font-mono text-[11px] font-bold text-white dark:text-stone-950 hover:opacity-90">Bid $76,000</button>
  </div>
  <ul data-fd5-list class="mt-4 space-y-2.5 font-mono text-[11px]">
    <li class="flex justify-between rounded-lg bg-white/80 dark:bg-emerald-950/50 px-3 py-2 border border-amber-500/30"><span>Paddle #118 (Geneva Floor)</span><strong class="text-amber-700 dark:text-amber-300">$74,000</strong></li>
    <li class="flex justify-between rounded-lg bg-white/50 dark:bg-emerald-950/25 px-3 py-2 text-stone-500 dark:text-stone-400"><span>Online Bidder (Zurich)</span><span>$72,000</span></li>
    <li class="flex justify-between rounded-lg bg-white/50 dark:bg-emerald-950/25 px-3 py-2 text-stone-500 dark:text-stone-400"><span>Telephone Desk 04</span><span>$70,000</span></li>
  </ul>
</div>
<script>
(function(){
  let top = 74000;
  const btn = document.querySelector('[data-fd5-bid]'), lbl = document.querySelector('[data-fd5-top]'), list = document.querySelector('[data-fd5-list]');
  btn?.addEventListener('click', () => {
    top += 2000;
    const fmt = '$' + top.toLocaleString('en-US');
    if (lbl) lbl.textContent = fmt;
    btn.textContent = 'Bid $' + (top + 2000).toLocaleString('en-US');
    const li = document.createElement('li');
    li.className = 'flex justify-between rounded-lg bg-emerald-500/15 px-3 py-2 border border-emerald-500/40';
    li.innerHTML = '<span>You (Online Paddle #409)</span><strong class="text-emerald-700 dark:text-emerald-300"></strong>';
    li.querySelector('strong').textContent = fmt;
    list?.prepend(li);
  });
})();
</script>
