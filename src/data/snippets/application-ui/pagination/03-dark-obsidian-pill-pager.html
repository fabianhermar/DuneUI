<nav data-obsidian-pager class="flex justify-center text-slate-900 dark:text-zinc-100">
  <div class="inline-flex items-center gap-1 rounded-full border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-1.5 shadow-lg text-xs font-medium">
    <button type="button" data-obs-prev aria-label="Previous page" class="flex size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-400 transition hover:bg-slate-100 dark:hover:bg-zinc-800 hover:text-slate-900 dark:hover:text-white">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
    </button>
    <button type="button" data-obs-num="1" class="flex size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">1</button>
    <button type="button" data-obs-num="2" class="flex size-8 items-center justify-center rounded-full bg-indigo-600 font-semibold text-white shadow-sm">2</button>
    <button type="button" data-obs-num="3" class="flex size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">3</button>
    <button type="button" data-obs-num="4" class="hidden sm:flex size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">4</button>
    <span class="hidden sm:inline px-1.5 text-slate-400 dark:text-zinc-600">…</span>
    <button type="button" data-obs-num="9" class="flex size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800">9</button>
    <button type="button" data-obs-next aria-label="Next page" class="flex size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-400 transition hover:bg-slate-100 dark:hover:bg-zinc-800 hover:text-slate-900 dark:hover:text-white">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
    </button>
  </div>
</nav>
<script>
  document.querySelectorAll('[data-obsidian-pager]').forEach((nav) => {
    const btns = Array.from(nav.querySelectorAll('[data-obs-num]'));
    let active = 2;
    const render = () => {
      btns.forEach((b) => {
        const val = Number(b.getAttribute('data-obs-num'));
        const extra = val === 4 ? 'hidden sm:flex ' : 'flex ';
        b.className = val === active
          ? extra + 'size-8 items-center justify-center rounded-full bg-indigo-600 font-semibold text-white shadow-sm'
          : extra + 'size-8 items-center justify-center rounded-full text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800';
      });
    };
    btns.forEach((b) => b.addEventListener('click', () => { active = Number(b.getAttribute('data-obs-num')); render(); }));
    nav.querySelector('[data-obs-prev]')?.addEventListener('click', () => { active = active === 9 ? 4 : Math.max(1, active - 1); render(); });
    nav.querySelector('[data-obs-next]')?.addEventListener('click', () => { active = active === 4 ? 9 : Math.min(9, active + 1); render(); });
  });
</script>
