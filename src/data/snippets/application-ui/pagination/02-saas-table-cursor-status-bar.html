<nav data-cursor-pager class="flex w-full max-w-2xl mx-auto flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-4 sm:px-5 py-3 shadow-sm text-xs text-slate-900 dark:text-zinc-100">
  <div class="flex items-center gap-3">
    <p class="text-slate-600 dark:text-zinc-400">Showing <strong data-cursor-range class="font-semibold text-slate-900 dark:text-white">1–25</strong> of <strong class="font-semibold text-slate-900 dark:text-white">480</strong></p>
    <span class="hidden sm:inline-flex items-center rounded-md border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800 px-2 py-0.5 font-mono text-[10px] font-medium text-slate-600 dark:text-zinc-300">25 / page</span>
  </div>
  <div class="inline-flex items-center overflow-hidden rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-2xs">
    <button type="button" data-cursor-prev class="inline-flex items-center gap-1 border-r border-slate-200 dark:border-zinc-700 px-3 py-1.5 font-semibold text-slate-600 dark:text-zinc-300 transition hover:bg-slate-50 dark:hover:bg-zinc-700">
      <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
      <span>Prev</span>
    </button>
    <span data-cursor-page class="px-3 py-1.5 font-mono text-[11px] font-semibold text-slate-800 dark:text-zinc-200 bg-slate-50/70 dark:bg-zinc-900/50">1 / 20</span>
    <button type="button" data-cursor-next class="inline-flex items-center gap-1 border-l border-slate-200 dark:border-zinc-700 px-3 py-1.5 font-semibold text-slate-900 dark:text-white transition hover:bg-slate-50 dark:hover:bg-zinc-700">
      <span>Next</span>
      <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
    </button>
  </div>
</nav>
<script>
  document.querySelectorAll('[data-cursor-pager]').forEach((nav) => {
    let page = 1;
    const range = nav.querySelector('[data-cursor-range]');
    const label = nav.querySelector('[data-cursor-page]');
    const update = () => {
      const start = (page - 1) * 25 + 1;
      const end = Math.min(page * 25, 480);
      if (range) range.textContent = start + '–' + end;
      if (label) label.textContent = page + ' / 20';
    };
    nav.querySelector('[data-cursor-prev]')?.addEventListener('click', () => { if (page > 1) { page--; update(); } });
    nav.querySelector('[data-cursor-next]')?.addEventListener('click', () => { if (page < 20) { page++; update(); } });
  });
</script>
