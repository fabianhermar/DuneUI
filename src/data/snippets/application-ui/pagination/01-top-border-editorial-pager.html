<nav data-top-pager class="flex w-full max-w-2xl mx-auto items-center justify-between border-t border-slate-200 dark:border-zinc-800 px-1 text-xs sm:text-sm font-medium text-slate-600 dark:text-zinc-400">
  <button type="button" data-pager-prev class="inline-flex items-center gap-1.5 border-t-2 border-transparent pt-3.5 pr-2 font-semibold text-slate-600 dark:text-zinc-300 transition hover:border-slate-300 dark:hover:border-zinc-600 hover:text-slate-950 dark:hover:text-white">
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17 10a.75.75 0 01-.75.75H5.612l4.158 3.96a.75.75 0 11-1.04 1.08l-5.5-5.25a.75.75 0 010-1.08l5.5-5.25a.75.75 0 111.04 1.08L5.612 9.25H16.25A.75.75 0 0117 10z" clip-rule="evenodd"/></svg>
    <span>Previous</span>
  </button>
  <div class="hidden sm:flex items-center">
    <button type="button" data-pager-num="1" class="border-t-2 border-indigo-600 dark:border-indigo-400 px-3.5 pt-3.5 -mt-px font-semibold text-indigo-600 dark:text-indigo-400">1</button>
    <button type="button" data-pager-num="2" class="border-t-2 border-transparent px-3.5 pt-3.5 -mt-px text-slate-600 dark:text-zinc-400 hover:border-slate-300 dark:hover:border-zinc-600 hover:text-slate-950 dark:hover:text-white">2</button>
    <button type="button" data-pager-num="3" class="border-t-2 border-transparent px-3.5 pt-3.5 -mt-px text-slate-600 dark:text-zinc-400 hover:border-slate-300 dark:hover:border-zinc-600 hover:text-slate-950 dark:hover:text-white">3</button>
    <span class="px-2 pt-3.5 text-slate-400 dark:text-zinc-600">…</span>
    <button type="button" data-pager-num="12" class="border-t-2 border-transparent px-3.5 pt-3.5 -mt-px text-slate-600 dark:text-zinc-400 hover:border-slate-300 dark:hover:border-zinc-600 hover:text-slate-950 dark:hover:text-white">12</button>
  </div>
  <span data-pager-mobile class="sm:hidden pt-3.5 font-mono text-xs font-semibold text-slate-800 dark:text-zinc-200">Page 1 of 12</span>
  <button type="button" data-pager-next class="inline-flex items-center gap-1.5 border-t-2 border-transparent pt-3.5 pl-2 font-semibold text-slate-900 dark:text-white transition hover:border-slate-300 dark:hover:border-zinc-600">
    <span>Next</span>
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd"/></svg>
  </button>
</nav>
<script>
  document.querySelectorAll('[data-top-pager]').forEach((nav) => {
    const nums = Array.from(nav.querySelectorAll('[data-pager-num]'));
    const mobile = nav.querySelector('[data-pager-mobile]');
    let current = 1;
    const render = () => {
      nums.forEach((btn) => {
        const active = Number(btn.getAttribute('data-pager-num')) === current;
        btn.className = active
          ? 'border-t-2 border-indigo-600 dark:border-indigo-400 px-3.5 pt-3.5 -mt-px font-semibold text-indigo-600 dark:text-indigo-400'
          : 'border-t-2 border-transparent px-3.5 pt-3.5 -mt-px text-slate-600 dark:text-zinc-400 hover:border-slate-300 dark:hover:border-zinc-600 hover:text-slate-950 dark:hover:text-white';
      });
      if (mobile) mobile.textContent = 'Page ' + current + ' of 12';
    };
    nums.forEach((btn) => btn.addEventListener('click', () => { current = Number(btn.getAttribute('data-pager-num')); render(); }));
    nav.querySelector('[data-pager-prev]')?.addEventListener('click', () => { if (current > 1) { current = current === 12 ? 3 : current - 1; render(); } });
    nav.querySelector('[data-pager-next]')?.addEventListener('click', () => { if (current < 12) { current = current === 3 ? 12 : current + 1; render(); } });
  });
</script>
