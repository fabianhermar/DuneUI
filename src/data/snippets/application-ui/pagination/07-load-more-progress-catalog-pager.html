<div data-load-pager class="mx-auto w-full max-w-sm rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5 text-center shadow-sm text-slate-900 dark:text-zinc-100">
  <div class="flex items-center justify-between text-xs">
    <span class="font-mono text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400">Studio Archive</span>
    <span data-load-pct class="font-mono text-[11px] font-semibold text-slate-900 dark:text-white">25%</span>
  </div>
  <p class="mt-2 text-xs text-slate-600 dark:text-zinc-300">Viewing <strong data-load-seen class="font-semibold text-slate-900 dark:text-white">24</strong> of <strong class="font-semibold text-slate-900 dark:text-white">96</strong> handcrafted objects</p>
  <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-zinc-800">
    <div data-load-bar class="h-full w-1/4 rounded-full bg-slate-900 dark:bg-white transition-all duration-300"></div>
  </div>
  <button type="button" data-load-btn class="mt-4 w-full rounded-xl bg-slate-900 dark:bg-white py-2.5 text-xs font-semibold text-white dark:text-slate-950 shadow-xs transition hover:bg-slate-800 dark:hover:bg-zinc-200">Load 24 more items</button>
</div>
<script>
  document.querySelectorAll('[data-load-pager]').forEach((root) => {
    let seen = 24;
    const seenEl = root.querySelector('[data-load-seen]');
    const pctEl = root.querySelector('[data-load-pct]');
    const barEl = root.querySelector('[data-load-bar]');
    const btn = root.querySelector('[data-load-btn]');
    btn?.addEventListener('click', () => {
      seen = seen >= 96 ? 24 : seen + 24;
      const pct = Math.round((seen / 96) * 100);
      if (seenEl) seenEl.textContent = String(seen);
      if (pctEl) pctEl.textContent = pct + '%';
      if (barEl) barEl.style.width = pct + '%';
      btn.textContent = seen >= 96 ? 'All 96 Loaded · Reset' : 'Load 24 more items';
    });
  });
</script>
